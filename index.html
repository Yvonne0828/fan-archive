<style>
  /* Layout: an archive index. Header, a ruled shelf of works, a sticky-bar reader with a paper "page".

    --kai:"STKaiti","Kaiti SC","KaiTi","BiauKai","AR PL UKai CN",serif;

  @media (prefers-color-scheme: dark){

      --accent:#8cc0b2; --accent-soft:rgba(140,192,178,0.14); --stamp:#e08a62; --stain:rgba(200,170,110,0.06);
      --shadow:rgba(0,0,0,0.6); --grain:0.05; --grain-blend:screen; color-scheme:dark;
    }
  }
  :root[data-theme="dark"]{
    --bg:#14181a; --paper:#191e20; --ink:#dcdfd6; --ink-soft:#9aa39e; --line:rgba(220,223,214,0.17);
    --accent:#8cc0b2; --accent-soft:rgba(140,192,178,0.14); --stamp:#e08a62; --stain:rgba(200,170,110,0.06);
    --shadow:rgba(0,0,0,0.6); --grain:0.05; --grain-blend:screen; color-scheme:dark;
  }

  html{ -webkit-text-size-adjust:100%; }
  body{
    margin:0; background:var(--bg); color:var(--ink);

  :focus-visible{ outline:2px solid var(--accent); outline-offset:3px; }

  .shell{ max-width:1080px; margin:0 auto; padding-inline:clamp(16px,5vw,40px); }

  /* ---------- top bar ---------- */
  .top{ display:flex; align-items:center; gap:12px; flex-wrap:wrap; padding-block:16px; border-bottom:1px solid var(--line); }

  .side{ display:flex; flex-direction:column; align-items:flex-start; gap:6px; font-size:.8rem; }

    display:inline-block; border:1.5px solid var(--stamp); color:var(--stamp); padding:2px 10px; margin-bottom:6px;

  }
  .lcd{ font-family:var(--mono); color:var(--stamp); text-shadow:0 0 1px var(--stamp); }

  /* ---------- footer ---------- */
  .foot{ margin-top:56px; padding-block:28px 56px; border-top:1px solid var(--line); font-size:.82rem; color:var(--ink-soft); }

  /* ---------- reader ---------- */
  .toc{ border-bottom:1px solid var(--line); background:var(--bg); }
  .toc ol{ list-style:none; margin:0 auto; padding:14px clamp(16px,5vw,40px); max-width:1080px; display:flex; flex-wrap:wrap; gap:6px 18px; }

  .page{
    max-width:44rem; margin:clamp(20px,4vw,44px) auto 20px;
    padding:clamp(28px,6vw,64px) clamp(20px,6vw,64px);
    background:var(--paper); border:1px solid var(--line); box-shadow:0 22px 40px -28px var(--shadow);
  }
  .page .kicker{ margin-bottom:10px; }
  .page h1{ font-size:clamp(1.7rem,5vw,2.4rem); line-height:1.25; margin:0 0 .35em; letter-spacing:.03em; text-wrap:balance; }
  .chtitle{ margin:0 0 1.6em; font-size:1.05rem; color:var(--ink-soft); }
  .body{ font-family:var(--read-font); font-size:var(--fs); line-height:2; }
  .body p{ margin:0 0 .6em; text-indent:2em; text-align:justify; text-justify:inter-ideograph; overflow-wrap:anywhere; }
  .body h2.sect{ font-family:var(--mono); font-size:.95rem; font-weight:400; letter-spacing:.3em; text-align:center; color:var(--ink-soft); margin:2.6em 0 1.4em; }
  .body h2.sect:first-child{ margin-top:.4em; }
  .body p.ornament{ text-indent:0; text-align:center; letter-spacing:.7em; margin:1.8em 0; color:var(--ink-soft); }
  .end{ margin:2.4em 0 0; text-align:center; font-family:var(--mono); font-size:.8rem; letter-spacing:.2em; color:var(--ink-soft); }
  .pager{ display:flex; justify-content:space-between; gap:12px; flex-wrap:wrap; max-width:44rem; margin:0 auto; }
  .pager .btn{ flex:1 1 9rem; text-align:center; }
  .pager .btn[aria-disabled="true"]{ opacity:.4; pointer-events:none; }

  @media (max-width:720px){
    .hero{ grid-template-columns:minmax(0,1fr); }
    .row{ grid-template-columns:2.4rem minmax(0,1fr); }
    .side{ grid-column:2; flex-direction:row; flex-wrap:wrap; align-items:center; gap:6px 14px; }
    .stamp{ margin-bottom:0; }
    .reader-top .ttl{ display:none; }
  }
  @media (prefers-reduced-motion: reduce){ .row h2 a{ transition:none; } }
</style>

<script id="content">
const SITE = {
  name: '河',
  title: 'Relics of my thoughts',
  tagline: '一些写给喜欢的人和故事的文字。',
  about: '这里收藏着我写过的同人故事。按照标签可以筛选，希望你能感受到我创作时的心情。',
  contact: '微博：@河流葬礼',
  disclaimer: '本站作品均为非商业同人创作，相关角色与设定的版权归原作者及版权方所有，如有侵权请联系我删除。',
};

const WORKS = [
  {
    id: 'qiandu',
    title: "前度",
    fandom: 'P1Harmony',
    pairing: '',
    rating: '',
    status: '完结',
    date: '2026-10-13',
    tags: [],
    summary: "死去的恋人回来了，不求财也不害命，他想找我要什么呢？",
    chapters: [
      { title: "正文", text: `## 1
九月要来了，天气不好，云层压下来。被夹在焦灼和凉爽之间，空调外机哀弱地运转，某阵雨后，彻底停下，躁动和喧哗一下子消失不见。如果考虑事实，这一切相当果断，不给人反应的时间。高温在体内留下一种惯性，并不随着自然的节律消除。起昊手心微微地出汗，被子是夏款，棉量稀薄，攥不出丰盈的面貌。他从床上坐起来，盯着晦暗的房间角落发呆。那里有一个架子，一层被碟片占满，另一层是相框，塑料膜后面嵌着相纸，宝丽来，成像效果不尽如人意，经过密闭保存，色调发白。和太洋在欧洲拍的，哪个国家，不太记得了，那次是去玩的，现在除了工作需要，起昊很少再去这么远的地方。
想到太洋，出现在眼前的东西有很多，这种视觉并不清晰，吉他、旧音响、分期付款买下的奢侈品包、荧光闪闪的手机屏。驳杂的影像在空间里游动。有些时候，这些回忆是一种慰藉，但大多数情况下，起昊并不会特别想起它们，他知道这没有好处。距离太洋离开已经过了很久，大概两年了。比起恋爱时共同经历的甜蜜故事，更常在梦中拜访起昊的是太洋最后的脸。黑色长发，适宜的卷度，平视前方、没有聚点的眼睛。那张照片是起昊选的，本来他没有这个权利，但除了起昊，甚至无法在太洋身边再找出一个能够执行这件事的人。他的朋友不是太远就是很少联络，家人也流散，活着的时候不觉得有什么，死了之后种种事情都落在起昊身上，连遗照也要他来挑。太洋应该以什么面貌留在世界上比较好，起昊为此思索了很长时间。奇怪的是，在处理那些工作时，就像处理真正的工作一样，没有剧烈的悲痛，或是突然间失去挚爱的眩晕。起昊完成了它们，提交了结果。太洋的葬礼十分简约，只请了一部分和他们关系比较亲近的朋友，没有盛大的花圈，没有人跪在地上为太洋哭一整晚。朋友们穿着黑色衣服来，起昊向他们颔首，把白花别在胸前。有人跟起昊说了些话，太洋是很好的人、太洋会上天堂的、早知道当时他问我借那把琴的时候应该借的。起昊点头，把这些哀悼不痛不痒地收进怀中，那一天结束的时候，费力地去想，好像已经想不起来了，总之叫他节哀。他回到家，走进浴室，低头，用水冲掉干硬发脆的发胶。刘海垂下来在视线里拉起一道灰色的帘，疲惫感像一张被子把他裹起来。原来比起伤心更多的是累。他想，这就是太洋最后给他留下的东西。他保持着这个姿势，直到颈椎处的酸痛延伸到整个脊柱，水顺着脖子流进衣服里，胸口湿了一块。洗手台面上，连太洋的牙刷和杯子都没来得及扔掉。起昊又想，算了，他也不是故意的。
前不久，他们的共友智雄到香港出差，起昊和他见了一面，那是他最近一次提起太洋。智雄在首尔当律师，是太洋的高中同学。他告诉起昊，以前学习压力大到真的想去死的时候，太洋偶尔会陪着他抽一根烟。毕业之后，第一次去纹身是和太洋一起，第一次喝酒到天亮也是和太洋一起。起昊听着，在脑海中想象高中的崔太洋。高中生太洋和高中生智雄凌晨从宿舍翻出去，到便利店买便宜的烧酒，被工业酒精辣的喉咙痛，还要装作能忍受的样子，不断地喝着，然后跑去厕所哗地全吐出来。
太洋也是会有这么狼狈的时候的，起昊说，可惜我没见到了。
他看着坐在对面，因为这句话露出同情的智雄，笑了一下。其实这并不是真的。恋爱中的太洋也不是完美的，起昊正是比任何人都清楚地知道这一点，才会在某个瞬间产生想和他在一起的想法。因为不是那种特别好的人，所以没有压力，犯错了下次改就好，前一天说过的话，如果不太重要，第二天就可以忘记。
这样挺好的。起昊和智雄碰杯，他们都是能自如地喝下高度酒也不会脸红的年纪了。现在的人不都是这样吗？别担心，智雄，我早就已经不难过了。
## 2
看到鸽子的时候，容易想起太洋。因为太洋说如果再出生一次的话，想变成鸽子，在天上飞来飞去，叼走游客手里的面包屑。美好的愿望。起昊评价，但鸽子也很可怜。太洋问为什么，起昊耸耸肩说，不知道，就是感觉挺可怜的。太洋哦了一声，不再问了。这属于不重要的话，太洋不会记住的。
偶尔路过维港，阳光把天和海都映得发白，景色十分宽阔。从高楼的窗户看下来，起昊的身影只是黑色的一个点，和鸟类也无甚分别。他在狭窄的人行道上停住，一两秒钟，商场里飘出来一股冷气，混合着淡淡的室内香氛。气味刚缠上他的足踝，马上逸散在步伐扬起的灰尘里。太洋应该不会变成香港的鸽子的。如果能带着记忆，大概只有在想他想到恨不得再死一次的时候才会出现。思及那种情况发生的概率，起昊笑了笑，掐断了念头。最近睡眠很差，总是梦到太洋，在梦中，太洋的形象非常模糊，站在他身边，却不说话，连脸都看不清楚，但起昊明确地知道那是太洋。太洋靠近的时候，他闻到一种香味，小时候奶奶家里刚洗完衣服的味道，宁静而湿润。这种味道附在太洋身上，从他的指尖传递过来。梦里他们牵着手。过分贴近现实的感觉使他害怕，如同某种征兆，提醒他那场意外留下的阴影仍时刻盘旋在头顶上方，发挥着它的作用。把快乐滤成瘦弱的一束，精准地刺进起昊的双脚，每走一步都落皮穿骨。他无视这些痛苦，勉力走了这么久，现在终于不堪其重，到了难以为继的时候。
起昊坐在会议室，把草图投影在屏幕上，跟客户讲解修改后的设计方案。客户称赞他，他知道这件事成了。然后他忽然觉得很累，他想回到那张能看见他与太洋的合照的床上，什么都不管地睡一觉，梦到太洋也好，梦不到也好。他想到今早没来得及喝咖啡，应该早点把坏掉的咖啡机换掉的。他工作很忙，要是太洋在，可以让他从琴行下班之后去买。虽然太洋不爱喝咖啡，也不懂咖啡机的好坏，说不定还会花冤枉钱，但要是太洋在，要是太洋在的话——起昊走出了公司，潮湿的空气沿着毛孔流入，一下子绞住神经——要是太洋在的话，好像不会过成这样。计程车到了，他坐进去，耳机插着，手机屏空空的，纯色的屏保，没有音乐软件的标识。他看向窗外，不远的岸边，水鸟低低地飞行，灰色羽毛留下的轨迹转眼消失。他收回视线，闭上眼睛。
回到家，输了密码进门，换鞋的间隙，看见走廊的尽头飘着一团黑影，以为是早晨没推进房间的衣架。开灯，抬起头，看清了那是什么，动作停下了，拖鞋啪的一声掉在地上。
我是疯了吧，还是我从来就没有清醒过。起昊不自觉地抹脸，掌心湿了，无暇去顾。他盯着那个人。我居然看见崔太洋了。
## 3
有关太洋的死因，说起来的话，需要先明确一件事，在整个事件中，太洋是极其无辜的，或者说，他被选为一个玩笑的牺牲品，因此失去了生命。杀死太洋的那个人并没有去坐牢，而是消失了。起昊猜测过，他可能与香港本地的黑道有所勾结，随机杀死一个琴行的工作人员，也许是他的入社考核，诸如此类。起昊并不了解这些，思考过程漏洞百出，像一个推理游戏。他本无意娱乐太洋的死亡，为了防止误会，从没和任何人说过他的想法。通缉的新闻登报，罪犯销声匿迹，悲剧像雨一样洒落，被人们的脚步踩过，顷刻干涸。他（那个人是男性）去了太洋工作的琴行，朝他开了枪，前两发子弹打在肩胛骨，最后一发才命中心脏。也就是说，太洋死前还遭受如此疼痛的折磨。起昊没有见过太洋的尸体，这种想象太恐怖，想象恋人肩膀上有两个子弹打出来的孔洞，意味着他仔细品味过死亡迫近时黑云压顶般硕大的忧惧与绝望，这比太洋的死本身更令起昊难以接受。这个世界上总有一些毫无理由的谋杀，当然，或许它们都是有理由的，只是太洋和起昊永远也无法知道。厄运选中了他们，于是死去的人只好含恨而死，活着的人只好含恨而活。
## 4
起昊小时候信教，辗转几个国家，从韩国到香港，母语习惯翻新好几次，十字架的光辉摇摇欲坠，遇到太洋之后，干脆一并丢弃，再也不信了。因此不知道死去的恋人再度出现，是凶兆还是福音。起昊怕鬼，但鬼长着崔太洋的脸，看起来没那么可怕了，还有一点温情。他调整好自己的声音，尝试向他搭话。是太洋吗？后者不说话，朝他飘过来。脚踝往下的地方如烟似雾，踩不到地板。起昊想到动画里画师描绘死亡角色的方法，在额头上添加暗色，去掉眼球高光。太洋的头发十分柔顺，垂在脸颊两侧，露出干净的额头，没有恐怖的氛围。他的眼睛还是那样，黑洞洞，但并不深邃，用手戳进去会发现背后没有体积，只是一个平涂出来的纯黑色的圆。两个参考都对太洋不适用。起昊又问了一遍，是太洋吗？太洋飘到离起昊三步远的地方，停下了。他看着起昊，嘴唇动了一下，但没有发出任何声音。起昊说，我听不见你说话。太洋的口型不再动，合住，变成一道线。起昊发现他无法通过太洋的嘴型来辨别话的内容，那个部分被一层晶莹的东西遮挡起来，让他看不清楚。可是，起昊想，不管是不是崔太洋，都当作是他好了。这个想法出现的瞬间，起昊感到一阵轻松。其实不需要问的，他在看到这个鬼魂的第一秒就已经相信了。如果不是太洋的话还会是谁，连这个如果都没有在他的脑中闪现过。太洋回来，他总是很欢迎的。起昊走过去，他们之间的距离一下子缩短。他想用手去搭太洋的肩膀，但没能成功，手指划过空气，落了下来。他看了看太洋，估计了一下位置，重新伸出手，虚虚地悬在他的肩膀上方，从起昊的角度看，就像真的碰到了他一样。他满意地笑起来。
太洋啊。起昊说，我真的很想要你回来，没有你我不行的。
太洋浮在那，很慢地眨了眨眼睛。他偏过脸，看着状似搭在自己身上的那只手。他的发尾扫过起昊的骨节。
什么都没感觉到，那个触感和空气无异，连气流都没有。
起昊又说，别不相信我。如果你是鬼，应该能看到我看不到的东西吧，你知道我说的是真的。
闻言，太洋的眼珠动了动，维持着歪头的姿势，居然露出一个笑容。
真是好久没看到了，这个表情。
那时，起昊的手卸了力，任由它从太洋的身体里穿过。他感到悲伤到来得如此迟缓，如同盲者复明，万事万物融化成抖动的、富有浅淡色彩的模糊轮廓。一股令人战栗的好奇沿着气管爬上来，让他喉咙发痒。因为从未睁开过眼，所以整个世界都是新的。这种新超越了现实，也超越了想象。原来这些东西长成这个样子。死去的人、鬼魂、崔太洋。它们留下了痕迹，没有消失，只是起昊看不到。窗外，白日的尾声悠长地回响，天光里还剩一点红，在这道走廊里轻柔地飘落。以前，太洋很喜欢这扇窗户，天气晴朗的时候，阳光斜斜地洒入，他坐在那里弹琴，残霞把吉他面板照得发亮，能看清随弦颤动的灰尘。声音的形状变得清晰，他的面目却在记忆里化开了。太洋死后，起昊本能地回避想起那个场景，他弹琴的次数太多，画面总是重叠，变成一个尖锐的符号，从回忆的顶端下落，把他钉在没有支撑的空腔里动弹不能。他一想到它，就想到太洋已经死了，这个事实让他在某一段时间里什么事都没能做成。死亡不能给他带来任何东西，不能变成一首诗的灵感、一个剧目的主题。他没有文学的天赋，也没有娱乐精神。他永远也不会感谢它。对起昊而言，死只意味着空房间。
那个时候很痛吧。起昊很想问他，却感到自己剧烈地发抖，眼泪无知无觉地流下。问了又有什么用，说不痛的话更让人伤心。太洋本来是不小心擦破皮都会喊痛的人，即使那是装的，向他要一个吻而已。
## 5
那一天之后，太洋留了下来。他碰不到现实中的东西，起昊就没有把那把琴从储藏室里拿出来。两年间，房子里太洋的物品不断减少，每一次起昊想起他，就会扔掉一件，从细碎的杂物到衣服，再到太洋和他一起挑选的置物架、他习惯坐的椅子。而那把琴是一座衣冠冢，扔掉它和否定太洋的存在没什么区别。起昊给自己留下一点余地，免于被失而复得的喜悦裹挟，抛下现实。他不能忘记太洋是一个死人，这种痛苦无法抹除，只能消减。在某种程度上，他超乎常人地冷静，他不知道太洋是怎么回来的、为什么回来，回来的这个人身上有多少他本来的部分。很多已经被他遗忘的东西，在看见太洋的那一刻，重新劈头盖脸地砸在他的面前。起昊清楚地明白，没有人能对那些回忆做出回答，太洋从前证明不了，现在依然。他们不知道彼此心里到底怎么想的，心是这样一枚复杂的骰子，千面都写满数字，爱恨悔悟各据一方，莫测地交缠。变成鬼的太洋说不了话，只能以手比简单的动作沟通。起昊渐渐发觉，有一种无形的禁制将生人与死者隔开。如果太洋想用手指写出韩文字母，起昊的眼前就会变得模糊，让他看不清太洋写的是什么。换言之，他们无法交流，太洋可以听到起昊的话，却不能对此做出超过是或否的回应。这种禁制是单向的，它的来源和目的都无从考究。毕竟起昊身边没有撞鬼的朋友，而正常人只会觉得他被恋人之死折磨到出现幻觉。但这样没有什么不好的，不能说话就不说了。只用勾和叉来表达想法，安静飘着的太洋也让起昊觉得很可爱。这在以前是难得一见的景象。起昊坐在沙发上，跟太洋讲他在工作中遇到的事。今天吃到了难吃的午饭，于是下午点了酸奶碗聊以自慰。没睡好觉，在路上差点晕过去。听到茶水间要添加新的零食了，想顺点回家，又想到你不能吃，突然很郁闷，就把你的那份也吃了。不要生气啊，我们来看短视频吧，这个你看得到吧？
太洋点头，从起昊的面前飘过，飘到他身后，能看见手机屏幕的位置。起昊的手指在界面上滑动，一个视频没播完就跳到下一个。太洋又飘了回来，静静地盯着他，两只手在胸口交叠，比了个叉。滑得太快，来不及看。起昊笑了，说好，知道了，前几个都有点没意思嘛，你喜欢？太洋点头又摇头，本来活着的时候视频软件推给我的东西也和你不一样。起昊看不懂，还是笑。鬼没有自己的手机吗？ghostok之类的，总不能死了就会回到古代吧。太洋连一点反应也不给了，重新飘到沙发后面，比刚才稍远的距离。他长时间在一个地方不动的话，那里会变得有点冷，工作原因，起昊的颈椎不怎么好。
太洋站定了，等待着，音乐却没有响起。起昊扭过头来看他，屏幕里的光熄了，只映出起昊一个人的脸。他的表情看起来要哭了。他说，太洋，原来你真的记得我啊。太洋飘在那，没动，眼睛里空荡荡的。过了一会儿他又说，你回来了就不要再走了。
## 6
起昊后来想，如果故事在这里结束，勉强算得上好结局，颇有留白之美。死去的恋人回魂，不是为了寻仇，只想了却生前遗憾，陪他打手势装傻过一辈子，如此就把绕在彼此身上的因果摘除。太洋什么都没能告诉他，他也不愿去想。梦中太洋的脸越发模糊，呈粒子状向周围扩散。起昊开始失眠，后来发展到拒绝入睡。他不想面对失去意识，坠入梦乡的瞬间。那其中蕴含着某种可怕的东西，让起昊感觉不到自己的身体，而没有身体意味着不再存活。
恐怖片里有鬼出现的时候，所有灯都会一瞬熄灭，撩开昏黑的幕，才能见到青面獠牙的一张脸孔。人们怕的不是鬼，而是那幕不知道什么时候会揭开的黑。
起昊用力睁大眼睛，他看到窗帘开着，夜幕泼进来。高楼上的灯带从未停止闪烁，那些光点透过太洋的影子落在地板上。连一线光都无法淹没，太洋根本不是什么法力高强的鬼魂。
那一刻，他感到眼眶发酸。一种强烈的冲动涌上来，必须做点什么，逃离这个回环、没有尽头的梦。他翻身去摸床头放着的药瓶，纵然有光，房间里仍旧太黑了，他没摸到，碰翻了边上的水，哗啦一声，沿着柜子流下去。他的手顿在空中，虚着探了探，什么都没抓住，又放下了。
说起来，太洋啊。他躺回去，放弃似的笑了一下。那个时候，我们在吵架吧。
因为哪件事情吵的我都忘记了，应该是很小的事吧，类似我回家太晚影响你睡觉那种的。我也不记得是谁的错了，感觉大概率是我的，但其实我早就不生气了，如果你再不原谅我，我都准备买吉他送你了。有没有觉得很可惜没收到我的赔罪礼？
起昊的嘴角弯着，抬手快速地抹了一下眼睛。
但是你突然就死了，我知道你肯定也不想这样的，连你葬礼上的照片都是我选的。我选了我觉得你长得最帅的时候，你自己也觉得很帅吧？就是黑色长卷发的那个。你看过了吧？别告诉我你连这个都没看。那我真的会难过的。
不是说你朋友很多吗，那天都没几个人来。
太洋合掌又张开——太远了，你应该办在首尔的。
烦死了，你都不知道我那天有多累，我根本不想办。凭什么是我办，怎么不去拜托崔智雄？说不定他还会给你打官司，就能把那个人抓到了。
我把你的琴藏起来了，在储藏室里，你知道吗？你早就知道了吧，我不在的时候你就天天在我家里晃，无聊地连有几粒米都数过了吧。哦，我这好像没有米，我一直只吃速食饭。
喂，崔太洋，死后到底什么样啊？我烧点钱给你真的能收到？我用纸折把吉他烧了会现在就出现在你手里吗？
太洋摇头。不会的。
不会啊，好吧。
起昊看着他，沉默了一下，慢慢地把脸埋进掌心里。
太洋啊，你为什么回来了？
## 7
吵架的原因，到死的那天，太洋也有点记不起来了。距离那次争吵已经过去快一周，大概和起昊说的一样，总是些无关痛痒的小事。并不是不想和好，只是没有机会，那时起昊出了个很长的差，连架都是线上吵的，十分现代。
那天太洋去琴行上班，阳光很好。出门前他想，起昊明天就会回来了，想个办法赶紧结束吧，吵架的乐趣超过三天就不保鲜了。到了地方，悠悠地开了门，坐在柜台边。想了想，又把椅子挪到门口。琴行的门头是一扇大而明亮的玻璃，天气好的时候，太洋会抱着琴，边弹边看路过的行人。香港人和首尔人很不一样。太洋一直相信，如果想做音乐，就必须懂得感受观察的魅力。
工作日，客人不多，因为清闲，他心情很好。有个大学生来买琴，太洋给他推荐了最便宜的一把。但行好事。他送走客人，给起昊发消息，刚有个孩子来店里，说是要练习，好加入学校的乐队社团，好年轻啊。两个小时过去，起昊一直未读，太洋也不在意，兀自回想自己读大学的时候。遇到起昊也是在学校里，被同学拉去唱k，说有人请客。一推开包房的门，洋酒堆满了桌子，起昊握着话筒唱歌，英文，太洋不懂，歌词打在屏幕上都看不懂，起昊还要加各种转音，字与字黏着，分不开。等他唱完，太洋问他，可以点瓶烧酒吗？起昊夸张地笑了，当然可以，但是你要唱歌哦。太洋应下，之后才知道起昊就是那个请客的人。对他的印象说不上坏，歌唱得很好听，太洋躲在角落偷偷录了音，恋爱后才拿给起昊看。他得意很久，对外说崔太洋对他是一见钟情。
太洋想，某种层面上，也没说错。在KTV里喜欢唱歌好听的人很正常，就像婚恋市场总是偏心长得漂亮的人一样。这些话太洋没对起昊说过，突然说的话很奇怪，而氛围好的时候，一般起昊都替他说了。好像他身上有一个开关，毛绒玩具似的，摁一下就会弹出来一句我爱你。这也是一种天赋，太洋就没有。韩国文化的远播有多少依托在这三个字上，太洋知道的很明白，越明白就越难说出口，不想让它变成唾手可得的东西、廉价的抚慰。爱是珍贵的选题，只有重大时刻才能发表。
那么，值得一提的是，太洋现在心情很好。他想到起昊明天就要回来了，手下的弦弹错一个音。
他用红笔把错了的地方圈起来，翻过一页谱，开始弹下一首。
虽然可能还是有点不好意思。太洋想。但要是他明天再说的话，就也说一次给他听好了。
## 8

太洋阅读着从研究所的跃迁设备上传来的拷贝记录，代表跃迁坐标的那个数字是绿色，在屏幕上泛着荧光，这是一个完好无损的坐标，系统判断它可以到达。
太洋知道智雄进行跃迁时的习惯，他会带着笔记本，以便随时记录他需要的东西，通常情况下，他把调制器调到十二倍，非常低，他需要看清脑活数据变化的过程，以此来确认信息在压缩又重构的期间没有留下残差。智雄的最后一次跃迁是遵守规则进行的，一切设置都相当平稳，太洋复制了那个坐标，输入自己的跃迁设备中，他关掉了调制器，准备以原速观测，坐标安静地躺在输入栏里，经检验后变成绿色，太洋做了一次深呼吸，点击确认开始的按钮。
预想中跃迁时会席卷全身的那种恶心感没有到来，太洋睁着眼睛，屏幕上弹出一条提醒，该坐标不可访问，他关掉这个提示，再次开始跃迁，相同的提醒又一次弹出来。不可访问。不可访问。太洋尝试查询帮助，不可访问的原因，检测到未知异常，该跃迁通道自动关闭。五分钟之内，太洋盯着它一动不动，像一座雕塑，他迟缓地转动眼珠，像素在他的眼前闪烁，他将这个页面发给了起昊，他完全不能理解它的意思。
起昊的电话下一秒就拨进来，他问，这是什么情况？
太洋感到自己的喉咙很干，有一种充血的感觉，他清了清嗓子，将这种不适感压下去。
我尝试进入那个跃迁坐标，智雄最后去的那个，但被拦截了。
我知道，我是说……
太洋打断了他，我想这确实是一次事故。
这太奇怪了。起昊的声音听起来十分紧张，坐标是正常的，但你没办法过去，这是不可能的，如果那个坐标本身有问题，那你连开始跃迁的机会都没有。
太洋问，你可以查询这个坐标对应的时间轴吗？
我可以试试，你等我一下。起昊那边传来脚步声，但我想结果可能不会很好，你知道跃迁是以什么原理进行的，不存在一个无法进入的时间线，只要它是由我们发射的……等等，为什么？
怎么了？
没有时间。他咽了一口口水，继续说，我没有查到这个坐标对应的时间。
太洋笑出了声，你在开玩笑吧？
起昊说，不是，我不知道为什么，那里是空的，什么都没有。
太洋的声音沉下来，你说智雄去了一个什么都没有的地方，并且没有回来。
不，更确切地说，那个地方不存在，类似于一片虚空，它在理论上存在，但实际上不存在。
你不觉得你的话自相矛盾吗？
我很难解释，太洋，但我知道这是一次事故，我们现在已经证明了，智雄仍然活着，系统上显示了，他没有死，但他的最后一次跃迁一定出了什么问题。起昊冷静下来，他似乎找了一个没人的地方，周遭变得很安静，他压低了声线说，有几种可能，一，也是概率最大的，智雄进行跃迁操作的过程中发生了未知错误，是由于他本人的一些行动引起的，导致他在中途卡住了，或者卡进了另外一个时间线，我们无法追踪到他，因为他没有到他本来应该要去的地方，所以跃迁始终显示进行中，只是他不在那个目的地；二，系统对这个坐标的判断出错了，这个坐标对应的地方不是那里，我们是在一张已经被遗弃的地图上进行搜索，当然找不到他；三，系统没有发现这个坐标不存在，而是直接把智雄送了过去，但那是一个假坐标，跃迁是无法完成的，所以它丢失了目标。
太洋沉默了，他感到没有精神，起昊的话像一串珠子一样沿着无线电滚落，他想集中起来，思考他所说的问题，但他没能成功。对太洋来说，这件事情太反常了，几乎违背了这个星球上所有的生存原则，系统是不会出错的，坐标和时间是一个严丝合缝的榫卯结构，只要有缺口，就一定能找到填补它的部分，而现在这个基础崩塌了，他不能说服自己相信结局只有这几种走向，这意味着他从前的生活变得不可信，整个文明赖以存续的东西在一个人失踪后悄然瓦解。
如果投影技术对历史的复现绝对真实，一切人和事都会在某个角落留下痕迹，我们常说的，在鉴定中最重要的两样东西，线索和证据，它们一览无遗，永远无法被完美地隐藏起来。可是智雄却消失了，他的消失没有留下任何可供分析的材料。从他开始跃迁的那一刻起，一道恐怖的钟声就飘扬在太洋的头顶上方，来回摆动，幽深地回响。他意识到他必须做出选择，起昊说的仍然只是一小部分，他们都不知道这件事究竟是怎样发生的，这其中必定包含着一个巨大的谎言（请原谅，他已经很久没提起这个词了，这让他感到陌生，同时还有强烈的不快），一个或许无法被接受的真相。在寻找智雄的过程中，太洋已经清楚地看见了他即将要舍弃的东西，那些并不重要，前提是他能够找到。只要智雄回来，那么其余事情他都会想办法解决。他的监察官生涯可能就此终结，起昊的担忧是非常合理的，他比任何人都明白这会带来什么。
太洋想到智雄坐在庭审中微笑的脸，他为了保持清醒咽下苦咖啡的样子，他们第一次见面时他有些拘谨的表情。这些后来都在记忆中淡去，他很少想起，和智雄在一起的每一天都差不多，但又完全不一样，回到过去是他的工作，而非他维持绝对自我的方法。他总是更期待看见下一个新鲜的早晨，这听起来很感性，但却是事实，智雄的消失让这个期待变得枯涸，他可以活下去，作为智雄的恋人，起昊和寅拓的生活也不会产生太大的变化，作为智雄的朋友。可我们不能忽视这其中的差异，一个不可能消失的人消失了，这也许是灭亡的前兆，当然了，也许不是。
通话在继续，起昊还在等待他的回答，话筒里一点声音也没有，太洋恢复了平静，他总是很快就能恢复平静。
他问，你能调取这个坐标的所有历史跃迁记录吗？
我想可以。起昊轻轻地说，我会把拷贝发给你。
太洋在他看不见的地方点了点头，谢谢。
二十分钟后，太洋收到了起昊的信息，非常短，跃迁记录几乎为零，但不是没有。二十四年前，有一个人输入了这个坐标，他的跃迁没能成功，太洋查询了他的生存状况，他在四年前去世了，生前在另一个国家的信息研究所工作。另一个人在七年前尝试登陆，资料显示那是个女孩，她进行跃迁时才十六岁，她也失败了，系统没有给出死亡认证，她大概还活着，但进一步的信息需要更高权限。太洋觉得很奇怪，自己是拥有最高权限的人之一，但却无法查询，唯一的解释是系统自主锁住了它，在碰到与社会现实严重不符的内容时会启动类似的程序，任何人都无法解开，他不明白一个普通人的信息为什么会触发这种级别的保护机制。
消息下方，起昊的话弹出来，这非常不合逻辑。
太洋回复，好在智雄并不是唯一一个找到这个坐标的人。
起昊说，我们无法从经验者那里得到任何东西。
太洋说，但这证明了智雄选择这个坐标是有原因的。
起昊发过来一个无奈的表情，只是你不知道那个原因是什么。
太洋想了想，他知道起昊说的没错，但智雄与他之间，有许多其他人完全无法了解的事，他至少需要努力一下，或许能够找到线索。
他说，我得去看看他的电脑。
## 3
实际上，这几乎是太洋人生中第一次查看伴侣的电子设备，在此之前，尽管他知道智雄所有的密码（智雄主动告诉他的，他没有逼迫别人公开私人信息的癖好），也从来没有尝试打开过。一方面，智雄电脑里那些专业的内容，他并不感兴趣，另一方面，如果智雄有个出轨对象，这件事他无法控制，只会带来争吵。他连我爱你都很少说，何况逼问智雄是不是不爱他而去爱别人了。
太洋走进智雄的工作间，输入密码，解锁界面，说完全不紧张是假的，但智雄的电脑桌面很干净，工作文件分门别类地整理好，分成案件复现和私人复现两个部分，剩下的是他正在撰写或已完成的学术论文。太洋从他未完成的论文开始看起，既然智雄没有回来，那么他手头的事情一定还没有做完，这是效率最高的路径，也许能从他的研究中可看出某种反常的倾向。
文件夹中有一个未命名文档，太洋点开，里面是数条彼此之间毫无关联的数据，他能看出来那是在一个极其短暂的时间内发生的脑活信息，全部不超过一秒，前方的编号是复现的序号，有些案件太洋经手过，能大概记起发生了什么。这些数据对案件的判决结果不产生任何影响，意识在所有情况下都会产生偏差，这是人们的共识，就像你在杀人之前会胡思乱想，这很正常，这部分的脑部活动不会干扰犯罪，因此，在审议中一般将它当作无效信息摒弃。这是一份记录了很多此类无效信息的文档，有几条内容被智雄用高光标注出来，太洋依次查询过去，没有什么特别的地方，文档显然是按照时间顺序排列的，智雄消失前参加的最后一次审议是5379号，被压在最后一行，太洋把编码输入搜索程序，零点二秒的蓝色天空跳出来。
他看着屏幕上的蓝色，愣住了，这个场景他见过，在他进行跃迁时，他和智雄一起观看了5379号案件的复现。这片天空什么也不能代表，可能只是那个罪犯在杀人前的一刻闪回。他没有退出，零点二秒反复地轮播，他感到他的眼睛被这种粘稠的颜色糊住了，让他再也无法思考其他。智雄在文档的最下方注明，高光处内容来自未知信息源，没有多余的解释——这是智雄的专业——信息传输中的保真边界，太洋轻声咀嚼着那个词，保真边界。
他想起一件事，或者说，很多件，非常细小的事情，他以前从没把他们放在心上过，也从未尝试从学术理论的角度理解它们。
智雄的研究内容很难用通俗的话说清楚，当然，任何一门理论学科都无法做到这一点。简而言之，一束光中所蕴含的能量是有限的，即使这束光十分庞大，足以笼罩整颗星球，但信息粒子的数量仍旧超过它十万倍不止。因此，在传输前，我们首先要进行压缩，就像把ABCDEFG变成ABCDx，让它缩小到光束所能容纳的范围，到达目的地后再解压，恢复成原本的完整信息流，让历史在另一个星球重复上演。在这其中，信息的丢失是不可避免的，在最大程度上减少损失是智雄所在的研究所主要研究的课题。经过很长一段时间的调试，投影技术的精确度已经无限趋近于百分之百，科学家认为这个极限是人力无法跨越的，但对普通人来说，这个结论足够让他们感到安心，因为那缺失的微小部分中并不包括任意一桩犯罪事实。如果说复现的过程中，“今天想喝一杯果汁”的想法没有被体现出来，这显然不会影响案件判决的施行，那么就没关系了——本来应该是这样，智雄和他讨论过这个问题，缺损是无法避免的，我们利用的只是传播的时间差而已，只要不断修复这些小漏洞，技术就能每一天都变得更加精确。
那一天，太洋的记忆很清晰，智雄参加了8263号案件的审议，这甚至不是一起谋杀，而是入室抢劫。他带回来一个u盘，把里面的东西展示给太洋看，那是一段复现的记录。罪犯在走到被害者的房子楼下时，脑中闪过一个想法，他七岁生日时在家里吹灭蛋糕上的蜡烛，这个画面只停留了很短的时间。智雄说，大概零点六秒。太洋问，他是因为嫉妒才犯罪的吗？智雄摇头，不是的，这不构成他的动机，这个脑部活动出现的很突然，理所应当地在判断流程中被剔除了。太洋又看了一遍，说，这很正常，在实施犯罪行为前，有研究显示人脑会更加容易乱想。
不，智雄突然抬高了声音，这不一样。
太洋不明白，什么意思？
智雄顿了一下，低声说，这段信息没有来源。他看着太洋的眼睛，意思是，它没有发生过。
太洋想了想，说，所以这是他的幻想。
幻想是有来源的，你可以从神经序列中找到。智雄说，这个没有，它的源头是空的。
好吧，这会产生什么影响？
我不知道。它不会影响案件的结果，因为它太小了。智雄移开视线，盯着仍在滚动的电子屏，你不觉得是我算错了吗？
太洋的嘴角抽动了一下，尹起昊这么说的？
智雄瞥了他一眼，淡淡地笑了起来，他确实这么说了。
你别听他的。太洋拍拍他的肩膀，让他靠在自己身上，他自己算不出来才说的吧？我们智雄检修出别人都查不出来的问题，会加薪吧？
智雄把屏幕摁灭，也是呢，说不定会让我当组长。
他倒在太洋怀里，没再说什么，太洋低下头，吻了吻他的发顶。
去睡吧，最近不是一直在熬夜吗，我都调成睡眠模式了。
这个场景，为什么会现在想到。太洋觉得头很痛，这里面有一些重要的东西，和当下的情况重合了，他明确地知道那是什么，却不敢再继续想下去。未知信息源，这不是一个很难理解的术语，这甚至不能算是一个术语，它的意思非常明显，不知道这些信息是从哪里来的。他盯着智雄的电脑页面，蓝色的天空还在播放，清澈而透明的零点二秒种，而这片天的背后却是空的，没有星座，没有地外生物，没有任何一个人类可以构想出的宇宙。事实上，太洋不知道这意味着什么。
他把视频关掉，依次点开被智雄用高光标出的数据条：泼洒的咖啡、远古文明的展览、游泳、失去翅膀的昆虫、电子借书证、不认识的明星的巨幅海报、毛绒玩具、陶瓷、纠缠的电线、路灯、天空、蓝色的天空——未知的信息源，所有一切都是。
忽然间，智雄的电脑上有一个光标跳了出来，那是一段自主编写的程序，尚未完成，因此提示框十分简陋。太洋看到显示栏里的字符不断变化着，一条简单的结论浮现其中：检测到输入源，输出状态，零。
然后程序停止了跳动，如同整个世界被按下了暂停键，太洋僵坐在那，盯着那个不再变幻的结果，输入源的位置，几个数字紧紧地咬在一起，那是智雄最后一次跃迁的坐标。他的眼前又出现了那片蓝色天空，天上一朵云也没有，是空的，他的眼眶因为长时间注视电子屏幕而变得干涩，他看不懂那些代码，他什么也没能感受到。
太洋检查了智雄的备忘录，置顶是他们的纪念日，庆祝计划，预定餐厅的时间表。他笑了一下，智雄在里面写了一点碎碎念，给他买红色面板的吉他会喜欢吗；最近工作不忙，这家甜品店可以一起去；想听那首歌，下次让他弹，诸如此类，在太洋看来都是很可爱的话。吉他买来了，刚到两天，包装盒都没来得及拆，被遗落在门口的地板上吃灰，送礼物的人失踪了，甜品店也不能一个人去，没有听众的话，歌也不知道唱给谁。太洋感到有点伤心，他迟疑这种情绪是不是来得太晚了，面对智雄不会再更新的备忘录，才有智雄真的消失的实感，是因为这样智雄才走的吗？是他的错吗？太洋被这个猜想吓了一跳，真的不正常了吧，被智雄的失踪弄成精神病了，怎么会有这样的想法呢。智雄是主动要走的，和他没有关系，他的浏览记录里残留着大量有关那个坐标的搜索记录，他是为了寻找那个地方才走的。太洋拍拍自己的脸，冷静下来。这是一场事故、一个没人期待发生的意外，智雄什么痕迹都没有清除，也没有留下任何文字书信，换言之，对于任意一条能让人知道他在哪里的线索，他都没有做出行动，无论是隐藏还是保留。忽然间，太洋的眼皮重重地跳了一下，他想到，也许智雄自己也没能预料到这个结果。他什么都没有清除，也什么都没有留下，这不是一次有预谋的诀别，不然他至少会告诉他，如果有一天他消失了，不要去找他，可是连这个都没有，一切都干干净净，就像最平常、最普通的一天。太洋感觉到他的手开始颤抖，智雄根本就没有考虑过回不来的可能性。
他以为那个坐标是一个可到达且可返回的地方，但系统却在智雄开始跃迁之后证明那个地方不存在、未知、不可访问——不明来由的信息源——蓝色的天空。太洋深深地吸了一口气，仿佛有什么东西鼓胀起来。他立刻拨打了起昊的电话。
我在智雄的电脑里找到了这个。太洋没有给起昊反应的时间，我现在发给你。
这是什么？
我记得你和智雄一起参加了5379号案件的审议。太洋说，这是一份无效信息的整合文档，里面被高光标注出的内容是智雄认为源头未知的信息碎片，他没有和你提过吗？
我想没有……我有印象，关于其中的一部分，你说的5379，这条数据在当时被取消了。起昊听起来正在阅读文档的内容，他讲话的速度放缓了。
是的，被取消了。太洋很快速地说，我对这方面的了解不多，所以需要你帮忙。智雄和我说过一件事，和这个文档有关，他好像从很早以前就注意到这一类信息碎片的异常，他说这些信息的来源是未知的。不是幻想，而是，什么都没有。他是这么和我说的，它们的过去不存在，从来没有发生过。这可能吗？

警察花了很长时间调查寅拓的案子，但最终没有取得结果，他的家里非常干净，一枚陌生的指纹也不曾找到。智雄接受了无结果的结果，除了接受他别无选择。有一段日子，他发觉寅拓从他的生活里消失了，他几乎不想起寅拓，不记得这个人曾经存在过。但又过了一段时间，他开始频繁地出入墓园，拜访故去之人灵魂的居所变成了一种习惯，这让他感到宽慰，仿佛他能在其中找到一个支点，将他过往的人生高高撑起，不至于被零落的现实击垮，掉在地上砸得粉碎。他理解了一种平衡，一个人死去，但他的形象仍在其他的记忆中生长。寅拓的死不是故事的开头，而是列车行至半途时忽然划过窗边的一道闪电，智雄看见了，愣了一下，复又收回眼神，继续驶向前路。
在华沙的旅馆里，智雄和那位俄国学者简短地聊天，他的研究方向和智雄类似，曾经去韩国进行过一段时间的访学。讲到其中的一些问题，智雄提起了寅拓。一谈到他的研究，他总是无可避免地提起寅拓。
这本来是一个非常浅显的课题，智雄告诉那个俄国人，我和黄寅拓——我曾经的搭档，不，说是助手更恰当——在研究生时期的一篇论文，研究波德拉斯地区的双重信仰和濒危宗教。那时我们的经费不足以支持来到这里做长时间的田野调查，因此得到的数据十分有限。后来我进入研究所，做宗教比较研究。机缘巧合下我看了大量有关祖灵祭和耳语者的资料，寅拓一直对这个题目感兴趣，于是我们一起重新推进了这个项目。然后，他死了，是意外，我继续这项研究，这是我来到这里的原因。
俄国学者露出一副惋惜和哀伤的表情，智雄摆了摆手，让他不要为此祈祷。
容许我问一个不专业的问题，他说，你刚刚提到了，祖灵，你自己怎么看待这些东西呢？
智雄微笑起来，是在问我相不相信吗？
你可以这么认为。
啊，说实话，我没有看法。智雄略微低了一点头，耸耸肩，他不再看着那个俄国人的眼睛讲话，而是盯着他身边，遵循重力自然下垂的床单，贴近地板的位置。
你应该能够理解，我的工作是研究这里的人为什么信仰某个东西、或者某条理念，这并不是任何一种你想象中的去伪存真的探险。我的态度会导致变化，这是我始终相信的，我也一直告诫自己中立的绝对必要。
当然，当然。我并不想冒犯你，这不是关乎学术的讨论，只是我个人的好奇。我必须承认，在我的国家，许多从事相关研究的学者是东正教徒，这一定对他们的研究产生了影响。
个人立场总会在某些方面体现出来。智雄沉默了一下，没有立场也是一种立场。
俄国人朝他点头，你是个很好的学者。
不。智雄说，我想我不是。
要找到真正的耳语者是很难的。在此之前，智雄走访了五个村庄，受过其恩惠的人大多不愿意透露她们的住处。他既不是病痛缠身，也并非心有顽疾，在这里科学是不被认可的，你无法跟村庄的原住民们解释他们日常生活背后所承托的文化价值。
他在寻找的途中碰到一个波兰女人，她告诉他，耳语者不会面见没有罪的人。你必须反复地检视自己的内心，触摸灵魂深处的裂痕，那是她们的语言落下的地方。智雄把手贴在左胸，他开始想象心脏搏动的样子。血沿着管道泵出去，又沿着管道回流，这种想象依托于现代医学，把人拆成无数个微小的单位，器官，细胞，分子，其中没有丝毫灵性的存在。波兰女人走了，她眉宇间的神色很安宁，仿佛说过的话抛在脑后，转眼就忘了。智雄很快意识到这是行不通的，他们不是不相信现代医学，而正是因为相信，才显得更加灰暗。他要是想搞明白一些事，就必须先说服自己去相信什么，若是你的伤口都无处栖身，就更不要谈治疗它。智雄站在原地，目送女人的背影渐渐变远，他的手不自觉地摸到脸上，在颧骨的位置流连，他想到了谁，毋庸置疑的，也许他早就想到了，只是强忍着，把那个名字压下去，好像压碎了就不会再对他产生影响。其实他不是没有罪的，罪恶这个词一说出口就变得色厉内荏，一张白纸上溅了血一样，擦不干净，再也别无他用。那天他本来要和寅拓去咖啡馆讨论研究所考核的事情。寅拓的脸上就有一道疤，很小，很可爱，像一只永远也不会长大的幼虫，睡在柔软恒温的茧里。
不是只有杀了人才叫罪恶的吧。智雄蹲了下来，他突然觉得很崩溃，揭示一桩死亡的时候，难道不觉得可怕吗？当时连一滴眼泪都没掉，立刻拨打了报警电话。那时候居然没有颤抖，一瞬间什么都感受不到了。看见一个人的死，就在自己眼前，离得这么近，伸手就能碰到，那个时候，连表达恐惧的心情都失去了。
智雄想，生命本来就这么有限了，人一生能留下的痕迹也就这么多，就算是这样，他还是在不断地忘记。寅拓的脸，说话的声音，他死时最后的样貌都在记忆里淡去，时间的流速是这么虚假，那些能被称为是寅拓灵魂的遗迹的东西，也总有一天会消亡。如果连这样庞大的悲痛都可以治愈，那和神又有什么区别呢？
可是，明明就不是神。世界上是没有神的。
智雄感到一阵眩晕，猛地从地上站起来，血液直冲到头顶。
以前和一个很亲密的人，好像也说过这样的话。神不存在，天使也不存在，根本就没有这种东西。不会信的，不会信也不想信，神啊天使啊那些的，不是童话吗？
谁来着，那个人。
他有点发愣，站在那，思绪忽然间卡住了，很亲密的人、会听自己说这些话的人、和他吵起来的人。为什么也一点印象都没有了，真的，连一个虚幻的像鬼一样漂浮在记忆里的影子都没有，那个位置是空的，物理学意义上的空，任何物质在那里都不存在，他呆呆地，抹了一下眼角，觉得恐怖。
## 2 · 太洋
研究所的旧址在首尔郊区，周围绿化环绕，宿舍和办公室由一道走廊相连，本意是方便研究，但住在那里的感觉很不好。学者们认为有限的活动范围是一种禁锢，生活和工作的空间理应分开，因此反复提出迁址。当然，即使这是大部分人的诉求，从各种条款上来看都是十分合理的（他们总是善于忍让），但得到的批复并不理想，最终他们的努力使得政府同意重新修整研究所周边的区域，为他们建造了一个可供休憩和散步的公园。很多人陆续搬离了宿舍，宁可倒三班地铁来到这个地方。一到晚上，这里就变得寂静非常，风吹过树叶的声音和蚊虫飞动的声响交叠在一起，成为了科学笼罩下唯一的音乐。
太洋是凌晨回来的，他刚结束一段实地调研，飞机晚点了两小时，让他没能赶上末班地铁，只能花天价打车。他是为数不多的还住在研究所的人之一，他对这里的安静感到舒适，这意味着他不用耗费时间与不认识的人说话。与他而言，这是一种完全的放松。曾经有很长一段时间，他几乎什么都不做，只是不停地和人打交道，那让他太累了，所以这里很好。他只需要处理自己的工作，有时再处理一下智雄的问题。
这并不是说智雄总是犯错，或者惯于给太洋带来麻烦，他认为这是一种管理，在智雄因为一些事感到焦躁的时候，由他负责，将这种情绪妥善消解。和智雄当了两年同事之后，太洋已经本能地将它收编为自己职责的一部分。
理由，没有理由。非要说的话，智雄总是展现出一种人性，人类的性质，让太洋觉得他有点可怜，同时也很可爱。人本来就会这样，高兴就会笑，不高兴就会哭，他身上经过社会规训的那些道德像一根刺，偶尔从脆弱的皮肤底下穿出来，在空气里四处流窜。太洋能闻到这种味道，这会导致他们周围的环境产生变化，即使十分微小，但的确隐秘地影响了什么。
智雄给他发了消息，他的数据有一点问题，在运行的时候发生了未知错误，要把错的地方检索出来，就要把所有的程式推翻重做。智雄已经为这个子课题熬了三个礼拜，这无疑是重大的打击。太洋打了个呵欠，回复他，那么就先别做了，出来吧，我从日本带了很好的酒。智雄的昵称闪烁了几下，说，知道了，在喷泉等你。
初秋的首尔，夜里风很凉，太洋过去的时候，智雄只穿了一件单衣，秋风鼓满他的袖口。太洋在他边上坐下，从包里拿出未拆封的日本清酒，边拆边问他，不冷吗？
智雄抽着烟说，还好。
日本比这里冷一点。太洋说，给我一根吧，什么味的？
就薄荷味。智雄抽了一支给他，太洋咬了咬烟嘴，没咬到爆珠。
之前不是说不喜欢没爆珠的烟吗？
那些抽完了。智雄看了他一眼，吐出细细的烟雾，这是我问道熙拿的。
太洋眯起眼睛，他不是走了吗？
昨天回来了，说是整理一下不要的东西。
哦，这样。太洋含着烟，不抽，把酒瓶盖拧开，递到智雄跟前。闻闻，很香的。
智雄点点头，凑上去，怎么舍得买这种酒了？
太洋笑了笑，没什么，在店里尝了一下，感觉不错就买了，说实话这个很贵吗，我也不清楚。那个，有杯子吗？
智雄侧身，把烟叼在嘴里，含糊不清地说，从我房间里带了。
就知道你会带的。太洋说，喝之前，给我借个火吧。
打火机在我衣服……你干嘛？
智雄回头，手揣进口袋里，看见太洋忽然放大的脸。两支烟轻轻碰了一下，火星微弱地一闪，他很快又退回原来的位置，仰头，浅灰的烟气散到空中。太洋看着智雄被风吹乱的头发，给他倒酒，轻轻地笑，麻烦死了。
说说你的研究吧。他举起酒杯，喝了一口，感受那种苦味顺滑地化在喉咙里。所以出什么问题了？
智雄的声音低低的，就是不知道是哪里出问题了才难办。
只能重来了？没有别的办法了吗，写个程序检索一下呢。
我又不是程序员。智雄把烟头扔在地上，用脚尖碾灭，你帮我写啊？
可以啊。太洋指着自己，要我帮忙吗？
别骗人了，难道你就会吗？
太洋眨眨眼睛，把智雄的脸掰过来，面对着他，呀，我真的会啊，我之前做过很久量化的。
他任由太洋捏着下巴，将信将疑的，真的？我怎么不知道。
哎呀，我没告诉你嘛。回去把要看的资料发给我？
智雄不说话了，一下接一下地喝酒。
怎么了，还是不相信我，太洋叹了口气，自觉地又掏了一根烟，拿打火机点燃。我真的想帮你的。
不是。
过了一会儿，智雄从沉默里抬起头，却不看太洋的脸，烟雾把他的五官藏起来，那个场景就像科幻电影一样神秘。太洋想，要是智雄参加那种冒险的话，应该会身先士卒吧。然后就轮到他给他收尸了。
智雄不知道太洋在想什么，他慢慢地吐出一口烟，说，我只是觉得，为什么能做到这样呢？好像没有什么事情会影响你，那种感觉。要是不是因为这件事，你好像永远也不会告诉我。以此类推，你还有很多其他没有告诉我的事情吧。也不是说我一定要知道，但是，有点羡慕吧，有没有人和你说过这很难做到？我的意思是，清楚自己想要什么，除此之外不特意展现，能够忍住冲动的能力。
啊，一下子这么感性吗？太洋像听到一个玩笑那样轻快地笑了，他拨开垂落在眼前的刘海。我头发现在好长啊。
智雄一把握住他的手腕，迫使他看着自己的眼睛，我在很认真的和你说话呢。
知道啦，我也很认真啊。太洋抖落最后一点烟灰，叹着气，伸手去揉智雄的后颈。那现在给你一个机会吧，还想知道什么？
智雄的眼眶有点红，都说了不是想知道的意思。
那是要我主动说？好吧，告诉你一个秘密好了，要听吗？
他撇开脸，随便你。
其实我是天使哦。太洋盯着他。是真的，用专业的话说，神秘学里会出现的那种，有魔法的天使。
哈？你把我当小孩子吗？
你看，我知道你会这样我才不说的。太洋还是那个淡淡的神情，仿佛他嘴里说的是什么数学公式而不是天使的传说。智雄睁大了眼睛，然后突然无法自持地笑了起来，你哄我开心呢崔太洋。
太洋说，这不是做到了嘛。
智雄竖起两根手指，首先，世界上是没有天使的，他折下一根；其次，你不是。剩下一根没有折。
不信就算了。他用力把智雄的手指摁回去，不用对我竖中指吧。
好吧，对不起，是有点没礼貌。
智雄放下手，太洋的掌心还盖在他手背上。他们在喷泉边上坐着，夜间喷泉停了，只有偶尔流动的水声。没有人说话，酒只喝了一点，冷风慷慨地从他们之间穿过。智雄低着头，视线不知道落在哪里，他攥了攥衣角，朝太洋的方向挪动了一小段距离。又过了一会儿，他听到太洋说，其实我没有骗你。
粗略估计一下，太洋当天使应该有五百年了，和同行相比并不算长，甚至还很短，애기的水平。天使前辈们以自己的年纪为傲，这意味着他们帮更多人实现愿望，散布了福泽。说实话，太洋不太能理解，就算只活了五百多年，也已经觉得很长了，经常出现无聊的情况，不想再活了，很没意思，什么事情都做不了，只是不断地寻找着有未竟之事的人，谈判，做交易，再重复这个过程。解决那些事对太洋来说就像一个响指，魔力的消耗约等于无。与之相对的，向他许愿的人要付出代价，想要实现愿望，就要忘记喜欢的人。这句话在天使的书籍中是这样说的，要用世界上最美丽的东西——也就是爱——来换取奇迹发生。太洋从来不说爱，因此发明了自己的版本，喜欢和爱本来就差不多，大家都能理解吧。不觉得把这个词换掉之后，整个过程都变得轻松起来，就像一个经营类小游戏那样吗？给出你的喜欢，交换你的愿望，就是这么简单而已。这不是天使的恩泽，而是一种商业行为，前辈们把它搞得太复杂了，所以才每天都这么焦虑痛苦。
在更早一些的时候，医学技术没有这么发达，太洋一个月内拯救了五个人的性命，无一例外都是他们的爱人向他许愿，忘记也没关系，让他们活下去就好。看起来真是伟大。太洋想，可是这是逃避啊，不是因为无法面对死亡才这样做的吗？说是自己的爱人，但却在最需要记得他的时候忘记了他，活着又怎么样，人不是一件物品，打碎了再拼起来就能恢复如初。比起生命，记忆是更有机的东西，人类本来就不是只依靠心脏来生活的，他们却永远都不能明白这一点，好像只要维持呼吸，一切都能迎刃而解。
不是这样的。太洋对此感到伤心。氧气和二氧化碳在体内转过一轮，沿着口鼻流入空气，难道人们能看见这些吗？明明最重要的东西已经失去了，他们却连已经失去这个事实都想不起来了。
所以说，天使是个滑稽的职业吧。如果不能比肩神明，那和小鬼也没有区别。现代人还会谈论天使吗，即使在与宗教学研究所工作，这个名词也只有在老式教育里才会出现，早就是夕阳产业了，大家还是聊神更多。天使呢，只是被赋予了一些微小的权力，就凌驾于人类世界之上，自以为是地为他们扭转命运，不知道为什么，总觉得有点可怜。
不过太洋不是顾影自怜的人（天使），既然无法改变，那就只能继续下去，在四季的轮转中，寻找应愿之地。这期间也会碰到不同的人，比如智雄那样的，让太洋产生一种秘密的期待，会向我许愿吗，许什么愿望呢，智雄喜欢的人是谁呢。依照智雄的性格，如果真的到了不得不向天使许愿的那一天，大概是生活中所有能够依靠的东西都崩塌了吧。这种事情怎么会发生呢，太洋莫名地想，我不是一直在吗。
忽然间，太洋开始回想，智雄上一次崩溃到那种程度是什么时候，他回到自己的房间，把清酒放进柜子，有个名字在脑海中跳了一下，是那个人突然死掉的时候吧。智雄晚上被噩梦惊醒的时候，一直叫的那个人，寅拓，黄寅拓。
啊，这件事，虽然很抱歉，但太洋也是迫不得已，天使真的很没用啊，连拒绝的权力都没有，只要献上了足够的诚意，契约就会自动缔结。那个人的，应该是某个竞争对手吧，找到了太洋，向他许愿了，那张脸上的表情太洋至今还记得，为了自己的工作，连前途都算不上的东西，就要一个没犯任何错的人去死，人类中也是有这样的人的。只不过那时太洋也不知道寅拓和智雄之间的关系，那么这无论如何都不能算作是他的业果吧，选择都是人作出的，天使只是一座连结愿望和现实的桥梁而已，只是工具而已。
但智雄真的非常伤心，那段时间，他把所有的过错都揽到他身上，其实太洋不懂他为什么要这样做。他把自己关起来工作，不见任何人，头发剪得很短，像杂草一样乱糟糟地杵着。就是从那时起，智雄慢慢地调整了自己的研究方向，从宗教比较研究转移到波德拉斯地区的双重信仰和濒危宗教拯救课题上。他后来告诉太洋，如果他不做这件事，就没有人会做了。谈不上梦想这么宏大的东西，他只是把它当成寅拓的夙愿一样去做。在最难捱的时期过去之后，他们很少谈起寅拓，只有一次，智雄的研究遇到瓶颈，他们和往常一样坐在公园的喷泉边抽烟，他突然问太洋，你见过死掉的人吗？太洋没有马上回答他，他知道智雄想说什么，他的回答并不重要。智雄深深地吸了一口烟，任由那片灰白把他包裹起来，然后他的声音透过烟雾传过来，十分缥缈。
他躺在那里的样子，和活着的时候没有分别，但是他不会再说话了，你所拥有的关于他的记忆，就是他全部的人生，他无法再往里面添加什么，他有的只会越来越少。
烟很快就散了，智雄通红的眼睛如同鬼影般显形。
我只是想，也许我还能为寅拓做点什么，让他留下的东西多一点，一点都好，他为什么就这样死掉了？我真的不明白。
从始至终，太洋静静地听着，一句话也没说。也许有某一个时刻，他感到后悔了，也许天使的存在是一个错误，一个基因学序列上的异常反应，不然怎么会在赋予他们能力的同时又不容许他们拒绝，他无法安慰他，这显得太无耻了，他也不是很勇敢、很有力量的人，直视这份由自己造成的痛苦给他带来了难以承受的东西。太洋感到衣角被攥紧了，肩头蹭上来一块柔软的知觉。智雄的脸贴在那，眼泪从脸颊流到他的衣服里，他的喉咙在发颤，过了一会儿，他说，谢谢你，没有你的话我也不知道该怎么办了，真的，谢谢你，太洋。
那瞬间，有什么东西在身体里咔嚓一声碎掉了，不属于人类的那颗心在无穷无尽的空洞里下坠。太洋突然很想笑，是在感谢我吗，感谢那个把你变成这样的人吗，要是现在告诉你真相的话，会不会直接跳起来把我杀了呢？这样也很好，如果能像正常人一样去死，身后的因果也就随之消除了吧，如果死了，就再也不用思考这些复杂的的感情理论，再也不用因为谁哭了就感到心疼了。
对不起，智雄啊，可是我也没办法弥补你。
太洋一下一下地摸着智雄的头发，最终还是轻轻地笑了。真的很抱歉，真的，不想看到你这么伤心的样子。不是问我见没见过死掉的人吗，见过的，见过太多了。所以寅拓死的时候，选择了不会有任何痛苦的死法，他最后合眼的样子也不忍心看见，是躲在门外完成的，我的善心只有这么多，可惜不能告诉你。
很抱歉，这句话也只能在心里说，尽管不是我的错，可是总有一部分是我的错吧，不希望你也变成那个了无生气的样子，所以——太洋不知道自己脸上现在是什么表情，总之一定不好看——就这样继续生活吧，就算很痛苦，但生活本身才是重要的，不是吗？
## 3 · 研究所
智雄最近在准备一次宗教研究的全球论坛，他整理了他之前做过的论文，其中当然也有寅拓的部分，主办在荷兰，他计划搭晚班机过去。订票的时候，太洋忽然告诉他，在他预定的时间前两天，他要飞一趟柏林协助某个新项目的起步，于是智雄决定和太洋搭同一班飞机过去，在欧洲多待两天，四处转转。实际上，这已经是智雄去欧洲的不知道第多少次，他之前几乎只去波兰，对那个地区的执念像一个魔咒一样困住了他，这次也许是因为和太洋一道，让他产生了些许不同的感觉。近年来，他的研究逐渐取得了不错的成果，如果在论坛上表现得好，应该能申请到一笔不菲的经费，为接下来的更加细分的内容提供经济支持。为此，他每天只睡三四个小时，不眠不休地检查有没有任何遗漏的问题。
太洋劝他，不要把所有的精神都放在工作上，你会受不了的。去欧洲了就应该到处看看，欣赏美景，吃点好吃的。
这次论坛真的很重要，智雄揉了揉眼睛，眼下一圈青黑，我很难放松。
那么就等论坛结束了。太洋说，结束之后我们在里斯本见，玩两天再回来。
智雄笑了，这是约会吗？
太洋把头发撩到脑后，如果你这么认为的话。
智雄说，我会期待的，也许你说的是对的，我太紧张了。
太洋说，别紧张，你会做得很好的。
事实证明，太洋的判断没错。即使智雄经历了长途飞行的颠簸，也没有睡好觉，但依旧出色地完成了分享。踏上前往里斯本的飞机时，他感到前所未有的轻松，这种轻松里蕴含着一种十分光明的东西，仿佛他的心正真切地为了什么而燃烧。他给太洋发消息，到了之后请我吃饭吧，我刚才真的说得特别好。过了一分钟，太洋回他了一个自己画的ok的表情。祝贺你，太洋又说。
到达里斯本的时候是黄昏，夕阳柔柔地倾泻，整座城市都是一片明黄。太洋来机场接他，取了他们租的车。智雄坐在副驾，摇下窗户，落日的残红顷刻瀑进车里，迎面而来的风中有海的味道，混合着夏末独有的干燥的香气。太洋用车载音乐播放了一首他没听过的韩语抒情歌，女声低低的，在平和的静默里流淌。去吃蛋挞吧，太洋说，我听说那家店的蛋挞很好吃。智雄回头，去看太洋开车的侧脸，他的脸上也被薄暮印了一道金红交错的影子，随着移动不停变幻着。好，智雄小声说。什么？太洋依然看着前方，你声音怎么这么轻？我说好的！智雄喊了出来，喊完又觉得自己的反应太夸张了，莫名其妙地笑起来。太洋也开始笑，肩膀都笑得发抖，呀，你干嘛突然又这么大声，疯了吗？没有，不是，哎呀，我不知道。智雄边笑边说，风吹开他长长了一点的刘海，他想原来和太洋约会是这样的感觉，是迎着残阳去吃蛋挞的感觉啊，之前怎么从来没有想象过呢？
太洋查到的那家餐厅在一处高地，走到露台上，能俯瞰大半个里斯本的景色，栏杆是石头做的，摸上去有粗粝的质感。
太洋靠在一边扶手上，点了一支烟，问智雄，论坛很顺利？
嗯，很好。智雄从口袋里掏出烟盒，凑上去，帮我点一下。
太洋挑了挑眉，抚过他的后颈，低头，凝视着两支烟碰出火星的地方。
他似笑非笑地瞥了智雄一眼，看起来以后只要有一个人带打火机就行了。
智雄不看他，说，本来不就是。不这样点也可以用打火机点啊。
哦，那之后都用打火机吧？
……随便你。
又来了。太洋掸掉烟灰，在他脸侧亲了一下，智雄一下子转回头，睁大了眼睛，耳朵变得很红。
太洋摊开手，眨了眨眼睛，绕到桌子边坐下，语气十分无辜。
来吃东西吧，这个真的很好吃。
现在想来，和太洋在里斯本的时候，就像梦一样，去的地方很好玩，天气和温度也很完美，被近似于爱的柔情包裹起来，如同一床薄而软的被子，拥有世界上所有的好故事。回到研究所，那种幸福还留有余韵，把他的五感都遮起来，见到太洋的时候总是觉得头脑发晕，好几天连工作消息都没怎么看。
你现在有点不像崔智雄了，呀，你最近怎么了？那天和太洋一起去附近的韩餐店吃饭，点了辣炒猪肉，智雄放空了大脑，坐在那发呆，太洋一开始说了什么话都没听到。直到感觉手被人握起来晃了晃，思绪才勉强归位。
啊，什么，抱歉，我有点走神了。智雄不好意思地抽回手。
没关系，休息一下不是挺好的吗？太洋无所谓地耸肩，我刚才在说下午会议的事，你没收到通知吗？
我好像把那个群组的消息关掉了……
是去旅行的时候关的？
不是，就一直关着。智雄说，那里面总是发一些很无聊的东西，在我写论文的时候一直跳出来，干脆就关了。是通知要去开会吗，居然有一个会我们俩要一起参加，明明研究的是完全不同的领域啊。
太洋说，不知道。好像全体人员都要参加，这里也很久没开这种事务性的会了吧。
说真的，肯定又是浪费时间。智雄夹了一筷子菜放进嘴里，如果不是说迁址的事，开什么事务会都没用吧。
啊，确实是这样。不过我觉得不迁址也不错，这样不是很安静嘛。
你得和那些人去说了。智雄露出一个苦笑。你知道他们有些人的理由是想要去狎鸥亭的夜店吗？
那个的话，其实从这里也可以去。太洋像突然想到什么一样笑了，从这里结束工作，然后过去，应该能赶上第二场开始吧。
你看起来很了解啊。智雄敲了一下碗边，你经常去？
太洋认真地说，对啊，不和你喝酒的时候我都在那里玩呢。
假的吧，别骗我。
真的啊。
那我晚上听到的吉他是鬼在弹吗？
哎呀，也是有可能的哦。
智雄放下了筷子，首先……
首先世界上是没有鬼的。太洋打断了他，好啦我知道啦。
智雄坚持说完了后半句，其次你对那种地方根本不感兴趣吧？
当然了。太洋摇摇头，低下头咬了一口肉，太吵了。
呀，我说。智雄忽然盯着他，语气变得郑重，要是真的迁址了，你会住到新的宿舍去吗？
太洋说，这是什么问题，只能跟着去了吧。
……也是。智雄移开视线，他在想什么呢，难道还能留在这里不走吗。就算舍不得，也只能和太洋说的一样，跟着研究所搬到新的地方去。智雄想象着那个场景，感到一阵挥不开的忧伤。
如果不在这里的话，很多东西都会变得不一样了，研究所还是这个名字，工作室和宿舍的排布说不定也不会有很大变化，但是不会有公园了，也不会有一个和这里相同的夜晚再次出现。他很难描述那种感受，地点的迁移也像人一样，总有一些东西会被永远留在那里，无论如何也带不走。把这些时光和以逝之人的愿望埋进记忆深处只是刻舟求剑。
或许，那个时候智雄就该知道，任何的预感都不是凭空捏造的，你一定意识到了周遭发生的某种变化，这种变化的气味太微弱了，但又令人不安，于是你假装自己没有发现，以此维持生活的秩序。
在那个所谓的事务会上，代表向他们宣布，研究所要被推平了，不是迁址，不是缩减人员，而是彻底关闭。理由是经费的短缺，考虑到其研究的现实意义和变现价值，决定不再继续推进相关的研究支持工作。听到那些话的瞬间，智雄甚至无法控制自己身体的反应，仿佛眼前一下子变成了空的，白茫茫的一片里，只有一个名字像警示灯那样不断跳动着。
那寅拓呢。寅拓怎么办？
研究所不在了，那智雄之前的许诺就像笑话一样，他说要为寅拓创造的痕迹也变成了假的，变成了不可能完成的事。说什么研究意义不够之类的，难道有什么东西比无故死去的人更重要吗？那个时候，整个会场里的人和物体都开始颤抖，昏黑的阴影从代表的脚边长长地拖了出来，照出的不是人的面孔，而是其他更可怕的东西。寅拓死时身边一滴血都没有，可是智雄却看见了由血浇筑而成的轮廓。他就躺在那个深红色的水洼里，平静而温暖地微笑着。那样的笑容怎么会没有意义呢。智雄很想说话，他必须说点什么，他感到眩晕，眼前一阵一阵地翻黑，愤怒和悲伤攒在胸腔里，仿佛下一秒就会裂开，将他的五脏六腑炸成粉末。不该这样的，这一切不应该是这样。智雄有一种使命感，就算到了现在这个地步，寅拓却连辩护都做不了，只有他才能成为他的喉舌，为他的人生发表演说，拼命地告诉大家不要忘记、不要放下、不要让他离开。
你还好吗？太洋问。
……什么？
智雄慢慢地睁开眼，白花花的顶灯刺得他眼睛发痛，他使劲地眨眼，让眼周被生理泪水濡湿。他好像听到了太洋的声音，是太洋在和他讲话吗？
我说，你刚才晕过去了。我吓了一跳。
结束了吗？
你指什么，会议吗，结束了。
研究所没有了？
嗯，看来是的。
为什么？
你没听吗，就那些理由，没钱了，不想再管了。
太洋叹了口气，在床沿坐下，握住智雄的手。
你很伤心吧。
智雄看着他，眼神黑洞洞的，布满了一种浓稠的、了无希望的东西。他张了张嘴，感到喉咙很干，涩得要命，从气管深处涌上一股令人作呕的血味，然后他开始像第一次学会发声那样说话，一个字一个字地往外蹦，停顿，连不成句子。
可是，我不明白，为什么？我才提交了经费申请，明明马上，只要再有一点时间，三个月，不，两个月，哪怕没有这么长，就可以看到结果了，真的，真的会得到我一直努力想知道的那个结果的。太洋，你相信我的吧，你知道我说的是真的，对不对？
太洋说，我知道。
智雄的眼眶一片通红，他把太洋的手抓得很紧，指尖因为用力而泛白，那让太洋觉得他几乎就要死了。
那为什么他们不信？我做的不够吗，是不是我做的还不够？
他捻了捻智雄的发尾，轻声说，智雄，向我许愿吧。
智雄不明白他的意思，你说什么？
太洋笑了，我是天使啊，记得吗？我说过的，我可以实现你的愿望，现在跟我许愿吧。
智雄盯着他说，虽然很感谢你的好心，但世界上是没有天使的。
太洋无视了他话里的否定词，对，天使，继续。
……没有天使。
你想实现什么愿望？
智雄几乎笑了出来，天使大人，我想让研究所继续运作下去，这样可以了吗？
太洋竖起大拇指，非常好，这不是会许愿嘛。
不过是有代价的哦。太洋伸出两根手指给智雄讲解，顺带比了个gyaru的手势。会忘记你喜欢的人，很轻的代价，不觉得吗？
先姑且当作你的设定都是真的，天使崔太洋xi，智雄说，我把你忘了怎么办？
不会的。太洋神色淡淡。之前有很多人在许愿之前都这么说，说什么爱上我了，许完愿会把我忘记之类的，到现在都还记得好好的。
试试看吧，智雄无语地说，真的把你忘了，你不要哭啊。
我说了我会帮你的。
太洋抚平衣服的褶皱，站起来。
我说的话都是真的，崔智雄，你才是，为什么总是不信我？
## 4 · 天使（幽灵）

我走进智雄的房间时，他显得很高兴，他说好久不见，如果是钟燮来做我的护理员，那就再好不过了。我点点头，尽量表现得专业且冷静，智雄的手背上有一块胶布，把留置针的针头压进他的血管，我的视线停在那里，智雄非常白，因此血管的颜色也很明显，那附近有一连片还未完全消除的淤痕。你恢复的还不错。我说，很多人三次捐献后就完结了，但你现在看起来精神很好。我还打算做第四次、第五次捐献。智雄朝我微笑起来，到那时不知道还有没有东西可以捐了。我说，如果你想的话，会有的。他不说话了，手垂着，静静地坐在床上，洁白的被角掖得一丝不苟，拖鞋整齐的摆在地上，方向一致朝外。智雄有严重的洁癖和整理癖，从他在黑尔舍姆的时候起就是这样，这种精神问题像一个恶魔的影子一样缠住了他。我听说他在上一个康复中心对护理员大发脾气，因为餐盘的位置没有按照大小顺序摆放，他就把整盘饭都摔在地上，边哭边大叫着摇头。他想让那里的人给予他正常的对待，而不是把他当成一个精神病来看，事实上他就是一个精神病。他被那家康复中心的人移送给另一个，同样的事情又发生了一次，现在他找到我，也许他并不是有意的，但他的确找到了我。在我还没来得及整理好我的逃避、怀疑和惊恐时，他们告诉我没有护理员愿意选择智雄，于是这件事自然地发生了。
我想起智雄曾经在交换会上买过我的一只铃铛，我用松果壳和铜做的，发不出正常铃铛那种清脆的响声，而是沉闷的、木质的咚咚声。智雄很喜欢那个，他用十个交换币买下了它，实在是亏本生意，那些耗材连一个交换币都不要。后来我想做一把钟琴，智雄偶尔会把他找来的铁片给我。他比我高几个年级，高年级的学生总是有低年级的我们找不到的东西，各种不为人知的渠道、秘密、小团体，或者伟大无法实现的梦想。我问智雄哪里找来这些，又为什么要送给我。智雄摇摇头，眼睛眯起来，狡黠地笑。我和太洋都觉得你很有音乐天赋哦，这不算什么。他让我别再问了，没什么大不了的。我攒齐铁片后，给每个琴键刷上不同颜色的漆，我写了曲子，尝试演奏，但那时智雄和太洋都已经离开黑尔舍姆，去一百公里外的某个农场或福利机构务工。我最想展示作品的人不在了，那首歌的意义也被稀释，到现在为止，只有翔太听过那首曲子，这是一个意外，暂且按下不表。我大概很遗憾，不过已经过去太久，歌词和旋律什么的，连那种遗憾的心情也早就忘记了。我主动申请做他的护理员，是因为我觉得除了我就没有别人了，智雄用十个交换币和几枚铁片短暂地拯救过我，虽然他很快就把我抛弃了，但我有一种强烈的感觉，这些记忆里的好事和憾事来到了它们的终点，到了偿还的时候。这是我的责任，我必须抓住这个机会，我必须和智雄说点什么，在他完结之前。
康复中心的楼下有一座小花园，为了防止花粉过敏或其他感染，只有小部分真正的植物，大部分景观都由塑料花卉搭建而成。自从智雄来了之后，我总能看到他一个人坐在花园里，布满假花的花坛边，低着头，拨弄手背上的留置针胶布，或者什么也不做，只是坐在那，闭起眼睛冥想。智雄不太和其他人搭话，让我想起从前他在黑尔舍姆的时候，他几乎只和太洋说话，起昊来了以后，就变成只和太洋和起昊说话。大多数时间，智雄待在图书馆里，找一些和音乐、艺术有关系的书来读，他对外语感兴趣，有时会用一个交换币让翔太教他日语，而找起昊学英语的时候，智雄从来不给钱。如果不在图书馆，那么智雄会在黑尔舍姆学生宿舍东南方的一个角落里，和太洋起昊待在一起。别误会，我不是智雄的跟踪狂，我发誓在图书馆遇到智雄的前三次，我都没有注意到他，可是从第四次起，我开始观察他，这个总是把头发剪短的高年级学生，在外文书籍区域流连，对着当时的图书管理员太洋扮鬼脸，被起昊从背后抱住时哐当一声踢倒椅子——智雄，那个智雄，要是他有机会学习更多，我想他能成为哲学家，至少是像教师们一样的学者，我曾以为机会会来的，无论是给智雄还是给我。
智雄的第四次捐献将在两个月后进行，我把这份通知念给他听，我们都知道这意味着什么，我看过他的体检报告，已经没什么东西好捐了。他和其他捐献者不同，尤其在肺部的健康状况上，智雄是我认识的捐献者里唯一有吸烟习惯的，这和黑尔舍姆的教导背道而驰。冰冷雪白的阳光瀑在智雄脸上，他的面颊因为过瘦凹进去，可就算这样他也不像一个病患，或者一个五内亏空、行将就木的人。
太洋之前和我说过，智雄身上有种迷人的性格，你也可以理解为一种斗争精神，只要他活着，这种莫名的战意就会一直在那，支撑着他，让他看起来很坚定，同时也很可怜。我看着智雄的侧脸，骨骼的形状从阴影里蜕出来，尖利惊人。任何一个见到智雄现在的样子的人，都能立刻领会太洋那句话的意思。
智雄听我读完通知，沉默了一会儿。他没有看我，而是面朝窗外，因此他的声音也被风带走一部分。
你有没有见过其他人？
智雄布满针孔的那只手不自然地搭在另一只手上，他依旧没有看我。
太洋、寅拓，你知道的，就是他们几个。
寅拓在首尔。我说，他一直在那里。
哦，对。他在首尔那个康复中心，对吧？他一直在。抱歉钟燮，我知道的。
智雄像是突然想起什么，咧开嘴笑了，但嘴角的弧度不够圆润，让那个笑容变得有点尴尬。他一下子陷入某种焦躁的情绪里，无法控制地抠着自己的手背。
我最近有点，很容易忘记事情，可能是太久没有人和我提起他们了，可能是这样，抱歉。
我说，没关系。如果有任何事，你都可以跟我说，我现在是你的护理员。
不，不是的，没有事，什么事都没有。智雄紧紧盯着我，他的手背红了一片。
他又问，太洋呢？你见到过太洋吗？
我摇头。没有，没有人见过他。
啊。智雄手上的动作停了，他安静下来，双手平放在被单上，掌根对齐。他的视线在指尖停留了一瞬，然后转向我。
如果是太洋的话，好像也没什么值得奇怪的对吧？他说，太洋，太洋一直就是这样的人，你明白我的意思吧，钟燮？
又是这样。我不自觉地皱眉，每次谈起太洋，智雄就会这样，像一个孩子，变得比平常恳切，更坦然地表达想法。他和太洋之间的关系十分密切，那种感觉就像，仿佛他和太洋说话时使用的是一种与一般对话完全不同的语言，这让他人无从插足、理解甚至是评价他们究竟是怎么一回事。几年前，当那个传言在我们之间流行的时候，我不知道智雄和太洋是否有所耳闻，我曾经非常看好他们，认为他们是最有可能成功得到认可的一对。在黑尔舍姆时，他们的作品总是被选入艺廊，他们在一起很和谐，从不吵架，稳定而平静。智雄和太洋满足了所有申请条件，但太洋消失了，就像我说的，在我们之中没有人见过他，无论是在康复中心还是在捐献室。
这件事是这两年内才发生的，在他做完第二次捐献之后。一个像太洋这样的人的消失，在宏观层面上不会引发任何问题，每个月都有成百上千的人从这消失，这不是假话，我们的生死、存在与否，从来不会被纳入决策的考量，更不会导致革命。但那太洋消失的那一天，没有任何奇怪的事情发生，没有离别的预兆，其实，我们都不知道太洋是从哪一天开始不见的，智雄和起昊从没有怀疑过他们再也见不到他了。但现在看来，太洋一定做了什么，把所有人都给骗了，这个骗局里没有例外，哪怕是起昊，哪怕是智雄。
是的。最后我说，是的。太洋就是这样的人。不知道为什么，我很难面对智雄那张变得像孩子的面孔。
智雄点点头，说，那么，寅拓在首尔，太洋还是那样。钟燮，你去看过寅拓吗？没等我回答，他又自顾自地说，没有去过吧，我猜你没有。如果换做是我，我也不会去的。
我想我知道他真正要说的是什么。
哥，智雄哥。我轻轻地喊他。从我再见到智雄开始，这是我第一次使用敬语。
你想去首尔吗？去见寅拓？
我把掌心盖在智雄泛红的手背上。我可以向他们申请，只是这程度的话应该没问题。
智雄抬起头看着我，露出一个完全放空的表情，似乎在费力理解我话里的意思，这让我感到哀伤。那一刻，我很想把他的样子拍下来，穿越回十年前，拿着照片告诉黑尔舍姆的智雄，在未来，你会变成这个样子，你生命完结的两个月前是这个样子，苍白、瘦削，太洋和起昊都不在你身边。偶尔我也会有这样的想法，我想把那把钟琴还给智雄，那是他找来的铁片，不是我的，也许我从来没有觉得那把琴是我的所有物，我一直带着它，是为了时刻提醒自己寄居在那里的微小恨意，不为人知的嫉妒，撒旦的心。智雄、太洋和起昊都不知道，他们在学生宿舍东南方的角落里聚在一起时，我就在离他们十步远的草丛间。他们不知道那里本来是我的地方，可他们来了之后，我却再也无法靠近那个地方。我看着他们，在他们之中寻找我自己都不明白是什么的东西。我开始关注智雄，我发现我总是在图书馆见到他，一次，两次，直到他朝我打了第一声招呼。我们变成不远不近的朋友，友情填平了那份恨砸出来的小小创口，那么多年过去，我居然把它们都忘记了。
此时，我的脑海中又响起了那个声音，那个灭亡的信号，我想智雄一定听到了，我们现在靠得这么近，他没有理由听不到。他喊了我的名字，又说了句什么，我没有听清，下一秒，我感受到智雄的手指颤抖着，抓住了我的。
智雄说，我要去。` },
      { title: "第 2 章", text: `江原道的黎明到来之前，我和智雄坐上了前往首尔的车。智雄目前的身体状态还算稳定，但不能长时间离开营养剂供给，因此我把紧急注射工具带在身边，防止意外发生。列车车厢里很静，智雄注视着窗外，前几天下雪了，地上还有残雪未消，灰败的景色飞掠过去，他浅浅地、小口地呼吸着。我不知道智雄在那两小时内想到了什么。
我们到达首尔站，鉴于智雄的身体状况，康复中心派车来接我们，车外没有任何康复中心的标识，我感到奇怪，但那种怀疑只存在了一秒钟，我很快确认了车牌，对智雄点了点头。我握住车门把手，正要用力，车窗被人从内部摇下了，露出一张对我、对智雄而言都万分熟悉的脸。
起昊坐在后座，额发精心梳理过，用发胶一丝不苟地拨到脑后，他没穿康复中心给捐献者准备的统一制服，而是穿了一件灰粉色的连帽卫衣，看起来很时尚，很年轻。他把手抬到脸侧，一只眼睛用力地眨了一下，他说嗨，好久不见，我和智雄像两座雕像立在原地。那叫什么，我在脑海中搜索那个英文单词，wink，尹起昊时隔多年，和我们再见面，做的第一件事是发射一个wink。好荒唐，但又确实是尹起昊的作风。智雄显然还在消化这个事实，无力回应他的问好。我张了张嘴，即使一时间想不到说什么，但总觉得要先摆出说话的态度才对，起昊看着我的样子笑了，善解人意地邀请我们上车再说。
我钻进副驾，智雄坐在了起昊身边，他和司机说了个地址，后者沉默地应下，发动汽车，我看着窗外不断倒退的街景，那并不是去康复中心的路。
很惊讶？还是好奇。我有一瞬间恍惚，起昊脸上的微笑十年如一日，仿佛黑尔舍姆的时光从没有在他身上留下印记，他拍拍智雄的肩膀，说，智雄，你不记得我了？放松点，别这么紧张。
智雄硬邦邦地说，没有。
起昊的嘴角弯了弯，你还是和从前一样。
智雄的神情没有变化，那是他表示拒绝的方法。
好吧。起昊瘪了瘪嘴说，你们不是来找寅拓的吗，他现在不在康复中心了，我知道他在哪。我现在就在带你们去。
你的车哪来的？寅拓为什么走了？智雄连着问了他两句。
起昊没有立刻回答他，而是凑到智雄面前，笑眯眯地问，智雄啊，你做了几次捐献了？三次？四次？他看起来十分随意，语气满不在乎，但我知道那其中蛰伏着别的东西，一种警示、担忧、难以觉察的威胁，起昊本来就是这样，对智雄的一切都疯狂地想要插手。我曾经怀疑过起昊是否也有精神上的问题，他最严重的那段时间几乎和智雄形影不离。我认为他想过要完全掌控智雄的生活，变成一个无处不在的人工智能——类似那样的存在，某种程度上，那时的起昊可以为智雄做任何事，可以满足他的任何要求，而做到这一点的那一刻，起昊也达到了自己的圆满。但事实上，起昊表现出的则是相反的，他不同意智雄，不认可他（也许这种不认可只是他的手段之一，我并不清楚），他拼尽全力地争抢智雄想要的东西。一开始，智雄不理会他，智雄本来也不是在意这些事情的人，但不知道从什么时候起，我看到他们走在一起，在我观察智雄的时候，起昊出现的次数越来越多，甚至超过了太洋。我清楚地明白，一定有某一刻，起昊比太洋更贴近智雄，因为他们总是吵架，在吵架的时候，我们总是不由自主地说出真正想说的话。
不会是感觉自己要死了才来找寅拓的吧？
我听见起昊这样说，吓了一跳，以为智雄会生气，但他没有。
啊，好烦。智雄深深吸了一口气，他的手指不断地在短而硬的头发之间进出。就算是又怎么样？尹起昊你真的很烦。
那个语气十分熟悉，我几乎愣住了，仿佛我眼前的一切都在不停倒退，一直退回了十年前，我藏在矮矮的灌木丛后观察他们的时候。起昊只要开刻薄的玩笑，或者从嗓子里发出怪声音，智雄就会用这样的语气讲话，尹起昊你有病吧，尹起昊你别发疯了，尹起昊你真的很烦，这些话本来只有在那个无忧无虑的美丽时代才有效力，而从现在的智雄嘴里说出来，反而变得恐怖了，大家都意识到，这不是正确的时机，起昊的眼神顿时变得惊恐起来。
什么啊？我是开玩笑的，拜托有点幽默感吧？
是啊，我知道。智雄终于不再折磨自己的头发了，他望着起昊睁得很圆的眼睛。
可是我说的是真的，起昊，我要完结了，别告诉我你看不出来。
我要去找寅拓，因为他有件答应我的事情还没告诉我。智雄忽然笑了一下。你也会想知道的，起昊，或者说，这是一件只有我们几个才在乎的事。
起昊罕见地沉默了，他低下头又抬起来，嘴唇张了张，似乎想说什么，但智雄没有给他开口的机会，他的表情变得很奇怪，那是一种怜悯之心，从一个更可怜的人身上散发出来，萦绕在我们之间。
智雄的语速忽然变得很快，他紧紧盯着他，飞快地说，我知道你在想什么尹起昊，我要完结了，可是你不能像我一样，没法做那么多次捐献，想自杀又不敢。你一点都没变，你也不相信崔太洋死了。你一直在找他，你想找到他，你想知道他是怎么做到的，你想跟他一样消失在这个世界上。但是你找不到他，一旦你找到他，他就失败了，那么你的行为也没有意义，你们两个完全就是傻子。
起昊不说话，我注意到他的肩头在发颤。智雄又说，你甚至把黄寅拓接走了，他却什么都没有告诉你。
你也来吧。智雄把布满痕迹的手放在了起昊的膝盖上，寅拓答应我的，就是你想知道的事，崔太洋的事。说完那句话，智雄看向了我。我能够察觉，在此之前，智雄并不打算向我公开这件事，是起昊和寅拓的变化让他改变了想法吗？其实对于智雄和寅拓，我了解的并不多，我总是更多地看到智雄、太洋和起昊在一起的场景，那让我下意识地认为一些事只会在他们之间发生、流传，只会影响到极小范围内的人。这个结论在很长一段时间内都是成立的，事实上，任何人从那个范围被流放出去都是一种保护。寅拓应当在这个范围之外，或者说，我理所当然地以为寅拓也被他们以某种方式保护了起来，就像他们保护我和翔太一样。
现在可以告诉我了吧，你的车，还有为什么寅拓不在首尔的康复中心了。
起昊看起来被智雄的话说服了，他的语气骤然变得平缓，在我的印象中，起昊很少用这样的语调讲话。他讲韩语时，为了避免被纠正发音和连读，总是讲得很快，兴致高昂，像在唱歌。他警告智雄，我可以告诉你，但你最好说的是真的，如果发现你骗我，我才不会管你是不是要完结了。那是一句毫无威慑力的话，智雄轻轻地笑了起来。起昊转开脸不去看他，深吸了一口气，开始跟我们解释寅拓离开首尔康复中心的原因。寅拓一周前搬到了靠近月尾岛的分部去。那里本来是一座废弃医院，三年前被批准重建，翻新之后运了从各个康复中心收集来的多余的设备过去，算是后备机构，现在还在试运行。车是为了方便来回。
我不明白这与寅拓的关系。
需要我们过去测试那里的各种条件，完善设施，还有帮一些其他的忙。起昊说，康复中心让护理员们张贴了公告，如果主动参与试点，在未来捐献时可以享受某种特权。
听到特权这两个字的时候，智雄垂下了眼睛。
可以在身体状态最好的时候进行捐献。意思是，如果你觉得这次捐献的时机不合适，可以申请调换，前后时间间隔不能超过三个月，这个机会只有一次。
其实这不算什么好条件。起昊突然转身，掰着智雄的肩膀，迫使他抬起头来。他的话清晰地落在我耳中。
寅拓本来要进行第三次捐献的时间，是两个月之前。
像古老的树桩裂开了一道缝般，我感到身体中某个地方发出了咔的一声。我产生了一种预感，有什么事情将要发生了，尽管在那时，我并不知道这会对我们造成多大的影响，那是一种只有我们之间才能互相懂得的感受，一种久久盘旋在黑尔舍姆的记忆上空的忧愁。如今它终于像一排烟火一样，被寅拓点燃引线，将未来的图景炸开一角。
我们都知道这时刻总有一天会到来，甚至在我们没有意识到的时候，就教自己做好了迎接的准备。我曾经真诚地相信，智雄和太洋会带领我们越过那个时刻，然后我们中的一些人能够在音乐、画作和雕塑的怀抱中入睡、发梦、寻找终点。这个想象在我当上护理员的第一年就变得残缺，到现在，它早就所剩无几了。但偶尔，我还是会想起它，就像想起智雄帮助我完成的那把钟琴。接着我又想起我作的歌，那首歌除了翔太还没有人听过。更加偶尔的时候，我需要它作为我的武器，来对抗那个如影随形的灭亡的信号，因为不管它有多么残破，那都是我能抓住的唯一一件东西。黑尔舍姆从未远去，它带给我们的那些变化，变成诗句、歌声，永远地留在了我们的身体里。我意识到，我把太洋的失踪当作一个希望，这个执念的程度之深，远远超过我自己的预想。恐怕智雄和起昊在这方面的感受只会比我更严重。起昊说完那句话之后，智雄从鼻腔里挤出一个僵硬的单音当作回答，我开始想象，比我年长四岁的他们是如何度过没有太洋的这几年。
我们都没有说话，沉默地看着车窗外的街景，楼房渐渐变少，白色的阳光从天空中倾泻下来，铺满了越来越宽阔的路面，未化的积雪让整个城市变得洁净而明亮。我忽然觉得接下来即将发生的事情并不真实，陷入了一种说不清楚的梦幻之中。如果寅拓知道太洋的秘密，他为什么不说？他不可能不知道这对智雄和起昊来说意味着什么，可他依旧什么都没说。哦，他和智雄做了一个约定，可是为什么？在这件事情上，把时间线拉长没有任何意义，因为这已经不会对结果产生影响。我在脑海中搭建着这块拼图，试图把一切都联系起来，但缺少的线索太多，连一个基本轮廓都无法完成。他们四个干了很多事情，我敢肯定，那些线索不是不存在，而是只存在于他们之间。那一刻，再见智雄时我感受到的微妙的恨意再一次攀了上来，我不是傻子，甚至可以说，我比他们几个都聪明的多，可每一次被推离事件中心的人都是我，他们推开我，再推开翔太。事实上除了消失的崔太洋，他们没有做成任何事，我早就说过，如果他们成功，那么一切都不会是现在的样子。那么失败的几个人，到底为什么还在坚持？就在我以为我们会一路无话到目的地时，起昊突然开口了，他已经恢复了平常的语调。
你说寅拓知道崔太洋的事，什么方面的？
智雄犹豫了一下，不知道。
起昊又问，他为什么告诉你？
这次智雄撇过了头，慢慢地说，抱歉，起昊。我想这个我不能跟你说。
他冷笑了一声，我也没那么想知道。过了一会儿，我听见起昊握紧了双手砸在后座上的声音，他说，钟燮，你是站在我这边的吧？我还没来得及回答他，他又像想到了什么事一样，懊恼的抱住了自己的头。
……妈的，我忘了。
我愣在座位上看着起昊，他看起来像个犯错了的孩子。
我忘了，哈哈，你一直都，你不是一直都是太洋那边的嘛。
啊，原来是这样。如果不是起昊说出来，连我自己都要忘了。那时，一股莫大的悲伤击中了我。
是因为这个吗？我无声地看向智雄。是因为这个我才得以一窥他们的秘密吗？
智雄又露出了那副表情，饱含着犹豫、小心翼翼，和一点悔恨。
钟燮啊，如果你不想的话，抱歉。我们不会……
我想知道。
我打断了智雄，我想知道太洋哥的事。
我想知道崔太洋的事。
我第一次发现讲出这句话没有我想象中那么难，而说出来之后，我有一种想哭的冲动，我已经很久没有哭过了，这也是我从太洋身上学来的，在面对一些不重要的、无论成功与否都无所谓的事情的时候，不必投入过多精力，不要太认真，不要把完美当作目标。不要为这个烦人的现实世界哭泣。太洋给我留下的只剩这些，而在他消失后我就一次都没有再主动想起过。康复中心里有时会碰到我在黑尔舍姆的同期，其中有个人说，我和那时比起来变了很多。他提到了太洋的名字，他说他觉得太洋死了，我们中的很多人都死了，崔太洋怎么可能活着，凭什么活着？他早就死在不知道哪个地方，连尸体都腐烂了吧——我知道，他说的大概率是真的。我们中的大部分人都很保守，相信并敬畏着这个社会系统的权威。对于他们而言，逃脱是不可说之事，如果太洋是一个叛徒，那当然不会有什么好下场。而剩下的那些，像我、智雄、起昊这样的人（或许只有我们几个吧，我总是倾向于使用积极的语调），我们相信太洋还活着，他的脸飘荡在自由的上方，被当作希望的标识。不过，那个人绝对不想以这样的方式被记住，在某种程度上，这是我们给太洋不告而别的惩罚。
那天我想了很多有关太洋的事，别误会，我也试图将他从我的脑中挥散，因为想起他总会让我的思维变得缓慢、没有效率，我非常讨厌这种感觉。但我没能成功，只有那一天，崔太洋像个诅咒一样纠缠着我。我想起他在音乐教室里弹吉他唱歌的样子，他喜欢听那些有点过时的、节奏舒缓的抒情歌曲，和我喜欢的不是一类。那个画面很适合被画下来，午后的阳光穿过窗户洒在地上，给他的轮廓镀了一层金。他唱歌的时候总是很有氛围，在那种氛围下，我会产生一种急迫感，想要抓住当下那一秒的太洋，仿佛下一秒他就变了一个人一样。但事实上，我清楚地知道，太洋是不会变的，没有什么事情能让他改变。
对不起，钟燮。起昊向我道歉，我不是故意的。
我摇了摇头，平复道，没关系。起昊哥，我现在不这样了。他十分担心地朝我看过一眼，我微笑着说，真的。
我没有告诉他们，在太洋离开后的很长一段时间里，他曾在音乐教室唱过的那首歌，早已变成了每个午夜悄然而至的，我梦中的凶铃。` },
      { title: "第 3 章", text: `冬季的海有一股特殊的味道，寒冷延缓了那种咸涩，把动物的气味压在距离海岸线很近的地方。越是靠近月尾岛分部新修的大门，这种味道就越强烈，我的鼻子有点不舒服，但什么都没有表现出来。这种不适提醒了我，我的职责是看护智雄，我应该把注意力放在智雄身上，而不是从刚才开始就一直胡思乱想，对即将发生的事情抱有过分的期待。
起昊带我们坐电梯，红色的数字在显示屏上不断跳动，1、2、3、4，那短暂的几十秒内，我们被隔绝在这个金属箱里，起昊低着头不知道在想什么，智雄则开始无意识地抠自己的手背，尽管那块皮肤已经红肿不堪、布满疤痕，但智雄就像没看见一样，那是他的病征之一。我提醒道，智雄，停下来，不要再继续这样做了。智雄的肩膀猛地一缩，然后缓慢的松懈下去，他没再动手，盯着地面发了一会儿呆。电梯停在了十二层，门打开了，一片刺眼的日光泼在我们头上，有个人站在走廊的不远处，那是寅拓，我想智雄比我先认出了他，那一瞬间，他条件反射般再次绷紧了原本放松的肌肉。
智雄哥，钟燮，好久不见。寅拓走近了，他穿了一件藏蓝色的外套，休闲裤，他的样子还是和在黑尔舍姆的时候一样，只是更瘦了，我为此感到高兴。无论如何，保持一件东西不变是很难的，不管它是什么，到最后它总能发挥作用，我们需要不变的东西来找到路。
智雄没有回答他，从进入分部的门开始，智雄就没有说过一句话。
寅拓的房间在十二层的尽头，房间里有一扇巨大的窗户，正对着大海，我们坐在床上，可以看见遥远的海面上翻卷的浪。
风景不错吧？我一直都很想住在海边。现在终于实现了。他的眼睛微微眯起，一副陷入回忆的模样。我发现寅拓说话的语速比从前慢了不少，配合着室内宜人的温度，有一种泡在温水里的舒适感觉，这让我几乎忘记了这场对话的主角并不是我。
好在主角本人没有忘记。智雄突然开口问，为什么？
寅拓答非所问，你们还记得凯丝老师吗？上地理课时，她总是会在黑板上铺开一张巨大的地图，告诉我们那些色块所代表的国家名字。加拿大——韩国，这么远，起昊哥后来跟我说，他应该就是穿过了很多片海才到达这里的。只是看着那张地图，我没法想象出大海的样子。
九年级末尾的那场交换会上，我用五个交换币和凯丝老师换了一枚海螺。那是我第一次亲手摸到海里的东西，触感很神奇，介于塑料与铁之间的一种感觉，并不光滑，但很干净，凯丝老师让我把它放在耳边，说可以听到海的声音。我的确听见了非常轻的风声，像幼年的动物在叫。可是那真的太轻了，我以为凯丝老师在骗我，可能那只是交换会里其他人发出的声音被收进来了，凯丝老师却说不是的，如果我亲眼见到海，会发现能听到的也只有这些而已。她一说完就立刻捂住了嘴，神色变得十分悲痛，那时我还不知道这句话的残忍。
寅拓拿起桌上的水喝了一口，轻轻皱起了眉，但嘴角仍然向上翘着，起昊和智雄都没有说话，他们并排坐在床边的小型沙发上，像两个听课的学生。我从来不知道寅拓的脸上会出现这样的表情，这样像一个大人的表情。寅拓本来是我们之中最不像哥哥的那一个。
我想，也许寅拓并不是没有变的，其实我一直都明白，只是不想那么快承认，好像一旦承认我就失去了他。
寅拓继续说，用着我不习惯的大人的语调。
太洋哥是那个时候来的，他的交换币很多，我们都知道，他的作品总是被选入艺廊。他在凯丝老师的面前停下，开始端详桌面上摆放的物品，那一次很多东西都是从外面来的，比我们自己做的要受欢迎的多。太洋哥看中了一个徽章，银制的，非常贵，而且也没有什么稀奇的，但他抖抖自己的袋子把所有交换币都倒出来了。凯丝老师问他为什么要买这个，太洋哥只是说喜欢，她又问太洋哥是不是看出什么来了，太洋哥没有回答凯丝老师的问题，而是反问她，您希望我看出什么呢？
不合时宜的，智雄从喉咙里发出一声闷闷的笑，他说，那家伙一定是看出什么了才说这些。
不是的，智雄哥。寅拓摇摇头，太洋哥什么都没看出来。那个徽章，他后来拿去问了给我们上文学课的恩俊教授，恩俊教授说那是从海军的军装制服上摘下来的，看材质徽章的主人等级不低，只是时间太长，原本刷在上面的漆都褪了颜色。起昊哥那时还很想要那个，但太洋哥一直不给。
他还指望着以后出去了拿那个卖钱呢，谁会买他的东西，看起来像个诈骗犯一样的人。起昊的笑意并不真切，我知道他说这话的时候其实很难过，还不如给我用来搭配衣服。
那个徽章太洋哥一直带着，从黑尔舍姆到农场，再到康复中心。智雄哥你知道的，我有一段时间一直和太洋哥在一起，直到他进行第二次捐献，我都是他的护理员。
对于寅拓所说的那段时间，我知道的很少，那时寅拓已经离开黑尔舍姆，在农场工作了一年，而太洋和智雄则是他的前辈，他们只需要再在那个地方待几个月，就会前往康复中心，他们可以选择申请做护理员，或者直接开始捐献。一般护理员的任期是一到两年，他们卸任开始准备捐献的时候，寅拓正好结束农场的工作，接替他们——这都是智雄来到我所在的康复中心后告诉我的，我们一旦离开了黑尔舍姆，就再也不会回去，在最后的那几年中，除了流言，我没有任何渠道得知他们的情况。
太洋哥是一个很好的护理对象，我是说，他不害怕捐献，也不太对护理员发脾气，他偶尔会大喊大叫，但我们都知道他没有真的生气。寅拓低下了头，他用力咬了一下嘴唇，留下一道泛白的齿印。其实，我看到那样的太洋哥，感觉很害怕。
我总是觉得，太洋哥不是不害怕捐献，而是对捐献、康复中心、对我们的存在，对这所有的事情都没有想法。第一次捐献之前，太洋哥说，他想试一下。我不知道他是什么意思，他说试完就知道了，那次捐献结束他在手术室里躺了很久，醒来后我也忘记要问他了。过了好几天，智雄哥的第二次捐献通知就下来了，我们都不懂为什么会这么快。我们三个，我、智雄哥和太洋哥，坐在康复中心的公共休息区读完了那份报告，太洋哥突然说，好像失败了，智雄哥问他在说什么，他又嘻嘻哈哈地笑起来，像他平常一样，说了点逗我们开心的玩笑话。
等一下，寅拓。智雄忽然从沙发上站起来，他走到寅拓面前说，这和你要说的事情有什么关系？我们坐在这里听你讲这些都知道的事，拜托，不要浪费时间。
智雄，你没有明白吗？寅拓睁大了眼睛，那里蓄满了泪水。太洋哥是觉得没意思，不好玩，不想在他不喜欢的事情上一直坚持、挣扎，因为这样他才走的。他的第一次尝试失败了，他发现他并不如自己想象中那么痛恨捐献，但同时，他也不喜欢它，所以，这一栏变成了空白的。在我们不知道的时候，太洋哥可能做了一万次这样的尝试，结果都是失败。逃跑，失败；留下，失败；为此奉献，失败；彻底摧毁，失败；真心爱上它，失败。选项被一个一个划掉，留给太洋哥的，那些他认为值得的东西越来越少。也许他尝试过，活下去，但最后也还是失败。
哥，寅拓捂住了脸，眼泪不断地从他的指缝间往下流，我真的很害怕，我也不知道说这些是不是对的，我只是真的，我怕你们把太洋哥原本是一个什么样的人给忘了。太洋哥不是最先放弃的那个人，他从来都没有这样过。
寅拓啊。智雄沉默了一会儿，伸出手，摸了摸寅拓的头发。真的，辛苦了。
从寅拓接下来的讲述中，我得知了，太洋和寅拓来过两次月尾岛，分别是在农场工作时，和太洋进行第二次捐献的前夕。
第一次是瞒着智雄来的，寅拓说，太洋哥那时并没有想特意瞒着他，只是恰好，智雄被农场主分配去隔壁镇帮忙，太洋负责监督我们，我们分开了一个星期。
那时寅拓的状态很差，他无法在工作上集中精力，因为另一件更重要的事占据了他的脑海，他什么都不想做，只想找到自己的原型是谁。是的，原型。在黑尔舍姆，老师们会特别注意不提起这个话题，据说这会影响我们的身心健康。只有一次，恩俊教授在文学课上提到了它，而说起这个话题时，他的表情变得有些扭曲，那是对我们一向温和有礼的恩俊教授绝对不会展现出的样子。
他说，你们得知道你们是为什么来到这个世界上的，这比一切都更加重要，比我们在课堂中教给你们的这些，文学、艺术、道德都重要，你们每个人都必须记住，并且在一生中都绝对不能忘记。
教室里有人回答他，不是捐献吗？教授，我们是为了捐献才来到这个世界上的呀。
不，你们不明白这意味着什么。恩俊教授放下了书本，你们的原型，你们的，父亲母亲，那都是……那都是一些非常坏的人，道德也好，素养也好，你们拥有的东西他们都没有，可是他们，却，是你们的原型。黑尔舍姆的存在是为了让你们为此感到困惑，感到痛苦，这样你们最后才不会变成他们。你们不能闭口不谈，不能甘愿栖息在这个囹圄之中而不走出去，即使你们做不到，你们也要……
课堂不知道从什么时候开始变得一片死寂，只有恩俊教授的声音在空气中回荡着。他看起来非常激动，但强迫自己冷静下来，他一直死死掐着虎口，似乎想用那份痛楚提醒自己不要说太多不该说的话。可是他的目光扫过我们的脸，轮流注视着我们的眼睛，下一刻他的双腿开始颤抖，我们静静地坐着，体会着从恩俊教授身上散发出来的陌生的情绪，恐惧、悲哀，或许还有别的什么。
我们被创造出来就是为了捐献。这句话将一个恒定的未来刻在我们头上，像农场里给待宰的动物打上标记，可是那又怎样？除了刚知道这件事的那几个月外，没有人害怕这个命运，即使偶尔出现关于此的严肃讨论，也会很快在轻松的谈笑中溶化散去。我们的器官，我们的原型。聊起这些，大多数人都只是微笑，即使曾经大家都幻想过，也许我的原型是很了不起的人，但那些假设无法被证实，最后也就没人再说了。恩俊教授那次也是如此，我们沉默了几分钟，然后教室的某一个角落里忽然发出了一道轻轻的笑声，随即，这道笑声开始扩散，我们还是笑了起来，就像恩俊教授在课上开了一个无伤大雅的玩笑。
自从寅拓在交换会上买下那只海螺后，他就爱上了大海，他把海螺日日夜夜带在身边，枕着空空的腔体内微弱的波涛声入睡。在梦里，他被一片无垠的蓝色包裹着，迎空是雪白的日光，脚下是被晒得发烫的甲板。他问太洋，哥，你说我的原型有没有可能是一位船长？
太洋当然不知道，但太洋说，可能是，不过寅拓你当船长的话能行吗？当个水手就够了吧。寅拓想了想，他其实也不是很想当船长，毕竟凯丝老师的考试他总是考不好，船长的话地理必须要好才行吧，那当水手也可以，只要能在海上就好。他这么喜欢海，他的原型一定与海有关。于是他告诉太洋，水手当然也不错啦，嗯，渔民那种，都很好，我想亲眼看一看凯丝老师说的海到底长什么样子。
那就去吧。太洋说，去看一看。
寅拓问，怎么去？
坐车去啊。你是傻瓜吗？
什么？可是我的钱不够，离这里最近的海是哪里？
喂，我在这里工作了三年，当然有存下来的钱了。太洋从他随身的包里抽出一个信封，打开给寅拓看。不管去哪片海都绝对够了。他笑得很得意。
哥要和我一起去吗？
不是说去看看就能找到你的原型了吗？太洋漫不经心地摸了一把寅拓的后脑勺，感受着柔顺的发尾在手心划过的触感。说你是傻瓜，怎么笨成这样？是小狗吗？太洋手上突然用力，寅拓被他推的往前一倒。那个哥就这样散漫地说，走吧走吧，一起啦。
决定要出发的时候已经是傍晚，从偏僻的农场穿过内陆到达海边，因为太洋总是在边上插科打诨，本来艰难的路程也变得轻松了。时间太晚了，他们只能坐夜车，到站的时候还是深夜，连一点太阳都见不到。寅拓走出了站台，他瞬间就闻到了海水的味道，咸咸的，藏着淡淡的腥味，让人眼睛发痛。他知道大海真的就在离他不远的地方翻涌着，然后他感到有点伤心，还有一点难以置信，原来这是这么简单的事情吗？并没有曾经以为的那些不可翻越的高墙，没有人阻止，只需要一点钱就可以做到的事情，从前是什么困住了他？
寅拓向前走去，脚下的坚硬的路变成了柔软的沙子，潮汐的脉搏在他的身体里跳动。忽然，他踩到了一个凹凸不平的东西，他蹲下去把它捡起来，那是一个海螺，表面覆着一缕缕湿润的水草，摸起来很滑，一不小心就会脱手。从凯丝老师那里得来的海螺躺在他的口袋里，在那一刻变得无比沉重，寅拓把两只海螺都贴在耳边，听着里面传来的呼啸的海风。在如此庞大的存在面前，他们根本什么都不算，寅拓、太洋、凯丝老师，黑尔舍姆的所有人——这个世界上的所有人，每个人能分得的也只是那么微弱的一段风声而已。寅拓终于明白了凯丝老师那时的话。
他们坐在沙滩上，夜色漆黑如墨，看不见大海的全貌，只能感受到一阵阵上涌的静谧的海浪。太洋问，怎么样寅拓，感受到什么了吗？有没有感觉心脏开始扑通扑通狂跳，就像要变身了一样？寅拓摇头，反常地没去接太洋的玩笑，而是说，太洋哥，我的原型好像不是我想象中的那样。
哦，那是怎样？
不知道。其实我……寅拓垂下了头，攥紧了自己的衣摆。其实我知道我的原型是什么，不是罪犯就是瘾君子，都是那样的人，我们都是。但我只是，我只是想来看一看，我以为我来了就能弄清楚，我为什么这么喜欢海，为什么总是梦想着能到达海边，我以为我身上总有一点好的东西和它有关。寅拓吸了吸鼻子，努力憋着眼泪，到了现在，他只是不想让自己看起来太可怜。
可是我好像什么都做不到，就算搞清楚了也什么都做不到，我好像真的……
寅拓啊，哭吧。太洋过了一会儿才说，他的声音被风扯碎。
不是想哭嘛？我不会嘲笑你的。哭完之后，我们就该走了。
寅拓把那只他自己捡到的海螺带走了，和凯丝老师的那只放在一起，藏在他床头的一个小盒子里。那天回程的路上，太洋跟寅拓说，以后找个白天的时候再来一次吧，那个时候，嗯，等你看到阳光洒在海面上的那个时候，我就送你一件礼物。
太洋哥说的礼物，寅拓说，就是那个徽章。他在这片海滩上送给了我，在第二次捐献之前。
太洋哥失踪之后，我经常想起那一天。那时我还在做他的护理员，为他的第二次捐献做准备。他很健康，我理所当然地以为他的人生会很长，那种可怕的可能性不会降临在他身上。你们知道的，太洋哥永远都是什么都不在乎的样子，就好像真的没有事情能伤害到他。但是那天，距离捐献还有一个礼拜的时候，太洋哥突然说，想再去看一次海。
寅拓的眉毛拧起来，回忆与太洋有关的细节让他分外痛苦，这不是他的错，在场的每个人都知道这一点，可我们都无法开口说一个字。这份痛楚太重了，光是把它扛在肩上，就把寅拓压得鲜血淋漓，我们都不敢说能做得比寅拓更好。
他深深吸了一口气，继续说，从农场到康复中心之后，我们的活动范围其实变大了很多，偶尔的外出只要经过申请就能实现，大海不再是遥不可及的地方了，我很少再想起那些关于海的事，太洋哥也从来不提，我觉得很奇怪，但我还是答应了他，我想也许他只是觉得无聊了，想出去玩而已。那一次，智雄哥是知道的。寅拓看向智雄，哥记得太洋哥第二次捐献时的事情，对不对？
智雄点点头，又摇摇头，只有沉默。
总之，那次，我们又来到了这片海滩，我和太洋哥一起看到了波光粼粼的白天的海。金色的阳光铺在海上，海平线融化在视线的尽头，整个天空都非常的亮，亮到让我感觉这个地方永远也不会天黑。真的就像，不，比在黑尔舍姆的艺术课上看到过的任何一幅画都要美。那时候太洋哥站在我边上说，上次说好要给你的礼物，今天我带来了。他把那个徽章给我，然后又说，说是从海军军官的制服上摘下来的东西呢，至少是个上将吧，我们寅拓喜欢海吧？以后要是真的当上船长什么的，要记得最开始鼓励你的人是我啊，嗯？我说，哥在开玩笑吧，明明知道不可能……他就又那样哎哎的叫了两声，让我别说这样的话。
就算知道不可能，也要当作有可能一样啊，得那样活着才行。太洋是那样说的。现在想想，他从那时候开始，或者比那更早的时候，就已经在考虑这件事了吧。
寅拓说完这些，整个人变得很疲惫，起昊把不知道什么时候准备好的药递给了他。房间里没有人说话。我盯着寅拓的脸，感到心脏的某个地方猛地搏动了一下，也许我们，无论是我、智雄还是起昊，我们都太害怕了，和寅拓不一样，我们把这种恐惧藏在心里，任由它生根发芽，遮天蔽日，盖过了那些后悔的。时间长了，连曾经那么后悔的是什么都忘记了。
第二次捐献结束后，太洋哥不是来问哥了吗，问哥要不要一起去海边玩。寅拓把药合水咽下，忽然走过去抓住了智雄的肩膀。智雄被抓得一抖，仰起脸，和寅拓对视着，从我的角度，看不清他的表情。寅拓的声音在空旷的房间里回荡。
哥说不想去，因为讨厌水。
哥其实知道吧，知道太洋哥到底是在哪天消失的，知道他去哪了。哥一点预感也没有吗？我不会信的。连我都能感觉出来的事情，哥怎么可能……
寅拓。智雄轻轻握住了他的手，不要再说了。
为什么不？哥现在这样不要命地做捐献不就是想死吗？不是因为愧疚吗？寅拓甩开了他，眼眶通红一片。宁肯装作什么都不知道，也不想回忆那个场景，按照自己的想法把太洋哥当成神，什么失踪了却没有一个人看到，哥不要再自欺欺人了。就算真的恨死他了也比这样好，为什么只有我记得？那么痛苦的事情只有我一个人做了，我本来想这一辈子都不告诉你们，让你们难过到死才好，可是，可是……
可是那样的你们也一样可怜。
我也是。寅拓泄了力，喃喃道，我也是。我听说智雄哥要做第四次捐献了，我怕来不及，我真的真的很害怕。
我呆呆地坐在那，看着寅拓说话的脸，颤抖的嘴唇，智雄哭了，他哭起来一点声音都没有，起昊沉默地站着，药盒被他捏得不成样子。那一刻，我好像也明白了，太洋那个时候，为什么就那样走了。好像不管捐献与否，不管这件事的结局是什么，你已经看见了一个点，那个点就是你最终要到达的地方，然后你只要抬起腿，走过去，一切都在那里结束，你就上了天堂。` },
      { title: "第 4 章", text: `黑尔舍姆每学期会举办一到两次交换会，一次用来展示我们的作品，一次则有机会买到从外面来的东西。对我们而言，这是每一年最令人激动的时刻，我们的作品有机会在交换会上被选入艺廊，这会带来丰富的交换币、荣誉、朋友们的夸奖和羡慕。能有作品进入艺廊是我们在黑尔舍姆的最高目标，我们所上的每一节课、学习的每一条知识都是在为了这个做准备。除了课上规定完成的作业，我们私下制作的物品也可以在交换会上展出，获得登上殿堂的机会。尽管如此，我们并不知道艺廊的用途，它是由黑尔舍姆的管理者（我们喊她夫人）创建的，在凯丝老师的描述中，艺廊是一个收藏着历届黑尔舍姆最优秀的学生们的作品的地方。但在我们提出想看一看艺廊的照片时，她却拒绝了我们。
我记得，那时是秋天，坐在教室里听凯丝老师的地理课时，能够听见窗外的树叶被风吹得沙沙作响，习惯性地，我会聆听并记住自然的声音，我始终相信这会给我的创作带来灵感。最好的艺术不需要刻意装饰和寻找，它们一定存在于最原始的地方。那天的风声和往常没什么不同，就在距离下课还有五分钟时，有人问了凯丝老师一个问题，那个女孩擅长画画，她的画作已经有两次被选中，她总是梳着低低的马尾，坐在靠窗的角落里。
老师，艺廊在哪里？
然后整个教室安静了下来，我们都屏住呼吸，等待着凯丝老师的回答，没有人不对这个问题感到好奇。我抬起了头，看向凯丝老师的脸，我想知道我们的作品究竟在哪里完成了它们的使命，在我的想象中，那是一条被鲜花簇拥的长廊，拥有高而圆的穹顶，深红色的帷幕庄重地垂下，我们之中最好的那些创作，被方形的玻璃展柜保护起来，静静地嵌在丝绒托盘里，迎接观者的赞美。其实，直到现在为止，我都不认为我少年时对于艺廊的幻想太过夸张、不切实际，老师们总说，你们都是有天赋的孩子，把其他东西抛在脑后，只考虑这些：你们要写诗、作曲、绘画，你们必须表达出你们所感受到的世界，因为那是你们存在的意义、你们最后的价值——这些话被当作最基本的学生守则传达给我们。我们从小就明白，在黑尔舍姆，艺术就是一切。那么艺廊就应该是神圣的，它必须是神圣的。所以我不知道，如果它不是这样，那还能是什么样？
凯丝老师拨开垂落在眼前的一缕头发，看了过来，对上了我的眼神。我从她的眼睛里看见了一个庞大的东西，在火光中影影绰绰地摇晃，那时我并不知道那是什么。直到很久以后，智雄告诉我，他们都曾经看见过那个东西，那是我的影子，我们的影子。黑尔舍姆将它们带到了这个世界上，却无法收回。我们被塞满美德与爱，而我们的影子却被迫面对这些美好事物之下残酷的一切，它们最终会失去控制。这个模糊而恐怖的未来让凯丝老师动摇了，她别过了视线，说，很抱歉，我不能告诉你们。在艺廊，记录是不被允许的。
风吹过树叶的声音变大了，那种感觉就像那些泛黄的叶子即将穿过教学楼和窗户，飘落在我的课桌上一样。凯丝老师站在讲台前，由上而下地俯视我们。翔太坐在我身边，把硕大的金属戒指穿进手指又摘下来，被磨损的光面磕在桌面上。我轻轻地盖住了翔太的手，嘘。安静点。我往凯丝老师的方向看了一眼，示意翔太仔细听。翔太用口型告诉我，我听不太明白，这很重要吗？我不知道该怎么回答他，那是一种从心脏底部升起来的奇怪感受，仿佛一颗导弹正缓慢地发射升空，在我的胸腔中嘭地炸开一朵小小的蘑菇云。它提醒了我，这些话背后有足以引发这种震动的含义，只是我们目前还无法理解它。我对翔太说，我也不明白凯丝老师的话是什么意思，可是我想，或许我们应该把它记住。翔太闻言，抓住了我的手，在摊开的掌心写字。
是钟燮的直觉吗？
嗯。我点了点头。翔太学着我的动作，也点了点头，既然是钟燮的直觉，那我愿意相信。
艺廊充满力量，那些力量是由你们创造的，我很感激你们。凯丝老师说，但是有些事不是我们，或者你们能改变的。我们能做的只有这些。这就是全部了，没有照片，很抱歉，真的很抱歉，我们无权拍摄不被认为是真的东西。
翔太冲我温和而遗憾地笑了笑，他还是没有听懂。
但是钟燮，你怎么了？翔太推了推我的胳膊，露出担忧的表情，我这才意识到我一直死死地咬着自己的嘴唇。
没事，我想到了一些事情，但我不清楚那是什么。
真的吗？
不知道。我把头发揉得一团乱。我没法和你解释。说实话，翔太，我也不知道该如何描述它，也许我有点害怕，当然，也可能不是害怕，而是其他的东西。也许我应该找人谈谈这件事，智雄或者太洋，他们可能会知道一些事，我是说，艺廊的事。这和我想象中的那些东西不一样，我无法确定我是不是一直在欺骗自己。也许我只是无法面对，事实与我的想象不同，这件事带来的后果，好吧，也许只是我想的太多，你不要觉得奇怪……
不要怕。翔太用力握住了我的手。
不是，我的意思是……
翔太摇了摇头，打断了我想要解释的动作，他直直地看着我，眼珠很黑，像两颗灌满了墨的珠子。他并不在乎我说了什么。

……什么？
那种拼命伪装出来的轻松，哥真的，很不擅长。` },
      { title: "第 6 章", text: `我和智雄在月尾岛分部住了两天，期间，与起昊的这次谈话是私下进行的，出于一种私心，我没有告诉智雄。智雄知道这件事与否，对接下来会发生的事情没有影响，他的状态很不好，这让我感到难受，同时也十分焦躁。说实话，我不知道要如何面对这样的场景。也许我该说点什么安慰智雄，让他不要再为太洋的离去而感到哀伤，但我们都知道，这不是现实，而是一种掩盖、一种欺骗。作为他的护理员（其实我想说的是，作为他的朋友），我需要保护他不受二次伤害，尽管这个伤口是永久性的，在他的身体上凿开了一个洞。就智雄目前的状况而言，它永远也不会愈合了。我想，除非他主动提出想和我谈谈，否则我绝不会在他面前提起太洋的事。
从分部离开的那天，寅拓把我们送到门口，他没有申请，所以不能走出分部的大门。起昊开车载我们到首尔站，和我拥抱，告别，再和智雄拥抱。智雄没有拒绝他，起昊因此挑起一边眉毛，有点轻浮地笑了。
有进步嘛崔智雄？现在不推开我了？
智雄睁大了眼睛，也不反驳他，只是说，尹起昊你烦不烦。我走了。起昊哦了一声，放开搭在智雄肩上的手说，下次我去江原道找你。智雄闻言，语气略带嘲笑，你来找我？还是不要了。那间康复中心周围都是树林。
他从鼻子里哼出一个闷闷的笑音，别到时候怕的一直挂在我身上，我受不了你。
……钟燮还在边上，你说什么呢。起昊恼怒地拍了智雄一下，然后垂下了头，不说话了。他没有看智雄，智雄也没有再看他。我们之间忽然陷入一片沉默。
我适时地说，哥，该走了。
智雄点点头，他没再和起昊说什么再见、保重之类的话，转身走进了车站。我跟在智雄身后，他一直没有回头，直到进入站台前的那一刻，不知道为什么，也许他想起来他还没和起昊礼貌地道别，也许他只是想看一看起昊那时的样子，总之，他回过头，对上了我的视线：在距离我们几十步路的那个入口处，已经没有起昊穿着灰粉色卫衣的、年轻又时尚的身影。智雄的手指不由自主地折起来，轻轻摩擦着另一只手的手背，他的眼神变得和见到寅拓时一样，充满紧张和一种难以言说的恐惧。我揉了揉他的肩膀，说，哥，轻松点，都结束了，现在我们回去了。智雄一抖，仿佛从一个大汗淋漓的噩梦中醒来，瞳孔里仍有尚未消散的惊惧。我带着智雄上了车，在列车发动的轰鸣声中，智雄开口了。
钟燮，你去过树林吗？
没有。我把语气放得很轻，哥为什么问这个？
我和太洋进去过，在黑尔舍姆的时候，我现在不明白为什么当时我们要那样做。
哥想告诉我什么？我静静地看着智雄，他的侧脸非常瘦，在月尾岛的两天他几乎不吃东西，只靠供给的营养液度日，寅拓所讲述的太洋的故事让他的意志彻底消沉下去。面对一件被自己的记忆刻意忽略的事是很痛苦的，我们都没有因此而责怪或逼迫他。他的脸颊处出现了两道很深的凹陷，如今已经没有什么能掩盖那种疲惫。我的心脏像被丢进搅拌机一样，被智雄脸上越发突出的骨头一点一点地磨碎。他始终看着窗外。从首尔驶向江原道的一路上建筑稀疏，到处都布满了灰尘。就在那一瞬，我突然间很想知道，如果起昊的噩梦是月光下的树林，那智雄的噩梦又是什么呢？
智雄说，抱歉，钟燮，我不知道。或许我很后悔。他的声音像一阵风似的飘过来。真的，很后悔。我以为那会是一场革/命的。
我笑了起来。哥是说，你和太洋哥、起昊哥，你们三个在宿舍东南方的角落里讨论的那件事，本来是一场革/命吗？
智雄猛然转头，你知道？
我不知道。
我有些怜悯地握住了他的手，用指腹抚摸着那些已经愈合的伤痕。
我没有听到很多，但那里原本是我的地方，你们来了之后，我只好把那里让给你们。
智雄呆呆地看着我，说，我们……最开始，只有我和太洋，不，可能只有我，我想逃走，我觉得黑尔舍姆是一个巨大的骗局，它教给我们那些东西一定是别有所图，我不能受它的摆布，我想要自由。
那一刻，第一天来到康复中心的智雄的模样又浮现在了我的眼前。他（或许还有起昊、还有太洋）和黑尔舍姆一样，不由分说地夺走了一些原本属于我的东西。而和黑尔舍姆不同的是，那些微小的恨早就已经消失，只留下一段长长的哀痛，永永远远地缠住我，每一次他们要将我缝入那些记忆的时候，它就会跑出来作乱，提醒我，曾经发生的一切还没有过去，我们的痛苦尚未走到尽头。
我叹了口气，问智雄，那哥现在找到了吗？哥想要的那个自由。
每个人来到黑尔舍姆所知道的第一件事情，就是树林是绝对禁止进入的场所。
总体来说，黑尔舍姆是由教学楼、宿舍、操场和花园围起来的圆形建筑群，除了那扇只有在交换会前夕会开启的铁门外，没有其他的出口。我们知道，黑尔舍姆被一片繁茂的树林包裹起来，外面的世界是危险的，尽管我们在文学作品中学到，外面有餐厅、便利店、正常人类的学校、写字楼。老师们也都是从那些地方来的。但那个社会运行的规则，并不适用在我们身上。我们是不被保护的，唯一保护我们的东西，只有黑尔舍姆的围墙。如果我们想到达那个世界，必须先穿越黑暗的树林。
曾经有一个学生，趁着交换会运输货物的间隙跑了出去，然后再也没有回来，几天后，有人从宿舍的窗户向树林里看去，那个学生的身体悬在空中，被挂在了一棵树的树枝上，随着凛冽的冬风左右摆动。从那之后，树林里有恶魔的传说在我们之间流传开来，睡觉前，我们必须经过一番激烈的争吵，来决定由谁拉上正对树林的那扇窗的窗帘。这往往很难，因为我们都不想做最后一个朝那里看的人。天气晴朗的时候，树林的剪影被月光拓下来，如同蛰伏在窗棂之外的怪兽，而刮风下雨时，树林则像一阵势不可挡的飓风，胡乱、狠厉地席卷整个黑尔舍姆，我们只能围坐在一起，后背贴着后背，以此抵御恐怖的侵袭。在我们的学生时代，对于一个人最严厉的惩罚，就是将他流放到离树林最近的地方站上整整一天，或者阻止他入睡，强迫他整晚面对着林中恶魔的轮廓，让他向我们描述那个失踪在树林间的孩子的尖叫声。
但是，就算是这样，智雄和太洋还是走向了那里，为了证明那个恶魔其实并不存在。
智雄曾在文学课上问过恩俊教授，未来的我们会变成什么样？他把恩俊教授教给我们的职业全都说了一遍，然后看着恩俊教授镜片后面的那双眼睛。教授，我们会变成其中的一个吗？这是一个不需要回答也无法回答的问题，恩俊教授的表情变得很难过。我们中没有人会变成那样，我们从来没有得到过那个资格。智雄知道，班里有一个学生的梦想是去便利店收银，另一个学生想成为货车司机。他人走投无路才会选择的工作，在黑尔舍姆却被冠以梦想这么崇高的名字。我们能够创作出美妙的诗歌、绚丽的画作、悠扬的乐曲，可是没有用，收银台和方向盘依旧是遥不可及的幻想。智雄是一个勇敢的人，从不畏惧解决问题的人，他对太洋说，既然从前那个学生能利用交换会偷跑出去，那我们也可以。我们出去看看吧，太洋，我们不能一辈子都被困在这里。太洋什么也没说，只是点头，盯着手里的乐谱发愣，然后答应了他。太洋是极少数不相信那个传言的学生之一。他并不能理解智雄的热情，但如果智雄向他寻求帮助，他不会拒绝，智雄不是个讨人厌的家伙，至少在他那里不是。况且，智雄为他提供了一个新选项，那是当时的太洋从未尝试过的。他听着智雄在三天内制定了详细的计划，从凯丝老师的办公室里找到的运输车时刻表、所要携带的东西、如何躲过门卫、留存证据的方法、失败预案。这一切都充满了希望，仿佛他们离成为英雄只有一步之遥。
只要成功，智雄最后说，我们就自由了。太洋笑了出来，他搓了一下智雄落在额前的刘海，散漫地说，嗯，自由了。我们智雄自由了之后，想做什么呢？
……啊，好像没想过。智雄做出思考的表情，但是在做到这些之前，想这个没有意义吧。
太洋仰头，把碎发甩到脑后去。也是呢。
等等，太洋你会和我一起的吧？
当然啊，不是答应你了嘛。
用十年前的智雄的话来说，那是一切改变发生的起点。
那一天的开始和智雄预想的一样，趁着卡车卸货的间隙，避开老师和工人的视线，逃出那个厚重的铁门并不是什么难事。他们来到了围墙外，智雄深深地吸了一口气，植物的味道清晰地钻进鼻腔，只是比在黑尔舍姆的操场上闻到的要浓了一点而已，外面的世界完全不像老师们所说的那样，和黑尔舍姆有那么大的差别。智雄有些失望，但他的目标不止于此，他朝太洋伸手，后者从包里拿出一个手电给他，那是太洋一年前从交换会上得来的，上世纪末西方生产的样式，本来只是图样子漂亮才买的，现在却成为了他们进入树林后唯一的光源。
智雄朝树林里走去，他走在太洋前面，手电发出柔和的、米黄色的光，照亮被树叶铺满的前路。严格来说，那不能被称作路，他们只是在树与树之间穿行，凭一个指南针（智雄从寅拓的收藏里拿来的，寅拓会收集一些与航海有关的东西，所以那实际上更像一个罗盘，而且不知道还能不能用）校准方向，尽量朝远离黑尔舍姆的方向前进。
然而，在进入树林的十分钟内，智雄就放弃了那个指南针。轮盘上的指针就像发了疯一样不停乱转，仍谁看都知道是坏了。他垂头丧气地告诉太洋这个坏消息，太洋却什么反应都没有，把指南针收进包里，说，那就不用这个了。
那我们怎么办？
就跟着你的直觉吧，没关系。太洋说，你想到哪里去我们就到哪里去。
智雄回头，向黑尔舍姆的方向看过一眼。
太洋，我们一直走到看不见黑尔舍姆的灯光为止吧。
太洋上前两步拉住了智雄的手腕，脚下的树叶被他踩得沙沙作响。他颔首，微笑着说，如果你想的话。
我们最后失败了，当然，如果没有失败的话，太洋就不会走了。智雄靠在列车座椅上，艰难地弯起嘴角，他想把这些事都用一个轻松的语气说出来，就像曾经太洋对他做的那样，但他没能成功。那股强烈的悔意穿透躯壳，在我们之间逸散开来。他显然低估了那件事的重量，又或许，他在讲述的过程中才刚刚意识到它，所以才无法控制自己。
我们又往前走了一会儿，大概一小时，因为指南针坏了，实际上并没有走出多远。当时我们走到了一块很大的石头前，有两条路，我们正纠结要选哪一个。那时太洋停下来问我，现在要回去吗？我不明白他的意思，后来我才明白他根本就没对这次……行动，抱有期望。我不知道他是什么时候产生那样的想法的。但我很震惊，从我的角度，我还是能够看见黑尔舍姆教学楼的窗户里发出的光亮，于是我说，不是还看得见吗？为什么你就说要回去了？太洋说，因为现在回去，还是等会儿回去，都是一样的。你没做好走出黑尔舍姆的灯光的准备。在走出来之前，你就想好了要回去，那么我们无论走到哪里都没有意义了。
我知道，太洋说的是对的。智雄垂下眼，低声说，那是我和太洋的第一次探险，我们失败了，树林里没有恶魔，但树林里有比恶魔更可怕的东西。我不能把这件事告诉其他人，因为我们最终是失败了，失败者是无权改变历史的。
你知道的，之后，起昊就加入了我们。他很支持我，在某种程度上，他比太洋更加支持我，但我能看出来，他是因为一种更加高尚的心情才投身于此的。我承认我有别的私心，我想成为一个表演者，我想走出黑尔舍姆后把我的作品展示给世界，但起昊不是这样。他好像真的只是依靠着某种决心、某种坚定的信念来做这件事，即使他并没有想通这到底是什么，是不是他想做的。起昊总是，其实我不知道这样说对不对，他可能会生气吧，但他不会等全部想清楚了再行动，只要受到鼓动就愿意奉献。听起来有点蠢吧？要不是碰到我和太洋，感觉他被人骗到死都不会知道。智雄的眼睛很快地弯了一下，我敏锐地察觉到，提到他和起昊、太洋在黑尔舍姆共同度过的时光让智雄的心情变得好了一些，但这种愉快只持续了很短的时间，他的声音又低低地沉了下来，像某种成群的昆虫一齐扇动翅膀，发出令人不悦的嗡鸣。
起昊认为，如果要争取自由，就要彻底破坏掉黑尔舍姆的权力中枢。
我理解了智雄话中的意思，也正是因为理解，所以一瞬间冒出了冷汗。
你是说……
起昊曾经想杀了夫人。智雄的嘴唇颤抖着。尽管我和太洋都觉得他不敢真的实施，但他提出这个方法的时候，我很害怕。这个提议没有被通过，它显然不能被通过。但我们仍然进行了，可以说，一定程度上的试探。那是因为起昊告诉了我们他的发现。
起昊说，夫人害怕我们。
就在那一刻，我想起了我偶然间看到的一个场景。那是那一年交换会刚结束的时候，我路过教学楼三楼的一个露台时，看见了智雄、起昊，还有太洋，他们等在从举办交换会的礼堂到出口的必经之路上，分开三个方向坐在矮矮的花坛边。他们双手抱在胸前，沉默着，似乎在等待什么。几分钟后，夫人推开礼堂的门，走了出来，一向跟在她身边的凯丝老师那时却不知道到哪里去了。一看见夫人，智雄率先站了起来，他很快地朝夫人走去，起昊和太洋则跟在他身后，从我的高度看得很清楚，那是一个极具攻击力的站位，甚至可以说是一个简易的阵型，可他们要对夫人做什么呢？我那时觉得，他们应该什么都做不了才对，可夫人的反应却和我想象中的相反。智雄不断地逼近夫人，而夫人则不断地后退，精心盘起的发髻随着她的动作一晃一晃。她的手臂紧紧地贴在身体两侧，手握成拳，衣袖被攥出不自然的褶皱。智雄越是靠近，她的动作就越是慌乱无措，当智雄的手碰到她的身体时，她完全僵在了原地，仿佛触碰她的不是学生，而是一种更加恐怖的生物。然后我意识到，她在害怕。夫人害怕我们。这句话和智雄的声音重叠在一起。
可是，我轻声问，夫人为什么要害怕我们？
不知道。智雄说，夫人创办艺廊，建立黑尔舍姆，让我们接触到这么多美好的东西，我总是想，她难道不应该爱我们吗？可是她却这么害怕我们。
起昊的发现被证实之后，他反而不提要杀死夫人的事情了。太洋说，那是因为他也没想到那是真的，那让他太难过了。智雄露出一个很浅的笑容，起昊其实是个很容易伤心的人不是吗？反而是太洋，好像无论我们的计划成功与否都与他没有关系，他没有对此表露过情绪，像个机器人一样。太洋就是寅拓说的那种吧，只会做自己感兴趣的事，就算帮我也……
哥，我突然开口，其实我一直很想知道，哥和太洋哥为什么不去申请那个呢？
什么？
那个传言，哥不可能没听说过。真心相爱的两个人可以延缓捐献。我们从小就知道，要用心感受这个世界，用心来创作艺术作品，而我们创作出的好的作品，都被夫人带走了，被选入了艺廊，我们都知道被选入艺廊是申请的入场券。哥和太洋哥不是有那么多被选入艺廊的创作吗，为什么不试试？而且你们明明，你们不是做什么事都在一起吗，几乎是这样。你们的作品一定可以证明你们的心。我，还有当时认识你们的很多人，我们都觉得如果是哥和太洋哥的话，如果是崔智雄和崔太洋的话，申请一定可以成功。是因为太洋哥离开了吗？还是你们申请过，只是没有告诉我们，还是说……
钟燮，你在说什么？
智雄闻言，表情变得有点呆滞，他抬起手打断了我，似乎在努力地处理这段话中的信息。我看着这样的智雄，却比他更加疑惑，难道他们真的完全没有考虑过这件事吗？但那怎么可能呢？我睁大了眼睛，飞快地思考起来，我感到一阵莫名的慌张，就像有什么重要的东西被我漏掉了，正是这一步错误让我永远也无法靠近正确答案。然而，我还没有想出结果，困惑的表情就从智雄的脸上消失了，他抓了抓后脑勺的头发，吐出一口气。我听得出来，他故意使用了一个极度平静的口吻和我讲话。
太洋跟我说过，他不相信艺廊。钟燮你觉得艺术为什么是美丽的？我从前不想这个问题，在我的意识中，这一直是一个不可证伪的真理。艺术当然是美丽的，这有什么好问的呢？但太洋觉得那是因为它实际上没有用，因为无用所以才美，因为美所以才无用。艺术里的心可不像现实中的心一样，可以被挖出来，进行捐献，拯救生命啊。智雄苦笑道，本来我也觉得，艺廊是一个神圣的地方，可上次试探过夫人之后，我不敢确定了。我们几乎没有关注过你说的这个流言，我没有骗你，这是真的，我们要怎么仰仗一个我们不相信的东西？
还有，钟燮。智雄轻轻捏住了我落在肩上的一缕头发。他说那句话的时候，并没有直视我的眼睛，他茫然地盯着地面，又露出了那种像一个孩子的神情，那个神情里空空的，没有悲伤，没有幸福，什么也没有。
智雄说，真心相爱什么的，是骗人的吧？
我和太洋之间，那个，不是爱啊。钟燮，那怎么能是爱呢？` },
      { title: "第 7 章", text: `我和智雄回到康复中心的当天夜里，江原道下起了雨。这几天发生的事透支了智雄的精神，他向我请求一支烟。按照规定，这是不被允许的，尼古丁对肺部造成的损伤无法逆转，吸烟在各种层面上都会降低捐献者的健康状态，对捐献的能力和部位产生影响。但我说过，智雄是我们之中唯一有过吸烟史的人，据他自己称，他是从到农场工作了一年后开始吸烟的。农场与黑尔舍姆和康复中心比起来的确是一个管理相对宽松的场所，我们被交由系统之外的人管辖，他们对我们的情况知道的并不多，大多数农场主不会把我们当作一个健全的劳动力看待，只要完成了生产任务，剩下的事情他们不会过多干涉，因为我们的价值仅限于此。黑尔舍姆认为，这是我们走向康复中心，完成社会化的必经之路。在农场想要找到一些违禁品也更加容易，比如烟草、烈酒、色情杂志（黑尔舍姆并没有严令禁止学生阅读，但我们都默认这为人不齿，即使读了也不会让人知道）。
通过工作，我们或多或少能攒下一些钱，从钱的走向里也能看出每个人性格迥异。起昊买了很多衣服、音乐制品，而智雄把钱全部花在了香烟和书籍上，这两样东西留给他的痕迹也将伴随他一生。我非常犹豫，答应智雄在某种程度上是一种渎职，这是我五年多护理员生涯中从未犯过的错误。但同时，我很怜悯他，这样说显得有点奇怪，但我不知道还有什么词语能够更准确的形容我的心情。我分不清这种心情是因为智雄是我的捐献者，还是因为在经历了这些事后我终于成为了智雄的朋友，得以了解、共享他的秘密和苦楚。我一直在想什么样的选择是对智雄最好的。我始终没有忘记我的职责。我看向智雄，眼神扫过他红肿的、疤痕交错的手背，他轻轻地叹了口气，那一瞬我几乎要哭了，然后我朝他点了点头。转身出门时，我在心中默默地忏悔。可是我还是觉得，我得让智雄开心起来。
他的烟被我收在我的房间里，只有这种时候能拿出来，交还给它的原主人。他搓动火机上的滚轮，幽蓝的火焰莹莹亮起，细而长的灰色烟雾从纸卷的尾端逸出，飘散在我们之间。我闻到一股类似食物烧焦时的味道，但比那个刺鼻一些。其实，这是我第一次亲眼见到智雄吸烟的样子，我感到很新鲜，我没有想到一个人吸烟的时候会轻轻皱起眉头，一部分烟雾会从鼻子里出来，看不出吸进去了多少，气体在肺部游走了一圈，才会化作可视的形态回到空气中。事实上我们中的大部分人对吸烟的理解都非常少，在黑尔舍姆，大家对这件事绝口不提，如果在文学作品中遇到，老师们也会心照不宣地跳过那个章节，连肖像或者插画中出现的香烟都会被一个黑色的圆形贴纸遮住，或者经处理变成其他的东西，这都是为了我们的健康。
我忍不住问智雄，吸烟是什么感觉？智雄笑了，眼睛眯成两条线，他咬着嘴里的烟，从盒子里又抽了一根递到我眼前，想试试吗？还没等我接过，又马上放回去，还是算了吧，我开玩笑的啦，这也不是什么好习惯。
原来哥也知道不是好习惯。我对他幼稚的行为感到无语。所以哥到底为什么要做呢？
啊，这个，可能是因为没办法了吧。智雄慢悠悠地说。
离开黑尔舍姆之后，有种一下子长大的错觉。你会感觉你想要做点什么，或者说，你想找到一件必须由你来完成的事，捐献之外的事。我对我们在黑尔舍姆经受教育的整个过程产生了怀疑，我们是为了什么而创作的？我们是为了什么而守护自己的健康的？后者是为了捐献，我当然知道。但那时我总有一种更抽象的考量，好像每一件发生在我们身上的事情都别有深意，都隐藏着许多不为人知的东西。于是我想，如果我违反规则会怎么样，我会被丢弃、报废还是采取别的处理方式，还是什么都不会发生。智雄轻轻地吐出一口烟。我非常努力地工作，争取每一个离开农场的机会，去别的工作场所交流，他们听说我是从黑尔舍姆来的，都会流露出一种羡慕之情。能够进入黑尔舍姆的孩子是幸运的，我到那时候才知道这件事。
原来其他地方没有创作，没有艺术，没有交换会，没有我们曾经认为都是理所当然的东西。和我说那些话的人面目狰狞，像一头野兽，那其实是一种常态，他们本来就没有被当成人抚养过，也不可能变成一个人的样子，那我们在诞生之初是拥有了什么，才能被这种幸运眷顾呢？
智雄手里的烟燃尽了，他把烟头摁灭在盛了水的小碟子里，放在了床边的矮柜上。
我发现我们什么都没有。黑尔舍姆之外的世界是真的，而黑尔舍姆本身是一个谎言，可是这个谎言却让我们那么快乐。我们身处其中，成为了它的一部分，黑尔舍姆的尖顶刺穿了我们的大脑，让我们永远漂浮在那个高空中，却看不见在更近的地方，匍匐着一团更加庞大、更加沉重的命运。
那时，智雄露出一个抱歉的笑容，让我想要落泪。很长一段时间里，我都认为智雄会成为一个很厉害的人，作家、文学家之流，厉害到我们作为朋友都无法轻易见到他。他是我们之中最会写作的人，他的才华应当得到认可。他读了那么多的书，知道那么多事情，但他仍然没有机会。阅读和写作将这种可能性展现在他的面前，却没有将这种未来带给他。
他攥着那个瘪瘪的烟盒，说，我好像是不够聪明，所以没能找出其他的办法，破坏自己的身体是最简单、见效最快的一个，我是从那个时候开始吸烟的。但我有时候也会想，如果太洋没有离开、起昊的身份不那么特殊，或许我们三个能找到别的路，但是，这样的假设没有意义。
我想起起昊为翔太雕刻的那枚铜块，太洋送给寅拓的徽章。我很想告诉智雄，仍然有一种情绪把他们联系在一起，也许那些记忆带给他们的比想象中的更多，也许那不是没有意义的，只是他们不愿承认。
钟燮，谢谢你。帮我保存这个应该很不容易吧。智雄将烟盒还给了我，调整成舒服的姿势在床上躺下，把被子拉到下巴。他冲我柔和地笑了一笑，闭上了眼睛，那张脸有一瞬间和那个站在黑尔舍姆的图书馆里的智雄重叠。
我站在智雄床边，几分钟后，他的呼吸变得平稳而绵长。安眠药被我藏在手心里，没能找到机会递给他。我想他今晚可以睡个好觉了，我由衷地为此感到高兴。
智雄睡着后，我回到了自己的房间，起昊为翔太雕刻的铜块静静地立在桌上，那个白字非常方正，起昊看上去花了不少心思。我想，能让起昊那样的人坐下来雕刻这个，翔太对他而言一定很重要吧。其实我到现在为止，只要想到翔太是个未经克隆的人类，仍然会觉得难以置信。正如起昊所说，这个事实是毁灭性的。我想不通翔太是怎么出现在黑尔舍姆的。那天我问了起昊这个问题，而起昊告诉我，翔太小时候也许遭遇过很多我们都无法想象的恐怖的事情，被抛弃、被拐卖、被很坏的人折磨，其中的一个就是他来到黑尔舍姆的原因，准确地说，他是被剥夺了作为一个人最基本的权利后流放到我们身边。因为这里连监狱都算不上，只是一座屠宰场。起昊讲话的时候神色平静，仿佛觉察不出其中的残忍。我无法避免地将最后三个字与一些血腥的画面联系到一起，而一想到翔太因为一个错误有可能变成那些画面的主角，我就感到灭顶的绝望将我淹没。
钟燮，放轻松。那时，起昊的声音在耳边久久地回旋，翔太已经离开了，不是吗？
啊，是啊，翔太离开了。我盯着铜块上的白字发愣。翔太离开了，我们却还留在这里。起昊一笔一划地刻下这个字时，是不是已经想过翔太总有一天会走呢？起昊明明什么都知道，可起昊也像那两个哥哥一样，什么都没有告诉我。他们好像达成了某种共识，将我们排除在了那个可怕的未来之外，这明明是不可能做到的事情，他们却那么坚持。哪怕晚一秒钟都好，他们为了无数个可能的一秒钟付出了全部。我感到很难过，但又觉得很可笑，说实话，这难道不是傻子吗？每个人在三到四次捐献后都会完结，这个命运造就了我们。我无法感谢它，但我愿意接受它给我带来的改变，它在我身上留下的东西，这几乎是我们进入黑尔舍姆后每天都在学习的内容。还是说，经历过捐献与否，真的会产生这么大的差别？可是起昊和我一样，到目前为止都没有经历过——如果起昊的身份没有那么特殊。智雄说过的话忽然出现在我的脑海中。
没有任何预兆的，我想起了起昊刚刚来到黑尔舍姆的时候。
起昊是七年级时通过某个交换项目出现在黑尔舍姆的，我们后来叫它交换生计划。那一年，有一些七年级的学生离开，被送到海外，而相应的，也有一些其他国家的学生被送进来。参与这个计划的学校同属于一个国际组织，教育模式与黑尔舍姆类似，我们并不知道交换生计划的详细目标，但我们猜测，那应该是一种类似适应性实验的东西，用来测量不同文化环境、地理环境中克隆人的生理和心理发展趋势。当然，这些猜测都是在我们离开黑尔舍姆之后进行的，他们刚来的时候，我们热烈地欢迎了他们。交换生们几乎都有着金色的头发、宝石般湛蓝或翠绿的眼睛、莹白透明的皮肤，我们中的许多人都以交到一个漂亮的交换生朋友而自豪（只有我们对交换生感到新奇时是这样，在我们习惯了他们的存在后，就没有人会炫耀这件事了）。而上述特征在起昊身上都不存在，他看起来和我们并无差别，除了会说一口流利标准的美式英语。
交换生们的捐献路径与我们不同，他们无需参与农场工作，而是从黑尔舍姆毕业后就直接进入不同的康复中心做捐献准备。他们按照批次，在短时间内集中进行捐献，然后过不了半年，大多数人都会完结。我刚做护理员时，我所在的康复中心还有几个交换生，两个月后，他们一下子全部消失了，然后捐献记录里出现了他们的名字和器官，备注中写满了实验要求。他们只做了一次捐献，却拿走了不止一个器官。在那之前，我并不知道他们会拥有如此惨烈的命运。那时我马上想到了起昊也是交换生中的一员，但奇怪的是，我却没有继续思考下去。也许在我还没有反应过来的时候，我的身体已经替我自主回避了那个令人恐惧的想象。
最先和起昊搭上话的是太洋。举办交换生的欢迎宴时他们被安排在一起，其实我一直都觉得座位表肯定排错了，太洋在外语课上的表现非常不好，每次都要靠智雄的帮助才能勉强合格，实在无法承担接待外国交换生这样的职责。
那天真是历代级的尴尬，主要是，尹起昊坐在那谁会觉得他是外国人？太洋从前每次讲起这件事，都会露出非常无语的表情，噼里啪啦地说个不停。我用韩语跟他说话，他完全听不懂，一直回我英语，可是我也听不懂英语啊，我觉得明明是韩国人为什么要说英语，不觉得莫名其妙吗？后来才知道他是加拿大人，当时真的太无语了。
可是你在我边上一直用很响的声音吃东西，我忍不住了才和你说的。我是那种有不高兴的话就会说出来的人，难道这也要怪我吗？起昊反驳，那不是很没礼貌吗？
啊我真的从小到大都没被人说过吃饭声音很响，太洋睁大了眼睛，瞳孔变得前所未有的圆，说实话，你是故意的吧？你当时，不管是看我不爽还是什么的，总之是故意的吧？在那之后我每次吃东西都很注意有没有发出声音，真的。
没有看你不爽啊，真的没有。起昊这时候又变得很真挚。好吧。可能有一点点，就一点点而已，我要是一开始就很讨厌你的话，之后怎么会喜欢你呢？太洋啊。
太洋闻言瞥了他一眼，眼皮随即耷拉下来，恢复了平常那个没精神的样子，说，你那个也能叫喜欢吗？拜托拿走吧。
起昊说，这样的话我会伤心哦。
太洋说，那你伤心吧。
忽然间，我脑海中的某根神经剧烈地跳动了一下，我最近的记忆总是出现问题，让我不敢完全相信它。我不知道这个场景究竟是真的存在过，还是大脑为我搭建的一种假象。这些记忆的不稳定和缺失对我形成了阻碍，让我在回忆的时候变得更加容易痛苦或者感到迷失。起昊和太洋有过一段十分亲密的日子，这件事人尽皆知。九年级时，那一级的学生们刚满十六岁，一些模糊的感受开始缓慢地觉醒。他们还不明白那是什么，就已经身体力行地对它们进行了表达与实践。老师们从不避讳恋爱话题，爱是艺术创作的重要组成部分，和喜欢的人在一起会激发我们的灵感，让我们感到一种甜蜜的痛苦，而这种痛苦正是心灵的养料。你常常能在黑尔舍姆的校园里看见成双入对的学生，其中一些情侣十分惹人讨厌，因为他们太招摇，将亲热当成一种表演，这令人反胃。而另一些则能得到大家的尊重，即使做出亲密举动，也让人觉得他们是发自内心，情难自抑。太洋和起昊，首先，他们并不是上述两类为人所公认的情侣关系，其次，他们给人的感受十分奇怪，介于两者之间。他们在一起时，你会觉得无法靠近，仿佛他们身边有一道墙，把其他人隔绝在了外面。他们能够理解对方，并且享受这种理解带来的排他性。但与此同时，他们的联系是松散的，比起像其他情侣一样整天待在一起，他们各自都有更重要的事情要做。太洋的感情太少，只能均匀地分给每个人，而起昊的感情太多，足够他毫无节制地使用。因此，在这段关系里他们的位置非常对等，在脆弱的时候互相抚慰，在对立的时候互相制衡。
现在回看，在我们对于跟爱和性相关的一切都十分困惑，迫切地想要寻找一种感受来证明其真实性的时候，他们已经渡过了那个求证的时期。我不知道这是否是年龄差距使然，但据我观察，许多他们的同期生仍为此痛苦不堪。那时，凯丝老师一方面教育我们，性爱是美丽的，当这种本能出现时，接受它，不要感到害怕。和你喜欢的对象做/爱会让你高兴，任何激/情和兴奋都是正常的。但另一方面，从事实角度出发，我们很难做到做/爱而不违反黑尔舍姆的规定。许多人都只能寄希望于进行性行为的时候能有更少的人知道，这样受到处罚的机率就会降低。有一段时间，我们之间流行起“名义性/爱”，比起真的实施，我们只需要找一个对象，宣布公开交往，然后采用文学语言或美术将性/爱的过程描述出来，这就会成为一份能够得到认可的材料，在名义上证明你和你爱的人上过床。后来我们认为这件事费时费力且并不能起到实际效果，只是一个青春期的玩笑，并且有违人道主义（不少人不愿意展现性/爱中的自己，而且证明这件事本身是无意义的，这么简单的事情我们居然没有想到），于是取消了它。这也让我们知道其实身边真的在做的人没有那么多，在名义性/爱没有得到它的名字之前，它早已在我们有关性/爱的聊天中出现了无数次。
起昊和太洋没有参与过这些风靡了一阵子又沉寂的活动，据他们自己所说，在我们都不知道的时候，他们的确尝试过，而且不止一次。这种事必须要自己试过才能被称之为探索。起昊说，其实并没有想象中那么有魅力，即使我很喜欢太洋，但这只是一项释放压力的运动。把它当作运动来看会更好一些，但仍然要找自己喜欢的对象，想象一下和你讨厌的人一起练习跑步，天哪，这太恶心了。太洋白了他一眼，没有说话，一般这样的时候，代表他其实认同起昊的观点。
我曾经很想问智雄，太洋和起昊是怎样走到今天这一步的，但在即将问出口的那一刻，我突然觉得这对智雄是一种伤害。也许他们表现出的那种满不在乎也是智雄想要的，而一旦谈到这个，他却怎么都无法介入他们之间。也许他和我一样也在寻找答案。我们在黑尔舍姆经受爱的教育：我们学习、理解、表达、实践。爱本身也是一种艺术。黑尔舍姆不断地强调它，却让我们内心的土壤变得干涸、难以为继。爱的旋风让那里寸草不生了。我不知道太洋和起昊是如何经受这些，他们总是云淡风轻地笑着，然后一切事情都解决了。如起昊所愿，他们看起来很坚强，能够面对所有问题。他们的青春期了无踪影。爱变成了一件趁手的玩具，被太洋和起昊随便买下、随便丢进口袋中。
可是——我把那枚铜块贴着墙根立起来，在它与墙的缝隙中插入一张小小的纸片，上面写着from keeho，to shota，希望翔太下次来给我送信的时候能注意到这个角落——太洋那样不声不响地离开了，起昊还在等待着属于他的镰刀斩下的时刻。他们明明什么都没有学会，却装作什么都会了的样子，总是那样端着一副大人做派，做的事情却像小孩。
两周后的一个清晨，铜块和纸片消失了。同一天，我收到了寅拓的来信，信十分简短，寅拓写道，起昊哥走了，我不知道他去了哪里，我想我应该告诉你，钟燮。另起一行，希望你和智雄哥一切都好。
我知道，属于起昊的那个时刻终于到来了。在麻药让意识消失前，起昊会想起太洋吗？还是会想起翔太，想起我们所有人。我想到起昊总是微笑的脸，如今，他要拥抱的正是他所害怕的。他搞坏气氛，让大家都很伤心，这是他最讨厌的事。我紧紧捏着信纸，眼泪不断地往下淌。难道那样让人痛苦的感情是爱吗？如果那不是爱，又会是别的什么呢？我想问起昊和太洋要一个答案，他们不能把我们留在这里忍受着永不停歇的噩梦而自己离开。如果命运真的是他们口中的玩笑，我不明白，为什么到最后，连他们自己也被这个玩笑杀死了。` },
      { title: "第 8 章", text: `首尔康复中心的同期告诉我，起昊在做完捐献的三天后完结了，尽管我已经以最快的速度提交了申请，依旧没能赶上。我以为我会很悲伤，但那种情绪在听到消息的那一刻，并不能很清晰地被分辨出来。作为护理员，这不是我第一次面对同伴的完结，无论是进行捐献，还是看护工作，都难以避免地与忧虑和痛苦相伴，有些人能够适应它，而有些人则认为这纯粹是一种煎熬。捐献者撑不过捐献或突然完结是常有的事，无论你在事后收到多少安慰和表扬，都无法抚平看见死亡毫无预兆地降临时那种巨大的恐惧，你会消沉一阵，颤抖着思考那个属于我们的可怕的未来，然后说服自己继续工作，一部分人无法完成这个过程，因此他们无法长久地做护理员，而是很快会被转移，成为捐献者。某些人对于开始捐献这件事甚至心怀感激，那意味着他们的痛苦已经有了一个尽头，再也不必无休无止地等待下去。我想起昊曾经或许也是这样，一边害怕着，一边期待着那个宣判的到来。起昊和我从前面对的那些捐献者不一样，我们有着能够共同回忆的过去，那是一段分外美好的时光，我们中的任何人都不会忘记它。那些和他们在黑尔舍姆共度的日子成为了我的一部分，从我说话的方式、我的表情、我的动作中散发出来，被人们所察觉。我以为我只要拥有那些就能对抗孤独，我以为只要我想，那种情感的力量就能永远存在下去，支撑我捱过那些被恶魔侵扰的漆黑长夜。但起昊的完结带走了它，这些力量不依靠在人的身上就无法存续。某一个瞬间，我只是单纯地在想起昊是怎样度过最后那三天的。如果结局是这样，我宁肯他在做完捐献的下一秒就死去，死在热烘烘流着血的手术台上，总比死在寂静的观察室里要好，起昊本来是多么不能忍受寂寞的一个人。
我把这件事告诉了智雄，他没有立刻做出反应，但我确信我们脑中的想法是一样的。几分钟后，智雄抬起手捂住了脸，眼泪从他的指缝间滴下来，砸在雪白的床单上。智雄只是静静地哭着，什么话也没说。我看着智雄，突然意识到，曾经只存在在我们想象之中的事情真的发生了，这个想象发生在重要的人身上，并且把我们摧毁了。太奇怪了，太洋和起昊都不在了，在我们还没有做好悲伤的准备的时候，这件事就像钻了个空子一样出现了。它一瞬间从假象升格成了切肤的现实，我们亲眼目睹了它，却无法面对它的真身，仍然只能想象，直到它在我们每个人身上都发生一次。只有轮到自己的时候，我们才能摒弃想象的目光，用真实的双眼凝望它，用柔软的内脏迎接它的到来。太洋没能让我们明白这一点，是因为他的心脏未曾出现在康复中心的捐献记录上，他离开得如此的优柔、隽永，而起昊的死干净利落，不容置喙。我后来想，这倒是与他们本人的性格相反了。
我给翔太写了信，如果我们之中还有谁能为起昊留下什么，那只能是翔太了。在不久的将来，我们都完结了之后，至少还有人替我们记得一些事。这和我们的同期比起来，已经是莫大的幸运了，我们都不敢再要求更多。
有时我会想，他们几个根本就没有尽到做哥哥的责任，把一堆烂摊子留给我们收拾，自己远走高飞。要是我和翔太从来都不认识他们，或许也不必承担这些额外的苦楚。他们早就知道这样做的后果，却还是义无反顾地奔向了那个恒久的噩梦。他们是故意的。他们选择了更高的理想，却放弃了我们的幸福。我想让时间停下来，让他们回到黑尔舍姆宿舍区矮矮的灌木丛间，只为艺术苦恼、为恋爱叹息。就算那样的未来也像地狱一般，但只要还在一起，就仍旧有所依靠。我看着智雄消瘦的面颊和红肿的手背流泪，可是我依然不忍心责怪他们，因为他们自己也饱受折磨，到了现在这个无法挽回的地步。
智雄的身体状态越来越差，他一天中醒着的时间几乎不超过八个小时，康复中心决定将智雄的第四次捐献提前三周，以防智雄的情况恶化到无法进行捐献的程度。我作为他的护理员表达了反对，但我的声音并不能在决策的过程中起到什么作用。对于康复中心而言，智雄是一件物品，连商品都不算，因为他不具有任何的经济价值，它才不会管智雄是不是我重要的朋友。
我面无表情地向智雄宣布了这个消息，他愣了一下，但很快轻松地笑了，他让我坐在他的床沿，捏捏我的肩膀，说，钟燮，这不是什么坏事，别难过。
我说，你会死的。
我知道。智雄说，这样挺好的不是吗，说实话，我以为我会是我们几个中最先完结的那一个。我是说，太洋和起昊，我总是想象他们因为我的完结而变得整天郁郁寡欢，连玩笑也没力气开的样子。好可惜我没看到。
智雄的语气分外轻快，但他的目光落在空中，没有聚点，我不知道他在想什么，也不知道他说的是不是他的真心话。
我想我没法再听到寅拓完结的消息了。他摸了摸我后脑勺的头发，慢慢地说，抱歉，钟燮，真的很抱歉。
寅拓从月尾岛寄来了一个包裹，是给智雄的，那是距离寅拓第三次捐献还有四天的时候。包裹很轻，里面的物品被泡沫纸很好地保护起来。我和智雄在他的房间里一起拆开了它，是一卷磁带，样式很久了，看起来是十几年前生产的。智雄在看到那卷磁带的那一刻就僵在了原地，他显然知道那是什么，但却露出一个极度茫然的表情。
我问他，哥，怎么了？
智雄没有看我，而是紧紧地盯着那个东西，他的眼睛一下子变红了，眼泪不受控地溢出眼眶，他的身体开始轻微地颤抖，过了一会儿，这个颤抖的幅度越来越大，他下床时几乎抖得站不住。他把那个磁带抱在怀里，脊背深深地弯下去。我看见他的脖颈处泛出一片红色，我从未见过智雄这么激动的样子，仿佛他在一瞬间变成了另一个人，那种转变触目惊心，令人害怕。智雄断断续续地哭着，我轻抚着他的背，帮他平复情绪，我只能从他喉间逸出的零星单字来辨别他的意思。
这个……怎么会在寅拓那里？
智雄仰起了脸，乱七八糟地看着我，我把他额前被汗浸湿的刘海拨开，用纸巾给他擦眼泪。
能告诉我这是什么吗？
智雄垂下眼，看向被他攥在手中的寅拓的礼物。那卷磁带虽然旧，但保存得很好，没有明显的刮痕，寅拓在寄来前应该仔细擦拭过，连灰尘都很少。
智雄就这样看着它，沉默了很久。然后他开口了，那声音轻的几乎听不见。
钟燮，这里有能播放它的东西吗？
康复中心的音乐诊疗室里有一部老式卡带机，我们有时需要通过播放一些舒缓的旧音乐帮助捐献者放松心情。我把它拿到智雄的房间里，放入那卷磁带，摁下播放键。智雄坐在床上，注视着那台机器缓慢运转。他或许能想象衍纸条在齿轮中被一段段读取的过程，又或许他在想些别的，被这卷磁带藏起来那么久的某个秘密。事实上，我没有任何预感和猜测，只有一种隐隐的不安，觉得寅拓寄来的这个东西一定会改变什么。
磁带刚开始时，只有一大段无意义的噪音，持续了三四分钟。接着，音频断开了几秒，忽然出现了一阵歌声，那个声音很熟悉，我确信我在哪里听到过。大概是唱歌的人站得离磁带太远了，他的声量并不大，歌词也不是很清晰，但我还是听出他在唱一首英文歌，转音连绵，十分抒情。我突然感到一阵紧张，血液在某一刻直冲上我的头顶。我必须要想起来这个人是谁，我有一种强烈的感觉，这非常重要，这一定是我身边的某个人，一个我很熟悉的人。我快速地思考着。
磁带里，那个人还在唱着，过了一会儿，背景里出现了几道模糊的喊声，他的歌声被打断了。他似乎跑了出去，诶诶的应着，之后再也没有歌声了。智雄摁了暂停，说，听出来了吗？是起昊在唱歌。没等我回话，又再次播放。一段混乱的杂音，然后哒的一声，像是某个人的脚步声，紧接着这种声音密密麻麻地重叠起来，不止一个人在走路，其实那听起来更像是跳舞。脚步有节奏地落在地面上的声响，夹杂着笑声，糊作一团的人名。
智雄哥，智雄哥，起昊哥不会生气吧？
智雄闭上了眼睛。
这是起昊在八年级的交换会上得到的旧磁带。他本来是想买来录下自己唱歌的。
智雄停止了播放，把卡带从卡槽中取出来，放在床边的矮柜上。他的身体缩在一起，像一个刺猬，露出惊惧又柔顺的神情。他两只手叠在一起，控制不住地去挠疤痕未消的手背，崭新的伤口瞬间渗出血来。如今，我处理他的问题已经很熟练，我安抚道，哥，停下来。智雄闻言，机械地转过头看我，手停在空中。我抓住他的手腕，用纱布迅速地包住。没事了，哥，不要怕。我凑到他身边，很近地挨着他，通过这种方式向他传达一种安全的讯号。这里不是黑尔舍姆，不是捐献室，我陪着哥，不要害怕。直到这时，智雄才仿佛大梦初醒，放松下来，卸了浑身的力气倚在床头，他开始慢慢地讲话，从我的角度能清楚地看见智雄说话时颤动的睫毛。
那天他录了一半，被太洋叫走了。可能是他还不太会用那个机器吧，所以没按暂停。那时我和寅拓在隔壁，我们大概是在一起玩吧，我不记得了。
我们听说起昊在录歌，就想捉弄他，让他录不成，所以我们去那里跳舞了。那个地方是个很偏僻的教室，好像是废弃的园艺室还是什么的，总之，灰尘很多，跳舞的时候我们一直在咳嗽。那天阳光也很好，从窗户刺进来，刺得我眼睛发痛。我老是跳错，寅拓还嘲笑我。
我们跳完之后把那卷磁带带走了，一直放在我那里。起昊因为这件事消沉了一段时间，寅拓还后悔了，说要把这个还给起昊，再跟他道歉。我想要等起昊完全绝望之后再给他一个惊喜，他一定会很生气但又高兴地流眼泪，我太想看那个画面了。但起昊恢复得很快，他好像转眼就把这件事给忘了，我当时想，那我和寅拓算什么？我们精心策划的恶作剧居然被他这样丢掉了？智雄讲到这里，话尾带上了轻微的笑意。现在感觉真是太傻了。
——所以一直没有给他。我把这卷磁带放在收藏里，连离开黑尔舍姆去农场的时候也带着。我以为我会带着它直到完结，然后起昊的半截歌、我和寅拓跳舞的声音就都变成了只有我一个人能听的绝唱。但在我从农场毕业，准备去康复中心的那一年，磁带却消失了，我明明一直把它放在我收藏的最底层，也没告诉过任何人，但它就是丢了。我当时从来没怀疑过是寅拓拿了。
寅拓怎么会干这种事呢？智雄拉扯着纱布的尾端，看着白色网点上扩散的一小滩血迹。他拿走就算了，现在又还给我。
钟燮，他为什么要做这些？
智雄的语气十分平常，就像在参与课堂提问，可我的视线被泪水糊满，甚至看不清他的表情。我无法回答他。我们从很小的时候就知道，死亡在自己内里，就像果子里有核*。这枚果核随着时间变化，它可能长大，也可能缩小，可能变得坚硬，也可能变得柔软。无论如何，它锚定了我们的生命，将我们搅入一个灰暗的梦中，在那里我们拥抱彼此、送别彼此，每一个人的离开都让它变得不稳固。也许寅拓后悔了，他想跟智雄说对不起；也许上次我们去找他时他就想给我们的，只是他忘了；也许他偶然找到了这个，觉得很好玩；也许他这些年来都在策划一个更大的恶作剧，而他现在成功了；也许他没有那么开朗，想看智雄哭的样子；也许他知道他要死了。我把这些可能性都保留下来，却仍然不知道该怎么面对智雄。我想我没法再听到寅拓完结的消息了。智雄的话在我的耳边久久徘徊。想要第一个去死的人却目睹了所有人的死，好像一点办法也没有，就算去了天堂也永无安宁之日——智雄被迫地、一次又一次地咽下这种残忍。他一定和我一样，又听见了那个灭亡的信号在我们的头顶盘旋，像一个警报一样滴滴作响。智雄的梦就快要坍塌了，他削皮剔骨地把他的死挖出来，献上去，祈求宽恕。我眼睁睁地看着，却无法拯救他。我忽然想，要是他信教就好了，到了这种时候还有神可以拜。可智雄不信，他相信的东西都背叛了他，连他自己的心也不能例外。
我说，对不起，哥。我不知道。
智雄沉默了一会儿，钟燮啊，你的眼泪淌到我的衣服里来了。` },
      { title: "第 9 章", text: `智雄最终没能等到第四次捐献，他和寅拓几乎是在同一时间完结的。康复中心认为是尼古丁毁了智雄的健康，如果他不曾吸烟，或许能坚持到第四次捐献结束再完结。我为他破的那一次例加速了智雄的死亡吗？我站在智雄的房间外，他全身被白布覆盖着，彻底变成了一个死物。直到他被人抬着离开我的视线，我仍然没有回过神来，那种感觉太不真实了，我走到智雄的门前，洁白的床单被风吹起，上面没有人了，我却觉得仿佛还能看见智雄的灵魂在空中飘荡。明明在智雄来到我所在的康复中心前，我都是一个人做着护理员的工作，送走捐献者们。我偶尔会想起黑尔舍姆，但那并不能引起多么大的感情波动，我想起他们，这是一个客观事实。我习惯了独自面对灰色的天空、冰冷的医疗器械、捐献者们疲惫而绝望的脸，我甚至为这样的孤独感到高兴。也许是因为康复中心的阳光与黑尔舍姆不同，风中不会传来学生们念诵诗歌、合奏音乐的声音。
我躺在床上，向天花板伸出手，用力地张开五指又收回，像要抓住什么东西。忽然，我感到胃部很不舒服，食物顺着食管反流上来，从我的喉咙里蔓延出一股恶心的味道。我站起来，去厕所吐了个干净。然后我漱了口，重新爬上了床。康复中心很快就给我安排了新的护理对象，无论我如何为智雄的完结难过，我都必须继续工作。这对我来说并不难，我知道说什么样的话能够让捐献者安心，这是一门技术，而非情感的表达。新的捐献者是个女孩，她也来自黑尔舍姆，她说她是黑尔舍姆的最后一批学生之一。我问她为什么要和我说这些，她露出了一个十分温和的微笑说，她一看到我就知道，我和她是一样的，黑尔舍姆的学生们能够认出对方。我想，她说的是对的，我们一谈起黑尔舍姆，那种埋在我们身体深处的联结就开始发挥作用。她和我说了一些事，她提到了那个传闻，但她更多地是想告诉我，黑尔舍姆已经不在了，她为此感到悲伤。我听着她的话，感到有一种奇异的、陌生的情绪在我心中慢慢浮现。这不是我第一次听说黑尔舍姆已经不在了，事实上，两年前，我就已经知道了这件事，是一个同期护理员告诉我的，而他现在已经成为了捐献者，即将进行第三次捐献了。那时，我并没有把它当一回事，仿佛黑尔舍姆的消失是一件再正常不过的事情，现在想来，也许是我刻意地逃避了它，将它截断在我的思绪之外，用这种方式来免受影响。
真奇怪啊。女孩细瘦的手腕上缠着输液管，她的手背十分白净，血管的颜色从皮肤之下透出来，和智雄的手背完全不一样。营养液顺着导管一滴一滴流进她的身体里，她抚摸着柔软的被子，睁大眼睛，她的睫毛很长、很浓密，瞳孔很圆，哪里都和智雄不一样。可她却让我想起智雄。
钟燮，你能想象吗？那里现在什么都没有了。她说，真是太奇怪了。
那里什么都没有了。我重复着她的话，笑了。是啊，太奇怪了。我从前没有过这种感觉，但真的，如果仔细一想的话，真的觉得太奇怪了。那里怎么会消失了呢？虽然建筑什么的还在，草坪、树林也都还在，可是在我的脑海中，就像完全消失了一样，完全是空的，什么都没有。
我很理解你，钟燮。女孩说，就好像我们都是幻影一样。
啊，是啊，再过几年，等到我们全都完结了之后，黑尔舍姆就变成了幻想的国度，没有一个亲历者能说出那里究竟是什么样子的了。再过一阵子，在更远的未来，人们就会把我们全部忘记，连这个国度存在与否也无从考证。我们曾经为之奉献的一切都化作泡影，随风飞逝了。
女孩垂下头，攥紧了一片床单，她似乎是下定了什么决心一般开口了，其实，钟燮，我想问你一个问题。她目光如炬地盯着我。那个传言，是真的吗？真心相爱的人能够延缓捐献，我听说曾经有人做到了，是真的吗？你知道是谁吗？
那一瞬，女孩的表情仿佛和我重叠，我想起我问智雄为什么不和太洋一起提交申请的时候，那时的我也像她一样恳切吗？
……抱歉。我移开了目光，强忍着流泪的冲动。我想我无法回答你。
夫人的地址并不难找。她是个有名的人，她已经退休了，住在首尔近郊的一栋房子里。我背着简易的行李上了开往首尔的列车，在靠窗的位置坐下。我注视着窗外，从江原道到首尔，我曾经和智雄共同看过这一路的风景，如今我一个人来看，似乎也没有什么不一样。发灰的路面两侧伫立着高矮不一的楼房，零星地缀在田地之间。开阔的草地很多，而高大的树木很少，偶尔见到一两颗，也是光秃秃的形貌，枯黄的叶子孤单地挂在枝头。一个多小时的车程，我有一半在睡觉，剩下一半思考此行的目的。我早就已经过了什么问题都要一个答案的年纪了，可我还是做了这个决定，踏上了旅程。坦白说，我是很有可能失败的，夫人不愿意见我、不愿意回答我的问题，或者她自己也不知道答案，那意味着我将空手而归，什么都得不到。我已经做好了最坏的准备，但仍然有一个念头始终跟随着我，反复出现，扰乱我的心神。它最开始像一个若有若无的背景音，需要我仔细听才能察觉，不会对我的思绪产生很大影响。然而，它却在这些日子里变得无法忽视，我不停地思考，就不停地听到它的声音；我拼命地将它丢开，用其他东西覆盖住它，可是没有用，它突破重重的阻碍，在我的脑中不断长大。我知道我不能被它抓住，它会毁掉我，但走进站台的那一瞬，它突然变得空前强大，难以抑制地涌入了我的身体：我下定这个决心用了太长时间，这一切都太晚了；曾经有机会让我不用独自完成这件事，但我们都错过了，而我现在却把它拾起来，重新审视、思考它，这让整件事情变得荒唐起来。准确地说，我后悔了。也许我不该申请做智雄的护理员的，或者，我不该答应智雄去首尔看望寅拓。是我把事情变成了现在这个样子，每一个细节中都有我的默许，我内心深处完全明白：如果没有我的帮忙，他们要获得彼此之间的消息会比现在难的多。而相应的，在失去时，因为信息的贫瘠，他们所感受到的痛苦也会变少。但在某种程度上，我也不清楚，我的后悔是不是对的，这种情绪出现时，它只是把你整个人包裹起来，不会参与道德判断。我知道许多人因为后悔而自杀了，所以我依旧觉得它是危险的。我站在站台上，思索着我延迟了这么久的行为到底还有没有意义。列车在我面前呼啸而过，我之前从不觉得它的形状很怪异，可那一刻我忽然觉得它像一条丑陋的、长长的虫子。我惊讶于人们制造出这样的东西时，居然不觉得害怕。
车头发出一阵轰鸣，然后停下了。在那短暂的十几秒钟里，我没有意识到我越过了那条代表警示的黄线，我离它太近了，因此觉得自己也在随着它而震动。我愣在那，然后想起了智雄。智雄和太洋从交换会上跑出去，站在树林的入口处时，应该也和我拥有着一样的心情吧。智雄想要的那个自由，也不过就是震耳欲聋到令人有点悚然的一瞬间。
夫人的住所比我想象的更小，我以为她会住在一个金碧辉煌的地方，与她的艺廊相映衬。但那栋房子的外观灰扑扑的，看起来很久没有翻新过。走近了，我可以看到被灰尘掩盖了大半的墙体彩绘，那些颜料大多都褪了颜色，显出斑驳的败相。尽管如此，我能感觉到，这里刚刚建造完毕时，一定是美艳的盛景。从窗户上隐约透出的影子里，我看见了长长帷幕的一角，那让我有了信心。我摁响了门铃。
过了一会儿，我听见了很轻的脚步声，然后那扇门在我的眼前打开了。时隔多年，我再一次见到了夫人。我能这么快就认出她的原因之一是她的脸几乎没有变化，与我记忆中的一样，甚至连穿的衣服也十分相似。她的嘴唇抿成一道直线，她每每出现在黑尔舍姆时，就会摆出这样一副表情，让我们不敢接近她（除了智雄他们尝试的那一次）。她对上了我的视线，我注意到她的瞳孔在刹那间放大，接着又缩小，像一次呼吸。她当下就认出了我是从黑尔舍姆来的，随后她的表情变得和缓了，甚至露出一丝笑意，那笑意不达眼底，让她的脸变得更加森然。我不能明白那个表情，这介于厌恶与恐惧之间，让我搞不清楚，但它产生了一种催促作用，迫使我更快地说出我想说的话。我深深地吸了一口气，自我介绍道，我是金钟……钟燮。我记得你。然而，夫人打断了我，她的语气过于冷酷，又过于理所当然。你很擅长音乐创作，我记得你有不少作品被选中了。夫人紧紧盯着我，她的眼神中翻涌着一种我看不懂的东西，那么，你想和我谈些什么？
那一刻，我大脑中的某根神经下了判断，无论如何，我必须立刻开始说话。这不是为了我一个人而说的，我们都在等待着这个答案。最开始，我说得颠三倒四，打好的腹稿没有起到任何作用，但说到后面，我感到我的话语变得清晰了起来，我讲述了我们是如何理解艺廊的作用的；讲述了那个传言是怎样在我们之间流传、被我们相信，并一级一级地传递下去。我准备的那些抒情的描述全都在霎那间消失不见，留在我的脑海中的只有一些极其贴近现实的句子，没有任何的修辞，直白地被我表达出来。我确信夫人能明白我在说的是什么，她的脸上浮现出淡淡的微笑，很长一段时间里，她都只是听我说话而没有回答。
所以，夫人，我们想知道，那些有关艺廊的猜想是不是真的，我们被收入艺廊的作品，是为了鉴别我们的真心而存在的吗？
你们的真心？夫人忽然开口，她的声音很怪异，像一个抒情乐谱中突然出现的不和谐音。你是说，你们觉得你们真心相爱，而我判断你们是不是在说谎的根据，就是考察你们在艺廊中的作品，然后就知道你们是不是真心的。是这样吗？钟燮，你是这样认为的？
如果我们的作品不能揭示我们的真心，那我不知道还有什么其他的东西可以了。
作品能揭示你们的真心？为什么？她笑了起来，几乎是冷嘲热讽的语气，但我盯着她的眼睛，却发现其中有微小的、像碎钻一样闪烁的东西。因为黑尔舍姆告诉你们，你们要用心去创作，作品会暴露你们内在的自我，会描绘出你们的灵魂？
我的脑中产生了一个难以置信的想法，她是在哭吗？
夫人的声音忽然低了下来，她不再看我的脸，而是盯着地面。你们觉得，如果有作品被我选中了，代表你们的灵魂可以被查询。然后你们又觉得你们真心相爱，你们的爱能从这些作品中展现出来，被我发现。爱是这么简单的东西吗？你们凭什么这么认为？
这是艺廊的作用，不是吗？我们每个人都希望能有作品被选入你的艺廊，这意味着得到了延迟捐献的入场券，难道不是这样吗？还是说艺廊根本就没有存在过？
艺廊？的确有一个艺廊，实际上，你现在正站在艺廊里。我把你们的作品就收藏在这里。当然，不是所有的，我精减掉一些，留下最好的，把它们装饰起来，供人观赏。夫人轻轻地跺了跺脚，但是，你想问的是我为什么要你们努力地创作，并挑选出一部分带走，对不对？不仅如此，你还想知道，如果没有被选入艺廊，黑尔舍姆的存在有什么意义？如果你们只是为了捐献而诞生，又为了捐献而死去，那教你们文学、艺术、音乐完全是多此一举，我们为什么要这么做？钟燮，你想知道这个，我说的对吗？
我点了点头。夫人的肩膀一下子松懈下去，她快速地抹了一下眼睛，然后侧身，给我让出一条通往房子更深处的路。
进来吧，我想给你看一份报道。
夫人领着我进入房间，各个角落里堆放着许多蒙着黑布的不规则物体，她告诉我那是被打包起来的我们的作品。不久后将有搬家工人来把它们搬到别的地方，而搬不走的只能扔掉，说实话，现在还留着这些已经没有意义，在茂宁代尔丑闻爆发之后，像黑尔舍姆这样的学校再也无法存在下去，克隆人的情况变得更加糟糕。夫人把一份泛黄的报纸递给我，说道，凯丝不在，本来应该由她跟你解释这些事。我想你们和她更加亲近，也许她说的话更容易让你们相信。
茂宁代尔三年前被报道出来，尽管那时你们都已经离开黑尔舍姆，但至今也没有人知道这个消息，这证明我们的工作颇有成效，其实我很高兴。你想知道艺廊是为了什么而存在的，我现在可以告诉你。你说作品中有你们灵魂的形状，你说的没错，我和凯丝，在黑尔舍姆工作过的所有人都是这么想的。所以我们把你们的作品收集起来，向世界揭示你们的灵魂，或者说，向世界证明你们有灵魂。
我感到身体内部有一个角落毫无征兆地塌陷了，我问，为什么我们有灵魂这件事，是需要被证明的？难道我们没有吗？
夫人淡淡地笑了，她温柔地喊着我的名字。钟燮，我想你们是有的。但很多人不能理解你们，你们在农场、康复中心遇到的那些不在黑尔舍姆长大的人就不能，他们这样的人，比你们多得多。那是一个你们根本无法想象的环境，充满残暴的竞争、控制和惩罚。他们和你们不一样，你觉得他们有灵魂吗？如果你感到犹豫，那么你就能理解，这个世上的其他人也和你一样，对这件事的真实性保持怀疑。尽管黑尔舍姆曾经改变了很多，我们为了这份工作相当努力，但时至今日，仍有很多人不能完全理解这一点，理解你们是有人权的。
能进入黑尔舍姆是幸运的。我想起了智雄的话。
黑尔舍姆没有关门的时候，你们的情况还好上一些，至少一部分人能进入黑尔舍姆，接受这种教育。钟燮，像你这样的孩子，黑尔舍姆培养出了这么多。我们尽力了。我们只能确保你们在黑尔舍姆的日子是安全的，不受外界攻击。我们的运动有所起色，这是真的，我们将你们的作品展示出来，质问那些恐惧着你们的人。看看这些，我们总是在演讲时说，你们怎么能说这些孩子没有心、没有灵魂呢？很多人为你们的作品而感动，我们得到了认可，也获得了资金支持。我们曾经很有力量。但钟燮，我们没有一秒钟感到得意，感到我们成功了。我和凯丝一刻也不敢离开这个残忍的真实世界，那些充满恶意的目光依旧太多了。我们做得不够，完全不够，我们深深地知道，因此我们总是十分焦灼、恐惧，害怕眼前的一切瞬间化为乌有。而茂宁代尔出现之后，这一天到来了。我们和其他几所学校一起，又坚持了一年，我们几乎为此倾尽了所有。

这件事发生之初，我只是感到紧张，但现在想来，是我们缺少前瞻意识，轻视来了它会带来的后果。我们把这个运动的一切都压在了一种社会氛围之上，当这种氛围改变时，我们没有做好任何应对的准备。人们不可能就此禁止克隆工程，钟燮，我不想这么说，但当他们发现有办法可以治愈癌症，只用换一个器官就能多活十年，换一个心脏就能捡回一条命，医学已经向大家证明这是能够做到的。只要拥有足够的材料，我们就能和亲人朋友度过更多美好的时光。没有人愿意让技术倒退，回到那个绝望的黑暗时代中去。本来在大众的认知中，你们只是一群泡在实验液体中的不明生物，大部分人对你们究竟以什么样的形态存在并不感兴趣，是茂宁代尔让你们受到关注。无论是出于伦理还是道德，人们都无法接受你们那么像他们自己。所以不允许你们学习，把你们放逐出去，当作动物一样圈养，他们想让你们回到阴影中去。

她低下头，避开我的视线。我好像是哭了，因为我眼前的场景开始变得模糊，但那时我并不能感觉到我的眼泪。夫人的话仍然一句接一句地钻进我的耳朵，如同一种全然陌生的语言。

夫人说完这些，从椅子上起身，给自己倒了一杯茶。她不打算再告诉我更多了。我坐在原地，很久都没有说话，那段时间里，我分不清我感受到的究竟是什么，或许有一些愤怒，但更多的是一种无法描述的复杂情绪。我意识到，在夫人说出第一句话时，我就产生了一个预感，当这个预感灵验的时候，我只花了一秒钟就接受了它。我没有感到过多的震惊，或者是难以置信。我只是静静地听着这些掩藏在我们的身份之下的真相，原本的那一点悲伤就全部流走了。原来我们就是为了这些而痛苦、为了这些而变成了现在这个样子。我忽然想不通，为了这些是什么意思，为了这些又是为了什么。我们之间发生过的那些事，并不如我们想象中的那样宏伟、庞大，那只是漆黑的森林里偶然出现的一点萤光，我们只依靠着那点微弱的东西，就照亮了记忆的前路。

      { title: "第 3 章", text: `事实上，智雄待在精神科病房的时间非常短。他的出院和入院一样突然，没有明确的理由，甚至与他本人的状况并无太大关系。从治疗角度看，起昊不建议智雄过早出院，但智雄十分坚持。作为医生，起昊尊重患者的意愿，也没有强留的权力。最后一次谈话时，智雄变得和来时一样沉默，只使用很短的句子，不向起昊解释任何东西。病情的反复在精神治疗中是很常见的，起昊充分地理解这一点，但仍然向他表达了适当的关心。
最重要的是，不要太依赖药物。起昊把单子打出来，推到智雄面前。试试用尽量少的药。他圈起纸上的数字。笔出墨不顺，画圆的手顿了顿。实在难受的话，这个剂量是极限。如果到了这程度也没有用的话，立刻来医院。
知道了。智雄低着头，盯着桌角，没有看那张处方一眼。我会自己看着办的。
啊，说实话。起昊的脸上又露出了那种能够避过什么东西似的温和的表情。智雄，我还是有点担心你。
这是你的工作吧。智雄抬起眼皮，头依然垂着，仰视的角度，让他的眼角形状变得很尖。
严格来说，智雄马上就不算我的患者了呢。起昊摊开手，还是那样笑，却无端让人觉得冷。要是说我见过一百个病人，那智雄绝对是其中很特别的一个。所以这可以说是，在工作之外，我本人对智雄的关心。他的嘴角深深地弯起。百分之一的特权哦。
我不是你的患者了？
等你拿着这张单子，站起来，走出去。起昊手里圆珠笔叩桌面，笃笃两声。就不是了。
啊当然了，在我的原则上，被完全治好之前都是一样的，没有那么清晰的划分。起昊把笔放回桌上，确保它不会自己滚动后，语速忽然变得很快，一串珠子一样，骨碌碌地在一片压顶的阴翳里摇动。毕竟我是医生啊，我总是想要帮你们的，智雄，你明白吗？刚刚那些话是开玩笑的，听起来有点冷漠吧？别伤心哦。
这样啊，尹医生你治好过多少人呢？智雄终于整个抬起头来，跟起昊对视着。屋外下雨了，湿气飘进来，他的鼻尖和脸颊都开始发黏。
起昊闻言，真的思考了一下，结果还是抱歉地耸肩，这怎么记得住呢，很多很多吧。
那怎么知道我就是百分之一？智雄轻轻笑了，这不是骗子吗？说完，不等起昊回答，一把抓起桌上的单子，推开门走了，一秒也不曾向后看。那时，智雄的脸被灰色的天泼了一道阴影，从额角斜劈而下，束在唇角。那个神情里透出一股腥，在雨天路过鱼市的感觉，编织袋和胶皮靴的味道，还未到达就已有了被沾染的预感。如何躲，前方只有一条可走的路。厚重的云压过，雨又砸下来。安全地带的氧气耗空了，没办法，还是得生存、得活下去。任何事情都是这样，感到恐慌、无法解决的时候，就握住非人类的手，放任自己也变成奇怪的东西。
起昊追出去，却发现智雄正站在门口，并没走远，朝着他的方向，等着他似的。被甩开的门在身后缓缓合上，木头与木头摩擦的声音沥进耳朵里。那瞬间，眼前的走廊像电影里会出现幽灵的地方一样，变得空旷而辽远。他靠在玻璃上，四周晕出一团人形的水汽，玻璃之外，雨幕如蝉翼般薄。
智雄扬了扬手里的纸，微笑起来。
我现在不是你的患者了。尹医生，给我你的私人联系方式吧。` },
      { title: "第 4 章", text: `和那位医生，一开始就不是从朋友做起的。说是医患，也并不准确。恋人和朋友间尚有灰色地带，用各式巧言包装，分发到文艺作品。他们的关系是没有的。他们之间是否存在一段确实的关系，也还未有定论。要到了起昊的联系方式之后，智雄反而冷静下来，有时闲聊，发些无关痛痒的消息，起昊总是回得很快。今天做了辣炖猪肉吃，配一张随意的图。起昊发过来一个卡通表情，美漫画风，Q版人物竖大拇指，厨房天才吧我们智雄。我们智雄。盯着那几个字，很老土、很蠢，但感到被慰藉，奇异的温暖。起昊的通讯录里还有很多人，我们智妍、我们俊熙、我们荷娜，这些名字把他的心压在秤上，沉沉地下坠。现在多了一个，不知道增加了多少重量，也许很少，但应该不是没有。只要不是没有就好。出院前，智雄给太洋发信息，聊天界面停留在三周前。智雄发的，我住院了。太洋已读不回，是常态，读了就代表他看到了，不回则代表他的朋友对此无话可说。智雄又发，我不治了。气泡前端一下子打了勾，昵称变成输入中，太洋的回复跳出来。不治是说你终于准备去死了？智雄回，他不和患者谈恋爱。太洋发来三个点，我看你脑子真的坏了。智雄想，太洋说的是对的。
智雄没有约起昊出来见面。一想到这件事，他就有点退缩。什么时候有空，或者不问他有没有空，直接约定时间和地点，要求他那时出现在那里，诸如此类，打出来又删除。与一个士兵在即将上战场前相似的感情，想象自己躲在掩体后，端着枪扫射敌人，那边的子弹擦过脸颊，留下血痕一道，痛得浑身发热，喉咙里的血烧起来，往下咽，如咽一团火。不是因为害怕，而是感到沸腾。智雄意识到他在期待着，某种蛰伏在他们之间的东西啪的一声炸成血雾的那瞬间。
智雄的病仍是那样，不见好，也没有持续恶化的迹象。大部分时间他遵守医嘱，用尽量少的药，忍耐不了的时候，就给起昊发消息。起昊总是一眼就能看出他在做什么，即使他根本没提。有时起昊会说，现在很难受吗，有时则让他加油。说的最多的是别害怕，我会在。美工刀一下一下地划在手上，旧的伤疤还未痊愈，新的又叠加上去。完全的假话，说得那么真。血滴在浴缸里，被水丝丝缕缕地揉散。小时候练书法，墨迹游动在水中，也是这样的情状。
周日有空吗？要不要出来？
吃过药，关了灯上床，下一秒，消息提醒弹出来，信号灯似的闪烁。那个点像一只虫子，大概瓢虫之类，圆而鲜红，从手机屏幕里爬出，爬进眼球，让他觉得痒。
对面又发来，担心你。
担心我吗？智雄摩挲着那几个字，韩文被一片模糊的指纹弄得扭曲、软掉。他回复，好啊。` },
      { title: "第 5 章", text: `周日，约在一个公园的喷泉池前见面，起昊穿便装，修身的上衣，牛仔裤，头发剪短了，露出眉毛。他不套上医生制服的时候，很难猜到他的职业。事实上，你会觉得他应该出现在一个更加轻松的场合，画廊、练歌房、买手店，那种没有人要为花出去的钱和说出口的话负责的地方。医院的氛围太沉闷了，和他不相配。和智雄首次约会（使用这个词是合理的，毕竟他们后来结婚了），起昊带了礼物，钢笔，丝绒套盒包装，花体英文标签。一只手揣在口袋里，另一只手把它递给智雄。
很久没见了，小礼物。
又来了。通过各种办法避过什么的感觉，削减礼品的贵重，当作五元店里随便买的东西，对关心的事假装不关心，对不关心的事表演关心。智雄接过盒子，感到反胃，下意识捂住了嘴。起昊问，怎么了，不舒服吗？智雄摆摆手，抬头看他，起昊微笑着，太阳就在他的头顶上方。他的脸化在一片白芒里，眼睛、嘴唇、骨头的位置，像雕刻出来的那样标准，也像雕刻出来的那样假。
好可怕。智雄的手腕被起昊握住。
我们走吧，和智雄在一起的每一秒钟都不想浪费。最近过得怎么样呢？
不知道，不能说很好，但比起之前，也没有那么坏，那一瞬间，智雄不知道怎么说，只好闭嘴，低着头，视线凝在他手指与手指交汇的地方。就拿精神病当借口好了，就表现得像个失去基本生活能力的人一样好了，起昊是医生，没关系的。智雄的手在起昊手里，默默地发起抖来。干嘛每次一到他面前就这么惨，智雄绝望地看不懂自己了。还是因为起昊是医生，所以感到自己拼命装出来的那种舒适会被他一眼看穿，然后变得恶心。不想变得恶心。智雄忍住了某种冲动，说不清道不明的一种冲动，他努力把思考转移到更下沉的东西上去，伤口啊性爱啊那些的，需要投入更少精力就能够了解的事。
于是他想，他手指好长，把我圈起来了，我又不是动物。啊，等等，即使是心理医生，也要做临床吧，用过小白鼠吗，说什么，难道我对他来说是老鼠吗？他对实验里的动物做过的事，也可以对我做吗？
只存在在智雄脑海里的那个声音，起昊听见了。他看起来很满意，露出一个笑容，说，可惜，我没做过智雄想象中的那种实验呢，你还没搞清楚状况啊。
手腕上的力气收紧了，起昊叹气，把智雄的脸捧起来，轻轻地晃了一下。我都听到了，你的病不是还没好吗？
智雄愣愣的，思维真的停转了一样，是这样吗，我的病没有好。面对起昊，语言系统坏掉了，脑中闪过一片空白，没有成段的句子浮现。这是什么意思，到底要怎样才能好？画面像电视节目那样播放，眼球突突直跳，换台，昏黑的房间，干净没有一丝灰尘的地板，血像蛇一样蜿蜒过，稍微感到痛的瞬间。那个时候为什么笑了，看着起昊的眼睛，原因也不记得了，被另一个人圈起来是这样的感觉，怎么会描述不出来呢，手上明明压了两个人的重量，却比羽毛还要轻，几乎像没有一样。如果世界上有天使的话，就降临一次给他看看吧，总要有什么东西真的显灵，才可以解释信仰的存在。一个单位的呼吸，如同神的双手，覆盖了智雄所有的感官，为他的心开刃。他仰起脸，追上去，咬住起昊的嘴唇。话不断地下坠，没进齿与齿的缝隙，自然的光辉咽进嘴里也变成苦的。智雄笑起来，指甲滑过他的小臂，好残忍真的好残忍，尹起昊你不是医生吗，却要逼他说出这些话，我知道你能帮我的，我不想生病了。` },
      { title: "第 6 章", text: `公园的外围是一条河，河水流入汉江，似乎首尔每一条河最后总会流入汉江。起昊说，谁知道呢，一说起首尔就只能想到汉江而已，没人会沿着水脉去考证的。智雄说，也许我会的，如果我真的很想知道的话。起昊捏了捏智雄的手，好认真啊，你知道有个东西叫人工智能吗？问问那个老师吧，智雄xi。智雄不回答了，起昊也没放开他的手，就那样牵着，走到河边。河对岸有一座教堂，规模很小，十字架立于尖顶上，四周草木葱茏。起昊看着它，眼珠钉在那，眼神却飘走。他想到他小时候。
我以前信教的，你知道吗？基/督/教。我和家人一起，每周去教堂唱歌。把弟弟的自行车弄坏了，就去忏悔室忏悔，请求上帝宽恕。我家一整个书柜都是宗教书籍，睡前故事都是从那里面找的。
智雄看了他一眼，那你现在不信了？因为你是同/性/恋？
嗯，不信了。起昊收回了眼神，倒不是因为这个。
那是为什么？
啊，说实话，这个问题好难啊。
他笑了，垂下头，对着脚尖。
怎么说呢，总之，我就是不相信了。不觉得人的奖惩要由上帝来决定了。很多人是既有罪又无罪的，他人的罪落在身上，就被拉进了一个循环，如此叠加往复。你做研究的时候也会这样吧，觉得这些东西其实无法量化。对我来说，上帝不是一把尺子，它只有神力没有刻度，我要那些神力做什么，我又不想当神。神不能和曾经的患者一起散步的，也不能亲他，这是严重偏心，有道德瑕疵。不过呢，他眯起眼睛，唱祝歌是蛮好玩的，这种，宗教式的建筑也是，不觉得很漂亮吗？
漂亮的话，智雄回避了他前面说的，只回应最后一句，是挺漂亮的。
进去看看吧，起昊说，没给他拒绝的余地，你会喜欢的。
门是拱形，木质，没有繁复的花纹，彩色玻璃盛着光，室内很静，一个人都没有，祝祷台边围一圈花，十分洁净，如雪般白。起昊指着大厅的尽头，巨大的十字悬挂起来的地方。
那里，以前的人们都是站在那里结婚的，西装捧花，读完誓言之后，底下的客人就会哭。我给一两次婚礼唱过歌，挺感动的，在教堂结婚氛围很好，到处都是白的，大家就会感觉结婚也像信仰一样神圣。
哈，智雄忽然哧地笑出来，太好骗了吧。
这么说也是呢。起昊转了一下手腕，把他的手掌垫在智雄的下面，那个动作做得极缓慢，其中万分柔情。他这样盯着谁的时候，让人觉得很容易相信。他眼睛长得又细又长，笑起来眼尾往上掠，信任就聚在那道细细的线里，光芒万丈地笼罩下来。
不过智雄不想试试吗？
他还真的把自己当成新郎了，好恶心。智雄说，你要和我结婚吗？
啊，我可没有说。结婚是诅咒啊。
起昊又笑，笑得很熟悉，从里面爬出一段卷曲的礼节。但是要是智雄想的话，我是可以的。说完在他的手背亲了一下。
骗子。智雄触电似的抽开手。他想到从起昊背后的窗户里爬进室内的那束光，原来这道光的下面是这样的誓言，这么美妙不可言说的东西。也许这也可以当作一种筹码吧，有了它尹起昊就能在精神科无往不利了。
智雄冷冷地说，听不懂你在说什么，有空也去看看病吧。闻言，起昊又去拉他的手，露出伤心的神情，仿佛真的被什么人抛弃了一样。
唉，别这样讲，医者难自医，我只是喜欢你啊智雄。` },
      { title: "第 7 章", text: `其实智雄对起昊的判断错了，但这也不能怪谁，你不能让一个永远只在玩魔方的人一下子理解每天去夜店蹦迪喝酒的人的生活是什么样的，前者依托方法、技巧和逻辑，后者只要开心而已，而这种开心和起昊的爱一样，本来就是没有逻辑的。
