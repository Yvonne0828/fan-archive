太显继续说，然竣哥和我是邻座，我和他搭话时，他转过脸看我，我当时感觉他有点凶，还以为他会骂我，类似于不要多管闲事之类的。但是然竣哥不是那样的人，他就只是很抱歉地笑了一下，然后把东西都收了起来。
过了一会儿，广播里说开始发餐，然竣哥本来睡着，听到那个就醒了。他问我喜欢吃什么，又说如果有拉面就好了。我们那时聊了天，我还给了他我的第一张名片。
突然间，太显的脸痉挛似的皱了一下，在和杋圭讲述这些事之前，他不知道他记得这样清楚，他以为他已经忘记了，或者至少，那段记忆变得模糊，他只记得一两个重要的节点，那是为了证明然竣曾经在这个世界上存在过所以必须记得的东西。然竣离开后，杋圭也不常在他身边，他是个胆小鬼，总是害怕，不敢让自己停留在过去太久，也从来不想这些。
可是他仍旧感到一阵细密的酸苦，从回忆深处漫出来，如同雨季里奔涌而来的大潮。
太显，不要哭。杋圭轻轻地叹息。
这个照片是你吗？然竣看看太显的脸，又看看手里的名片，视线在两张脸上来回跳动。看起来有点像初中生诶。
是我。太显的语气硬邦邦的。我一个月前才拍的。他补充道，我高中毕业了。
啊，了解。刚毕业的话，你得喊我哥。然竣随手把名片揣进裤子口袋。这么小去越南做生意啊，真好。
然竣哥。太显咀嚼了一遍然竣的名字。那哥呢？
我还不知道。然竣说，可能是去那边找工作吧，我有需要用钱的地方，但是没法在首尔做。
太显问，为什么？
要告诉你吗？然竣的笑容有点狡猾，从眼头到眼尾的弧度飘起来，抛过去一个调笑的眼神。他清了清嗓子，把碎发捋到耳后，露出耳垂上的银色圆环。
其实我生病了，大概治不好，所以我不想治了。如果待在首尔的话就得继续治，我已经非常努力了，你知道吗，但下一步他们要剃我的头发，我不能接受，就跑了。然竣耸耸肩。何况根本没用，你别被我吓到，我需要用钱给自己置办后事。
我胆子很小。太显诚实地回答，我有点吓到了，没想到是这样。
对不起。然竣的表情僵住了一下，但很快恢复正常，他懊恼地抓了抓后脑勺的头发，不自觉地抽动嘴角。我是不是说的太多了？
太显摇头，说，我给哥的名片上有旅馆的地址，我一直会在那里，如果哥有需要，可以来找我，我会帮哥的。
然竣怔住，随即脸上的肌肉放松地舒展，揉出一个笑。他说噢，好呀。谢谢太显，我会来找你的。
我真的还不知道会去那里干什么呢，然竣说，也许我不喜欢越南，待一会儿就走了，然后去别的国家，日本之类的，我都还不知道。他微微笑着，用食指玩自己脸侧垂落的头发。不过我决定开始写日记。然竣似乎突然想起什么，把先前他不断涂涂画画的本子拿出来给太显看。我在想标题，你觉得哪个比较好？
太显凑过去，扉页上的韩文字挤在一起，然竣写了好几个，有些已经被他划掉，全是影视剧名再加上然竣的本名。太显看电视很少，不知道其中是不是有特别用意。
都挺好的？太显努力地调动这方面知识，思索了一下。我的话喜欢99年生的然竣哥。
99年生的然竣哥吗？然竣听完大笑起来，这听起来不会太像大叔吗，哇，然竣哥这个叫法真的，变成崔然竣就会好很多啊。
可惜，然竣说，这个一开始就被pass了。
太显认真地说，是吗？我觉得这个很好。
然竣没有回答，他转过头，把遮光帘拉起来，有一瞬间目不能视，椭圆形窗户里洒进一片刺目的雪白，把然竣的脸照的发亮。太显注视着他的侧脸，非常瘦，脸颊像一枚瘪掉的气球，一层薄薄的肉裹住尖锐的骨头，仿佛那不是骨，而是磨损的长刀。
然竣完全不似正常人那样瘦。
这个认知像一簇烟花，啪的一声在太显的脑海中绽放。多么盛大的死亡教育，超越学校里教授给他的所有知识。太阳的华辉瀑在然竣面上，就在那一刻，他意识到，原来人真的会死的。连皮带骨化成灰，什么东西都无法留下。他颤抖起来，尚才高中毕业的太显，在奔向新生活的途中，第一次了解毗邻死亡的恐怖。他想，死去对于然竣这样的人来说，也是一片看不到尽头的白茫茫吗？
太显，如果我留在越南的话，可以把日记本交给你吗？
不知道什么时候，然竣重新放下了遮光帘，机舱内一片昏暗，乘客大多都睡着，耳边只有发动机的声音嗡嗡作响。
太显的喉咙紧缩着，问，为什么？
我很相信你。然竣笑了，耳坠随着他的动作晃动，发出微弱的闪光。
有点难以解释，虽然我们才认识几个小时，但是太显很可爱，可能我们很有缘分。我觉得你很好，不会弄坏我的东西，也不会让别人知道。
然竣拍拍他的肩膀，又说了一次。
太显，我很相信你。
由于飞机下降，太显感到一阵眩晕，失重感让他听不清然竣的话，仿佛耳膜被泡在一股水里，四面都是碰壁的闷响。鲜艳的指示灯亮起，落地那一瞬他抓住然竣的手，用力地握了握。他说他知道了。
然竣和太显在岘港机场分道扬镳，前者没有行李要取，一身轻松，眨眼便消失。在那之后，然竣很久都没有联系太显，直到某个暴雨天，他背着一个棕色的大包，发丝一缕缕贴在额前。彼时太显刚为旅馆换上新的自动门，崭新的钢铁气味还未散去。然竣踏着悠扬的机械音走来，看见太显坐在前厅的沙发里打盹儿，他笑的与他们第一次见面时如出一辙。
然竣撩开被水浸湿的碎发，露出苍白的额头。
还有空房吗？
太显盯着他的眼睛，静静地说，有的。又喊了一声他的名字，然竣哥。
好久不见。然竣笑着说，这次我有点着急，下次再来的话，会给你带礼物来的。
太显说，不用礼物了。他把房门钥匙放在然竣掌心。哥如果想感谢我，就多来住吧。
然竣揉了揉眼睛，沉默了一会儿，又慢慢抬起头，对上太显的视线。
我来的话，你就一直接待我？
太显说，嗯，我之前不是说过会帮哥。
然竣笑了，他伸出手指。好啊，那和我拉钩。
他们的小指勾在一起，在空中摇摇晃晃，潮湿的呼吸从缝隙中流过。太显忽然问，外面雨很大吗？然竣瞥了他一眼，点头，一时又无话。过了很久，不知道是谁先开口，极低的声音，一抹细细的沉吟，从遥远的雨幕深处传来，碾过受潮发软的神经。
那个声音慢慢地说，拉钩上吊，一百年不许变。
后来，太显很多次想起那个场景，他告诉杋圭，然竣哥和他有一个谁都不知道的秘密约定，每一次他这样说，杋圭都会问他那个约定到底是什么，他说一次，杋圭就问一次。他从没有在杋圭的软磨硬泡下落败过，也许杋圭也并不是真的想知道，他们用这样的方式回到过去，回到还能见到然竣的时候。仿佛只要那个约定还没有被揭晓，总有一天然竣还会回来，得意地说其实他把他们都给骗了，那个秘密根本不存在，或者他弯腰鞠躬，诚恳地向他们道歉，杋圭太显对不起，我来赴约了——无论怎样都好。太显偶尔望着那扇自动门出神，想到然竣湿漉漉的手指和他的勾在一起，他有时会哭，有时不会。那都已经是很久之后的事。` },
      { title: "谋杀石莲", text: `昨晚下过一场夜雨，树影沉沉，路边偶有蛙鸣。脚印外缘鼓起一圈水泡，像泥土里藏着一尾鱼，粘着杋圭的脚步涨歇。他走得很快，手腕上的儿童手表滴滴作响，电量即将告罄。看到屏幕右上方的红色感叹号，杋圭的表情停滞了一瞬，随即更快地往前走。
他不敢回头看，也不知道方向是否正确。他年纪还非常小，手臂上的肉还未沿着骨头的长势抽开，鲜嫩的细胞挨在一起，柔软而晶莹。一阵风袭过，几颗歪倒的瘦树剧烈摇撼，砸下一片残留的水珠。杋圭打了个寒颤，他忽然产生一种莫名的感觉，有人在背后追他，那是一个暗色的影子，蛰伏在湿润的草丛间，用冷冷的夜风掩盖踪迹。它一定知道他迷路了，所以它什么也不做，只是跟着，等待杋圭精疲力尽，它就扑上来咬断他的脖颈。杋圭不再走了，他静静地站在那里，思考着反击的可能。它的影子在摇动的草木里潜行，圆型头部，瘦长身体，四肢乱舞，看不清具体的形貌。有一瞬，从那个看起来像脖子的部位上方长出了第二个头，杋圭垂着眼，凝视地上扭动的黑影，胸腔中某个器官开始收缩，焦急而猛烈地鼓噪。八岁的杋圭握紧了拳，只有一道棉花般的力气聚在手中。
手表彻底黑屏了。
他遽然转身，气流裹挟澎湃的雨露，霎时飞掠过去。杋圭睁不开眼，他感到一捧湿润的吐息，悠悠地拢落下来，再抬头，两座硕大的黑影，面部五处空洞，手中持一卷纸，簌簌翻飞，另一只手中握着刀，似鬼又如神。杋圭捂住嘴，腿一软，跌在被雨泡烂的土地里，溅起一片水花。黑影弯下腰来，一具双头的怪物，凑近了端详杋圭。他这才看清，那空洞之下原来藏着人类的五官，眉毛细而平，瞳色浅，睫毛十分长。
熟悉的眼睛。
妈妈。
杋圭惊叫出声。
是梦吗？
杋圭从床上坐起来，微微眯着眼，神情还很混沌。他听见雨滴落在木地板上的声音，很轻，像一种自然的乐器。他的太阳穴发疼。杋圭想，每次都这样，做完梦就会有被魇住的错觉，眼睛看不清楚，头一阵一阵地晕。明明他都不记得大邱的家长什么样了。
杋圭推开门，去大厅给自己接水，太显正从对面的楼梯下来，看见他出来，喊了句，杋圭哥。
杋圭朝他短暂地一点头，问，有没有不加薄荷叶的水？
太显说，我记得有，哥等一下。他绕到前台边上的小房间，端出一个水壶。
谢谢。杋圭把水倒进纸杯里，在沙发上坐下，小口小口地抿着。
哥失眠了？太显在他身边坐下，从口袋里掏出一个嫩绿色的东西。我刚收拾完二楼那间房，他们说要去赶六点的飞机，所以很早走了。他说，不过他们好像把东西落下了。
什么？
杋圭的视线始终落在纸杯上，没去看他。
手表，儿童款吧。那间房里住的是一对马来母子。太显把那个绿色的东西举到杋圭眼前。
杋圭沉默，过了一会儿，他说，给我看看。
就是普通儿童手表，不过菜单栏什么的是马来语，我看不懂。
杋圭握着那块小小的表，塑胶的触感，和从前他有的一模一样。他的脑海中浮现出手表的电量不断降低，出现红色预警符号，再彻底关机的那个过程，感到一阵恶心。
他抬起头，把手表还给太显。
五分钟后，自动门特有的机械提示音响起，然竣回来了。
我总是做这个梦。杋圭说，他坐在然竣和太显中间，那块手表被搁在木地板上。
小时候我父母想把我丢掉，他们觉得如果我是个女孩会更好，有人给我算过命，结果大概就是这样，我那时长得也像女孩。但我是个男孩，所以他们不想要我。
后来也没发生什么，在我八岁的时候，他们开车载我去一个很远的超市，然后给我留下了没电的儿童手表，其实我觉得他们可能完全忘记了我有手表这件事，这确实有点奇怪对吧，应该什么都不给我留下才对。
杋圭笑了笑，把马来西亚小孩的手表拿起来，在手中摩挲。
那天天黑的非常早，我已经不记得我是怎么回去的了，我应该走了很长很长的路，很饿又很冷。我大概在关机前看了一眼地图，但我肯定没记住什么，大邱的路都长得差不多，所以可能，我不知道，总之我自己回去了，还挺厉害的。我回去之后，跟爸爸妈妈说，手表没电了，他们的表情也很冷漠，后来我想了一下，他们大概有点怕我。
一个送不走的小孩。杋圭说，我死皮赖脸地缠着他们，怎么样都赶不走，很可怕吧？
然竣和太显对视一眼，俱是沉默。
你们为什么不说话？杋圭两边看看，用力拍了一下然竣的肩膀。不可怕？
然竣假装吃痛地叫了一声，把手表抢过来，拿在自己手中。他按开菜单栏看了看，漫不经心地。一串马来语如同天书。
哎。他叹口气，摸摸杋圭的头，后脑勺的睡乱的头发被摸的翘起来。然竣说，怎么能说自己可怕呢。不是挺好的吗？
杋圭耳朵红了，几十秒钟没说话，他像大脑突然短路了一样坐在那里，沉默许久，然后说，我忘了我要说什么了。
太显的声线十分平稳。那就不要说。
杋圭愣了愣，说，好吧。
太显又说，哥如果想把这个手表留下的话，就拿走吧。
绝对不行。
杋圭还没说话，然竣先站了起来。他眯起眼，望着屋檐外绵延的雨幕，整个身体忽然向后仰，接着狠狠一甩手，动作行云流水，只见一道嫩绿色的弧线撕开大雨，没进远处黑乎乎的灌木丛。他满意地拍了拍手，重新在杋圭身边坐下。
留着这个干什么。然竣笑了，眼睛弯弯的。
这么无语的事情，以后不要再想了。
那年的雨季来势汹汹，岘港终日暴雨，空气粘稠得要结成块掉下来。杋圭不堪其扰，总是一副恹恹的、没精神的样子。他整天都待在床上，偶尔没有雨的时候，就和然竣一起去庙里。
太显的旅馆直通岘港机场，是以常常看见不同肤色的人，但最多的仍是亚洲面孔。曾经有一个住客，来自中国南方，他告诉然竣，许多和他生在同一个地方的人来到了这里，也许是逃跑，也许是为了钱，也许为了追求更幸福的生活。大部分人都发现这里并没有想象中那样贫穷，但的确十分混乱，不过那反而是好事，他们觉得在混乱中才能抓住希望。他带然竣去了附近的妈祖庙，这是他的家乡文化中最重要的神，保顺风顺水保平安。然竣站在暗沉沉的天花板下，面前是五光十色的底座花灯，鲜艳的色块到处乱打。壁画上嵌着许多人，都挤在一艘船上，飘摇着越过巨浪，衣袂翻飞，嘈杂的声响穿过潮湿闷热的空气，直撞进然竣耳朵里。庙里的金身像制式像偶，表面隐隐泛黑，然竣靠得近一些就能闻到线香的味道。
那位住客解释道，这些黑的都是香火熏出来的。又指着妈祖身上挂着的珍珠项链说，挂珍珠是为了求美丽。
好几年过去，那间庙里的灯总是努力地亮着，缤纷的光四处散落。珍珠越叠越多，一串一串，都载着殷切的愿望，筑起一轮雪白的圆月。身边杋圭的侧脸平静如水，鬓角处的头发长长了，被汗浸湿，贴着下颌蜿蜒。他跪下去，拜一拜，行大礼，他想，不知道来自中国的神接不接受韩国的礼数。
走在回去的路上，然竣伸手挥散路灯下萦绕的蚊虫。
晚上想吃什么？
都可以。我不是很饿。杋圭瞥了他一眼，哥不要像上次那样，好不容易做了一锅东西结果全洒了就行。
呀！那次真的是意外。然竣笑着打了他一下，我开了一整天车，手很酸也很正常。
是啊。杋圭低着头，有点心不在焉的样子，那可是我和哥第一次见面。
忽然，没有任何预兆的，他感到脑海里的某根神经跳了一下，和然竣第一次见面，在然竣把那锅东西全洒了之前，那时候发什么了事情来着？初次来到越南，被本地人三言两语骗走了钱，英语不好，连报警电话都打不了，不知道晚上怎么办，暂且没空考虑那个，更严重的是连下一顿饭都没有着落。杋圭在粗粝的柏油路上走着，无措地踢着脚下的石子。刚刚怎么就拿出钱包来了呢，他很想敲自己的脑袋，来之前看的那些攻略和注意事项一个都没想起来，那几个人朝他走过来的时候就很害怕了，周围也没有求助的对象，好像除了听他们的话之外没有别的方法。他就算死在那里也没人会发现，杋圭想到自己的尸体孤单地被太阳烘烤，逐渐干瘪、腐烂、爬满蚂蚁的情形，不由得浑身颤抖。
忘记从哪本生存指南上看到，如果迷路了，站在原地不要动是最安全的做法。杋圭不知道能往哪里走，干脆在路边坐下，那时他期望路过的车能捎他一程，去一个人多一点的地方。可是杋圭没等到顺风车，反而等回了那一群抢走他钱包的越南人。他们也没想到杋圭还待在这里，其中有一位，大声地朝他喊了几句含糊的英文，他没有听懂他在讲什么，只是死死盯着他。他们突然笑了，那个人凑近了杋圭，手掌热乎乎的贴上来，抓住了他的衣领。咚的一声，世界地覆天翻，他有一瞬间失明，来不及做出任何反抗的行径，就被按着领子掼在地上。一睁眼，剧烈的痛感霎时回潮，他感到浑身上下没有一块骨头不在痛，稀薄的血液从伤口溢出，渗进杂草丛生的土地。
要死了。杋圭脑海里回荡着这句话。这次是真的，才从首尔逃走，马上就死在异乡，这样的人应该哪里都去不了吧。他从书上看过，冤死的异国魂魄一定会被困在死去的地方，成为无法转世投胎的孤魂野鬼。他想，好可怜，又想，反正要死了，不是要死了嘛。
杋圭突然想通了，干嘛每次都要做这么可怜的人呢？就算不能拉他们陪葬，也一定要重伤才行。于是趁着他们动作的间隙，很快地翻身，两根手指狠狠戳进男人的眼睛。杋圭很有审时度势的才能，知道挑选最脆弱的地方下手。他在心中感叹，一个人的眼眶里居然有这么深。他忘乎所以地转动手指，感到一些柔软的东西在搅拌下碎裂，发出一种奇怪的、介于噗和咕之间的响声。不知道杋圭这样做了多久，血和黄白相间的浑浊液体沿着手臂流下，成为他身下这片大地的养分。
然后他听见一道急促而刺耳的声音，橡胶轮胎和柏油路剧烈摩擦的回响，然竣就像这样以一个偶像剧般的方式登场了。他嘴里也嚷着和他们相似的英文，立刻看见了倒在地上，周身血流不止的杋圭。
越南人不再动了，他们看着杋圭，如同看什么极其恐怖的东西。杋圭把手指拔出来，眼球碎片从他的指尖滴落。
然竣站在不远处，呆呆地望着他。
哥当时不害怕吗？杋圭问。
不知道。然竣牵着杋圭的手，在空中摇了摇。我不记得了，那些没什么值得记住的。我只记得你抓着地上的碎石头要往自己脸上划的时候，我本来待在那，然后我看到你就像疯了一样，那种感觉有点，怎么说，好像我本来在做梦，然后突然醒了。
我那时，杋圭轻轻地说，我感觉我掉进了一个很深的坑里，失去了语言，变成一只动物。我什么也没想，只想摆脱所有东西。
你那时候不正常。然竣把他的手握得更紧。那些事情都太可怕了，你一下子全经历过去，你不是因为长成这样才遇到手表那件事，或者被越南人欺负，这都跟你没关系。人在特别害怕的时候想不到那些，我有时也是这样。
杋圭抿着嘴，没说话。
所以我才带你去庙里挂珍珠，虽然我们挂上去的是假的，集市里买的塑料珍珠嘛，但是也没什么差别。你不是觉得美丽会带来厄运吗，这又不是真的。然竣目视前方，燥热的风吹开他额前的头发，他把这些话都讲得像无足轻重的玩笑。你相信什么，什么就是真的。杋圭，我是想说，你得试着相信一些对你好的东西。
比如呢？
然竣很快地回答，比如太显，还有我。
杋圭笑了，你说太显是对我好的东西？
不能这样说，然竣无语地看着杋圭，我知道你要跟我玩什么文字游戏。但是太显和我怎么也算是爱你的人吧。反正比那些莫名其妙的人强多了。
然竣说完，没等杋圭回应，毫不留情地弹了一下他的脑门。
走吧，别说这个了。晚上吃冷面怎么样？
之后连续两周都被暴雨浇灌，那天居然是唯一的好天。由于天气，许多航班被迫取消，鲜少有新的住客。太显送走最后一位客人，干脆关门大吉，宣布歇业，旅馆里一下子变得十分寂寥。
然竣最近精神萎靡，他说是药的后遗症。他总是吃完饭就钻回房间，倒头就睡，醒来又是第二天的中午。杋圭很担心他，主动提出来做饭，要给然竣补充营养。太显闻言，神色惊恐地说，你做饭我怕加重然竣哥的病情。
说什么呢！杋圭立刻大叫起来，我明明很会烤肉，你承不承认？
嗯。太显沉稳地点了点头，可是这里没法生火吧。他的手在虚空中抓了一下，潮湿的雨雾如有实体，被皮肤的纹路吸收进去。
一直在下雨。杋圭说，多久没见过这么大的雨了？
哥从前在首尔，当然没见过。太显笑着说，我已经习惯了。
你比我早来了几年?两年都不到吧。杋圭撇了撇嘴，这时候又像前辈一样教训我，和高中一模一样。
高中啊。太显走过去把窗户关上，雨声变得雾蒙蒙的。他注视着杋圭的脸，叹了口气，很感慨的样子。
其实哥和高中的时候没怎么变，但更瘦了一点。
你倒是变了很多。杋圭盯着他，神色有点奇怪，他不擅长陷入这种柔软怀旧的氛围里，这让他眼眶发酸。
许多个失眠的夜晚，他听着雨点敲打窗框的声音，无数次想过这一切究竟是怎样发生的。和太显恋爱，分手，重逢，再次建立联系，这四件事之间的距离太不公平了，他用了几乎三年的时间完成前两件事，却只花了五分钟就把它击碎。杋圭被然竣带回旅馆，太显打开门，就看见杋圭站在外面。高中同学，初恋，杋圭哥。他静默了几秒，然后扯起嘴角说，嗨。我是太显。杋圭只是愣在原地，仿佛世界一瞬真空。然竣在旁边说，我在路上遇到他，他的钱全被越南人抢走了，让他和我们一起待一段时间吧，至少等他找到工作。太显镇定地说，好。我会帮忙的。然竣说，他叫杋圭。崔杋圭。杋圭抬起头，慢慢地说，然竣哥，他知道。
我们是高中同学。太显说，很巧。
然竣睁大了眼睛。
你来岘港了之后，我还在首尔，我有段时间总是想，我们好像浪费了很多时间。杋圭说，整整两年，我们都知道彼此的存在，但没有任何交流，我实在想不通为什么。
他深吸一口气，继续说，不过那时候我可能有点，我不知道，其实我对你很感兴趣，但好像无法接近你。那次一起去游戏厅之后才变得熟悉起来。我有一种很奇怪的感觉，就像我们被时间骗了，现在的我们和从前的我们分属两个不同的时空。我不是遗憾，或者觉得我们比别人少了什么东西，可能我有一点难过，也有一点想念你，太显，说实话，我不知道。
杋圭的眼睛波光粼粼，他不再说话，只是揽住太显的肩膀。雨一下子下得更大，雾里探花般的水声沿着窗台流进来，填满了他们之间的每一寸空隙。杋圭突然想，他一定会记住这个时刻，他必须要记住。他有一种预感，在未来，也许这样一个静谧的，他们能够什么都不想地拥抱在一起的午后再也不会有了，他们中的一个会离开，也许是然竣，也许是太显，也许是他自己，铺天盖地的暴雨让他害怕。他拉着太显，走到他们常去的那座屋檐底下，旅馆前的那条路很长，一直延伸到人的视力无法企及的地方。那里一片空茫，雪白的天际处，雨暴烈地倾洒，大团大团灰色的云聚在一起，好似天空的淤伤。` },
      { title: "歌颂我", text: `然竣是被医院广播吵醒的。他躺在病床上，鼻尖萦绕着早已习惯的消毒水气味，耳边的温柔女声说，每周一次的心理健康讲座即将开始，请各位准时前往会议厅。然竣蒙上被子，试图隔绝那道声音，那个什么心理健康讲座，他去了一次就没有再去。医院劝他们不要自杀，即使情况很不好，也千万不要放弃。如果不行的话可以转入VIP病房，让设施得到全面升级，治愈概率也会提升。没什么，多付钱就可以，只要有钱就有希望。
广播还在重复那则消息，然竣望着惨白的天花板，想着，要不就今天吧？
他算了算父母上次给他打钱，并让他自己看着办的时间。好像是五天前，余额很充足，他没拿那笔钱来买药。要不就今天吧。
然竣从床上飞快地坐起来，开始穿衣服。窗外阳光明媚，万里无云。
就在今天，他要离开首尔。
五个小时的飞机，把然竣从光明都市抛进潮湿闷热的南洋。他不是没有一点可惜的东西，他的朋友们，熟悉的街道，音乐和语言。如果可以，他一样都不想丢弃，可是他的生命已经那么薄。新生活的温度在那一扇椭圆的窗外燃烧，顷刻粉碎了他因为不告而别而生出的愧疚之心。从前的时光已经死去，一段崭新的时间取代了它，开始缓缓流动，然竣毫不犹豫地跳进去，随着新鲜而娇嫩的河水漂流。他知道不久后这条河就会干涸，可是如果要死的话，绝对不能只是躺在病床上，身体四处插满管子，呼吸微弱到连遗言都说不出来那么悲惨的样子。
走下飞机的那一刻，湿热而厚重的空气在身边涌动，风吹起他的衣摆。赤红的残阳钉住团团卷云，一个好大好美的梦，就像一口新生的泉。
然竣在越南的第一份工作是在一家私人商店收银，因为英文说得好，干的还算不错。那家商店的位置很偏，四周围着一圈工人宿舍，来买东西的大多是越南劳工。然竣不是东南亚面孔，又时常吃药，身体十分虚弱的样子。有时被他们欺负，把然竣的药盒抢走，哗啦啦倒在土里，一脚踩碎，不知道要干几个月才能买一颗的救命的药碎成一滩亮晶晶的粉末。然竣看起来神色如常，并不生气，他盯着他们，忽然露出一个温柔的微笑。
隔天，然竣向商店老板请辞，去了其他地方。他没有再回到那里，也不记得在那里发生的任何事情，在会安，他是这样对那个人说的。他曾经在那片工人宿舍住过，因此认出了然竣。他告诉然竣，他走之后，有两个人出去找妓女，一天一夜都没有回来，再出现的时候，已经是两具尸体，赤身裸体，硬邦邦躺在门前。那边常有死人，没人当回事，还说他们是牡丹花下死，做鬼也风流，随地埋起来，就当做什么事都没发生过。他们总是去商店里买烟草。啊，然竣了然地点头，仍旧微微笑着，声调平和。
对不起啊，我不记得了。
他在会安待了一段时间，做一些杂活维持生计。每次在窄小的屋子里吃饭的时候，都能看见玻璃桌板下压着的太显的名片。怎么看都像初中生啊，然竣总是腹诽，说是这样就跑来做生意了，不知道现在是不是赚了很多钱了。他偶尔会和当地人聊天，谈起太显，他把太显说成他很好的朋友，在岘港开连锁旅馆的有钱人，或者只是在飞机上有一面之缘的年轻男孩，这变成他生活里的一个游戏，帮太显重塑人生。也许是因为说了太多次，即使在那之后再也没有见过太显，冥冥之中却好像成了很熟悉的人。然竣日复一日地注视那张名片，不知道为什么，他很仔细地保护着这片脆弱的长方形卡纸，连边角都没有弯折，一如它第一次被然竣放进裤子口袋那样崭新而洁白。
有一次，然竣帮木材店老板去会安边上的一个村子里进货，在那里认识了一群越南人，他们本来在胡志明市，被那边的人赶出来，辗转流落四处，最后来到这里。他们邀请然竣一起吃晚饭，然竣答应了，吃完就晕过去，被锁在一间小房子里。他们大概想用然竣来要挟木材店的老板，让他多给点钱。然竣的身体本来就差，那时更是几乎昏死过去，他迷迷糊糊地想，把我关起来有什么用？我本来也要死了，我本来就不怕这个。过了一会儿，他感到意识渐渐消散，他又想，活着怎么这么难？
后来发生的事然竣全都不记得了，醒来时就在木材店后门的休息室里。老板见他醒了，什么也没说，只是挥挥手赶他走。然竣的嘴唇动了动，喉咙一阵火辣辣的疼，发炎了。他对自己的身体状况十分熟悉。还有点低烧，不太好的情况，很危险，需要马上吃药。他慢慢地坐起来，朝老板的方向垂了一下头，接着转身离开，那一刻他突然觉得很累了，原来他这样迟钝，竟然从没发觉过。
回到家，坐在桌前，他的手中是一杯水和一盒药，桌板正下方压着太显的名片，他的眼睛很圆、很亮。然竣想，拍这张照片的时候，他一定故意眯起眼睛了，或者大概是睁开了百分之八十，明明真人的眼睛比这还要大。
旅馆的地址就印在照片下面——岘港，然竣早就查过地图，离会安只有三十分钟车程而已。
太显给了然竣旅馆的备用钥匙，他把钥匙穿在细细的皮绳上，当项链戴着。然竣觉得这样看起来不像真的钥匙，像个装饰品，就不容易丢。太显说，就算丢了也没关系，我这里没什么值钱的东西。然竣不高兴了，一把搂过太显的肩膀说，你不能夸我一下？说我很有创意，很好看之类的。太显迷惑地看着他，这不冲突啊。然竣于是放开他，伸了个懒腰走到门前，两条瘦棱棱的手臂荡在身后，痛心疾首地说，没救了，你这么不会说话以后怎么办？太显无所谓地耸了耸肩，哥来帮我，做我的合伙人呗。然竣做了个鬼脸说，我才不要。哪天我死了，我呕心沥血攒的钱就全归你了。嘘。太显把食指抵在嘴唇上，瞥了然竣一眼，哥不要随便说这样的话。然竣叹了口气，有点无奈。
这没有什么忌讳的，至少对我来说。
太显固执地说，那哥就当这个字对我来说是忌讳好了，以后真的不要再说了。
好吧好吧。然竣双手举起来作投降状，别这么严肃。
他怕太显真的生气了，于是提议开车出去兜风，正逢晴天，不能浪费了，他讲这话的时候神色悻悻，一直观察太显表情的变化。
太显说好，然竣立即从口袋里掏出车钥匙，叮铃哐啷地晃了晃。
我一直想问。太显坐在副驾驶，低头扣安全带，咔的一声。
哥这辆车是从哪来的？
然竣看也不看他，说，偷的。
真的？
嗯。我在一个工厂当助理的时候，那个经理想强奸我，一开始对我很好，后来他没成功，我把他狠狠揍了一顿，开着他的车跑了。然竣偏过头，眨了眨眼。怎么样，哥帅吗？
太显说，还行吧。
然竣说，诶呀，别不好意思。接着又说，看前面。
他把车窗打开，岘港的黄昏劈头盖脸地砸下，太阳周围镶着一层赤金，将人笼进一片金红交错的光晕里。然竣沿着一条路一直开，路边栽种着各种高大的树木，飞快地从他们的视线里掠过。在看不见的公路尽头，血红的落日挂在那，点燃一片粉霞。
然竣微微仰着脸，让风扑在他的面颊上。夕阳烈烈地烧着，从遥远的天际洒落。太显的耳边，汽车的轰鸣和呼啸的热风缠在一起，几乎产生掉进异世界的幻觉。忽然，他感到侧脸被什么柔软的东西碰了一下，一朵从天上溜走的云，然竣的嘴唇。他在颠簸中愈发头晕目眩。
然竣的声音还在问，太显，看过那个电影吗，末路狂花？

喂，但是我看起来有那么，呃，那么像私生活混乱的人吗？太显啊，你快说不是！
不是。
太好了！
哥比起私生活混乱，看起来更像不负责任的那种人。
杋圭捏紧拳头，作势就要打他，但很快又换上一副忧郁的神情，满怀希望地看着我。
休宁啊，哥不是这样的，你要相信哥。
太显说，不要信。
杋圭难以置信地说，姜太显，我哪里惹你了吗？
太显站起来，把拉面碗和杋圭吃完的pepero包装袋一起抱在怀里，放进洗手池。他回头，露出一个很浅的微笑。
哥其实不喜欢奥利奥口味吧？下次不要勉强自己了，遇到榛子味再买吧，如果是退而求其次的选择，还不如不要做，毕竟也不会开心。
杋圭坐在那，和太显对视，我看到他嘴角的弧度消失了，变成很扁很平的一道线。他从鼻腔里发出几个音节，大概是三个，我听不清，但那不是说给我的。太显的表情没有变化，他笑着的时候眼部肌肉放松，五官变得圆圆的，看起来很可爱，而杋圭的侧脸如刀削般锋利，棱角分明。前一天的故事又在重演，我被迫进入他们的秘密中心，却不知道那究竟是什么。
过了很久，杋圭低下头，说，我知道了。对不起，太显啊。
临近傍晚，然竣回来了，他提着三个购物袋，风尘仆仆，有点疲惫的样子。太显在厨房做饭，烤肉的香味飘过来。杋圭坐在沙发上玩手机，他看起来很紧张，身体一直紧绷着，被然竣的开关门声吓了一跳。然竣把手里的袋子放在地上，莫名地朝杋圭那边看了一眼，问他怎么了，杋圭摇摇头，说没事，只是在发呆，突然吓到了。然竣在玄关处换鞋，话说的十分含糊，哪有这么夸张，我关门声又不响……
杋圭站起身，绕过沙发，走到然竣面前，问道，哥去购物了？
不是说给你们买衣服的吗？
哇，真的给买了吗？
当然啊。然竣把额前的碎发撩到脑后，露出光洁的额头。我答应你们的事情没有没做到的吧？
然竣哥是神啊。太显端着盘子走过来，为了防止油溅到身上，他在背心外面又套了一件黑色的旧衣服。
肉烤好了。他招呼我，休宁啊，来吃吧，今天是你的欢迎晚宴呢。
然竣笑了一声，你们至少点外卖吧，用自己做的东西招待休宁算什么啊？
比哥只会煮拉面强。
诶，然竣被骂了也不生气，疑惑地看了看太显，你今天心情很差哦。
有一点，但是没关系的。太显说，不是都会有吗，那种没什么理由但就是心情不好的时候。
理解。然竣揉了揉太显的头发，那要不要先看看我给你们买的衣服？
这件是你的。他从纸袋里拎出一件厚厚的蓝紫色毛衣外套，递给太显。
很合适呢。杋圭在另一边说，我这件也是，尺码也正好。
哥对我们的尺码很熟悉啊？
然竣撇撇嘴说，我能不知道吗？别明知故问。杋圭没顶嘴，穿着那件衣服闷闷地笑。
休宁啊，然竣忽然喊了我的名字，也有你的份哦。
他把衣服展开给我看，宽松的灰白色针织衫，粗针脚的设计，看起来很温暖。然竣的脸被玄关昏黄的灯光照着，模糊了一点轮廓，变得无害而轻盈。
就当作欢迎礼物。
我站在那，他的声音在我耳朵里打旋，那一刻也许我都没意识到我在用一种怎样的眼神看着他。我明白了太显的意思，然竣是一个只要你一见到他，就想让他把自己的秘密奉献给你的人。如果你对一个人的复杂性足够敏感，你会知道这个世界上存在真的存在这种人，他们什么都不用做，就有人前赴后继地去探寻他们身上的真。那种想把他们从头到脚剖开的渴望能超越很多情感，这不是喜欢、讨厌、爱或者恨，这种感觉十分纯粹，完全由那个人的本能激发，一件事一旦关乎本能，就变得危险，变得动物化，令人难以控制。我想起了下午和杋圭他们的谈话。
可以问吗？不会生气吗？我盯着他。
然竣说，来试试吧，我不太确定你的尺码，总之按大了买的，应该不至于穿不上。
我接过那件衣服套上，指尖触感柔软，衣长稍微短了，但不影响穿着，我把拉链处的褶皱抚平，问他，哥觉得怎么样？然竣温和地笑了，说，我眼光很好，很漂亮。
杋圭已经把衣服脱下来收好，放回袋子里，他挂到然竣身上，往他的腰那里掐了一把，说好不公平，明明是我和太显做游戏赢了才有的奖励，休宁什么都没做就有了，哥太偏心了吧？
你还像不像样啊，崔杋圭？然竣拍掉他的手，这也要发疯？
杋圭吐了吐舌头，说，开玩笑嘛。几秒之后，他像想起了什么，转过头来看我，很慢地勾了一下嘴角，休宁啊，你知道哥的意思吧，别生气？
我摇摇头，迎上他的眼神，哥放心吧，我不会生气的，我也想和你们变亲近呢。
太显在一边说，好善良啊。
杋圭嘁了一声，完全是逗小孩的语气，你们是忙内啊，就各自和善良的人去玩吧？然后他揽住了然竣的肩膀，把脸凑到他的耳边，好奇怪，我明明站的离他们不算很近，杋圭的声音却异常清晰的传入了我的耳朵，也许是我太在意了，也许是杋圭根本没打算小声说话。
他说，哥等会儿来我这吧？不是答应我的嘛？
然竣偏过头去，从我的角度，他们几乎接吻了，鼻尖与鼻尖贴在一起，发丝温柔缠绕。然竣的脸颊因为笑而鼓起，他蹭了蹭杋圭的额头，说，好。
我先看见了杋圭的脸，他倒在床上，仰着头，嘴唇微微张开，他是在喘气还是轻轻地说着什么话，我并不能分辨得很清楚。我说过，他的脸像女人一样，被雕琢的十分精细，睫毛密密地垂下，恰到好处的长度，盖不住潋滟的眼睛。他躺在那，等待着谁，我产生一种错觉，我的视线变成摄像机，而脚步变成柔软的滑轨，清晰、百分百真实地记录下房间里的一切。然竣入镜了，只一秒，我能确定那是然竣。他还没有露出面部，只留给我一个圆而凌乱的后脑勺。我认出他是因为肩膀，那里的骨头没有零点一度的弯曲，平直地横着，洁白的布料如瀑般流下。
他走过去，衣袖拂过杋圭的脸，后者从床上直起身子，手摁在然竣的后颈，把他往下压。我听见他们接吻，一下一下，发出浸透了水的塑料吸盘和某个平面分离的声音，那让我感觉他们不像真人，而是一种内部被胶质充满的、依从设定好的本能行动的机械生物。然竣坐在杋圭身上，脖颈向后延伸，他的脸，尤其是眼下部分的皮肤变得很红，那里屏障脆弱，更容易被蒸出颜色。他喊了杋圭的名字，尾音含混，如铜化水，飘进幻梦里遥远的温柔乡。杋圭回应他，哥哥，然竣哥，不能对我再好一点吗？我总是能把杋圭的话听得那么清楚，即使他从未真的对我说话。我忽然觉得，是不是一个人越想向谁隐藏什么，那些东西反而越庞大，越找不到地方去藏。
然竣把杋圭抱在怀里，用手指梳他的头发，在他的唇角春风细雨地吻，他不像杋圭的哥哥，而像母亲，他把杋圭的哀伤揉起来，团成球丢掉，此后他的梦里不再有魔鬼。他双手搂着他的背，搂得很紧，指甲刺进肉里，连抓痕也留不下。然竣的指甲修剪得很勤，短且圆润，只掐出一个泛红的月牙。
杋圭一直在喊他，最开始喊然竣哥，喊多了就变成然竣。然竣，如果世界末日，你会陪着我吗？如果我马上要死了，你可以为了我放弃所有的东西吗？我是做得最好的，对不对？然竣，比起其他人，你更喜欢我，对不对？然竣大概是说了什么，但他的答案太轻，被身体碰撞的声音盖住。那个声音并不色情，我感到很奇异，因为那听起来像雨落在窗台上的响声，但比之更清脆，充满一股纯澈的悲伤。我看见某个瞬间然竣攥着杋圭的手，抖的像生病了，他颤颤巍巍地用嘴唇去贴他的眉骨，动作那样缓，缓得近乎虔诚，我听见他说的话，从喉咙深处溢出的叹息，我的鼻尖萦绕着画材的气味、浓烈的木质调香水味，檀香，混着皮革、琥珀、岩兰草，或许还有别的什么，我不知道。那个场景太官能性，太沉静，强烈的电流涌动其中。我的心脏有如火烧，天国翻倒过来，如果你不曾目睹一个下流的神施恩于戴罪之人。
就在那一刻，我的眼前出现了他们的脸，在昏暗不明的角落，被热气冲刷过，像某种流质融化在一起，两张美丽而柔情似水的脸。忽然，如同被切断电源一样，这份隐秘的记录黑屏了，我听见咔哒一声，房门落锁，我从床上坐起来，隔壁房间里传来低低的叫声，衣物摩擦的响动，哗啦一声，有什么东西被扫落在地。
杋圭的房间。
然竣的声音还在断断续续地传过来，他轻轻地吸气，听起来有些痛苦，但又难耐地重复着杋圭的名字，十分可怜，十分甜蜜。
我保持着摄影师的姿势，愣在那，床单湿淋淋一片。
然竣哥也是这样吗？没有比这更蠢的问题了。
我又想起了太显说的，去问他吧，他不会生气的。
我想，原来是这样，他们不谈论爱，是因为不需要这个。杋圭没有撒谎，其实他们三个人都非常诚实，从没特意向我隐瞒什么，认识一天还是十年，对他们来说没有差别，他们真的没在乎过，无论是在彼此之间，还是面对我的时候，是我错怪他们。
我起身走出房间，杋圭的房门没有上锁，那道锁音终究不过梦中幻影一瞬。从细小的门缝中，我看见然竣起伏的背脊，乱蓬蓬的头发，杋圭形状漂亮的手。
从始至终，我都没有看见然竣的眼睛。
我倚着墙，缓缓地坐下，捂住脸。
不知道为什么，我想他一定哭了。
二十年来，我睡觉很少做梦，前十五年是因为父亲的光辉普照，从没有一秒为钱担忧，近五年则是需要考虑的事情太多，维生已经非常辛苦，疲于四处奔波，无力再多想什么。小时候我读的童话书是海的女儿，听过的传奇是勇者斗恶龙，我相信真的有这么纯净无暇的爱存在，那些故事为我埋下一个可能性，那就是长大之后我也会变成英雄。现在我躺在然竣的房子里，辗转反侧，听着他细碎的叫床声抚慰自己。我的注意力并不在手上，连释放时的快感都像假的。然竣租给我的房间不大，但很整洁，家具不多，只足够基本生活使用，没有繁复的装饰，空气里飘着淡淡的木头味道。我感觉我的思绪飘到很远的地方去，我想起我在美国的家，三层联排别墅，华丽闪烁的水晶吊顶，欧风家具，只出现在欧洲宫廷剧里的五米长桌。曾经在那里，我拥有一个独立的房间，有人每天为我擦拭书桌，衣橱，按照我的口味制作甜蜜的点心。在我离开的最初几年，这栋别墅一次都没有出现在我的梦里，它从我的生活里完全消失了。后来姐姐传给我一张照片，大概是手机拍摄，像素不高，雕花铁门上零落地挂着封条，姐姐配文，凯呀，我们再也没法回去了。我不知道该怎样回她，我不知道她是想跟我开玩笑，还是真的很伤心，姐姐在我心中，本来是永远也不会倒下，永远也不会伤心的人。
她很久没有给我发过信息了。我抽出纸巾，慢慢地擦拭手指。我时常想，他们还是把我当作学生，一个未曾接触世界险恶的孩童，即便我已经二十岁，在汽车旅馆里和只说过一句话的人做爱，家人们依旧觉得我是可爱的，因此把我遗落在他们之外，用这种办法来隔绝有害的细菌。这是一种精神隔离，时间久了，我就再也找不到他们，再也回不到那个温暖的地方去。
如果我是故事的主角，那么一切不该就这样结束，千钧一发的时刻，一定有善良的编剧为我机械降神，送我无敌的超能力，或者一颗希望的种子。然竣不是那样的编剧，他告诉我，那么伟大的东西，他一点也给不了。无论是杋圭还是太显，他们只是住在这里，在首尔找一个栖身之所。然竣说，你知道的，休宁啊，你应该知道的吧？首尔是一座多么容易让人伤心的城市啊。我沉默了一会儿，冬日午后的阳光暖融融的，把布面沙发烘的微微发热，然竣坐在那块没有光照的阴影里，柔情而可怜地注视着我，我想说什么，拼命地让我的大脑在那样的注视下转动起来，可最终只是张了张嘴，一个字也没有说。我不想反驳然竣，我知道他说的对。他笑了一下，挪到我身边来，牵住我的手，他的手指和我的交错在一起。然竣身材很好，腿很长，因此坐下时体型一下子就变得很小，他稍微仰着头看我，用力睁开眼睛的时候，会挤出一道深深的双眼皮褶，像刚割出来那样深，但一放松就消失不见。他松散地靠在我的肩膀上，柔软的发丝落在我的颈窝，他问我，休宁啊，你喜欢我吗？
我的呼吸陡然间变得急促，我看着然竣，几乎是逼视着他，这是一个不需要答案的问题，而然竣也清楚地知道这一点。他为什么问我？我明白那两个字于他而言什么都不算，就像他能随便敲响杋圭和太显的房门，在他们面前脱下衣服。他是为了寻找快乐，而不是等待真爱降临。杋圭曾经问过我，既然觉得他漂亮，那要不要和他上床试试看？那时的杋圭也像现在的然竣一样，亲昵地拉着我的手，用毛茸茸的脑袋蹭我的脸颊。许多个夜晚，我看见太显的房间里亮着灯，昏昏摇晃的橘红色，他的声线再怎么忍耐也很明显，混乱的喘息和求饶的话互相交杂。我第一次知道太显在与杋圭的关系里是承受方的时候有点吃惊，很显然杋圭是更幼稚的那一个，但太显只是说，他怎么样都可以，他们试过反过来，但杋圭不喜欢，所以就变成了现在这样。杋圭点头，温柔地亲了亲他的脸，笑容万分残忍，他说，是我们太显自己说的，他怎么样都可以的。
从那以后我就明白，他们都是这样，引诱的行为里不包含一丝一毫的廉耻心，而正是因为放弃了这些，才显得无比真诚。
每当我怀念起从前我所拥有的某种意志，我的眼前就会浮现然竣裸露的肩骨，那个锐利的直角像一颗图钉，死死地扎在我的信念崩塌的源头。然竣仍然轻柔地握着我的手，等待我的回答。我很想哭，想像杋圭一样被他抱在怀里，让他成为我的姐姐，我的家人。他让我从过去的家里走出来，走进新的家。在这个温暖、美丽、充斥着木头香味的卧室里，我们就像两条刚破壳的蛇一样，带着满身的黏液和血污交缠在一起。
我望着他说，哥，我爱你。
然竣缓缓地笑起来，冰凉的指腹擦过我的脸颊。
他说，别哭，凯呀，别轻易说这样的话。
我捏住了然竣的手腕，把他压在了沙发上。他肩头的衣服因为用力而滑落，白而细腻的皮肤在白炽灯下反射出幽幽的荧光。这所有的一切都是一个诡计，无论是什么代价，我都已经做好了全部交出去的准备。我开始吻他，用很重的力道去咬他的嘴。我抚摸他的肩膀，那里的骨头很尖，硌得我掌心发痛。他撩开汗湿的刘海，安抚性地摸上我的小臂，一句话碎在几声叹息里，休宁啊，轻一点。哥好痛。我说，哥记住这个感觉吧，我得让哥痛一点，不然哥会忘记我。然竣仰起头，有点艰难地吐气，他搂着我的脖子，亲亲密密地跟我接吻。我没有说过吧，然竣的舌系带很短，舌尖分岔，探出嘴唇的时候，像蛇吐信子。然竣万分柔情地吻我，我的心里漫上一股甜蜜之情，被年长的哥哥讨好的感觉令人迷醉。在那几十分钟里，他像一个布娃娃一样任我摆弄，我往里凿，他浑身都在发抖，但某一刻，那种神秘的、宁静的微笑还是会从他被操得乱七八糟的脸上浮现出来，仿佛一个已经落成的骗局，在胜利的彼岸嘲笑着我。
那天夜里，杋圭叩响了我的房门，他给我买了一件礼物，可爱的毛绒熊玩偶，他把包装华丽的礼盒递给我，笑着说，休宁啊，打开看看吧？
说实话，在打开之前，还以为会是什么整蛊道具之类的，但那个玩偶安安静静地坐在盒子里，无机质的黑色豆豆眼，看起来很可爱。
杋圭说，喜欢吧？我挑了很久噢！
我道了谢，问他，最近有什么节日吗？
什么话，我是那种只有过节才会给弟弟买东西的人吗？
那杋圭哥是想让我帮忙？
啊，那个。杋圭的脸部肌肉有一瞬间的扭曲，但很快恢复原状，不知道是因为他觉得这件事情难以启齿还是怎么样，总之十分纠结。
你知道我和太显的关系吧？他最近好像生我的气了。杋圭耷拉着脸，你们不是亲故吗，帮我问问他到底是怎么了啊？说真的我什么方法都试过了，他完全不理我，什么都不和我说，今天下午又玩失踪，休宁啊，你不是天使吗？就帮帮哥吧？
我把熊玩偶抱在怀中，享受着那团柔软的棉花被压扁的触感。
今天下午吗？我和然竣哥在一起呢。
啊。杋圭愣了一下。
然竣哥没有告诉哥吗？
哈……啊，没有告诉我。他垂下头，声线瞬间冷了下去。
凯啊，杋圭的语调十分平稳，崔然竣和你做了？
我露出一个饱含歉意的笑容，说，虽然有点不好意思承认，但我很喜欢然竣哥来着。
杋圭冷笑一声。
还有，我可能帮不了哥哦。
为什么？
这是哥和太显之间的事情吧，我觉得好像得哥自己去解决才行。真的不是我不想帮哥。我看着他，慢慢地说，我很喜欢哥，第一次见的时候就觉得哥很漂亮，也很喜欢太显，所以真的，完全不希望你们吵架。
休宁啊。
杋圭低着头，伸出手戳了一下送给我的熊玩偶的肚子，然后又忽然抬起头，笑得十分甜蜜。
我知道啦。
他双手背在身后，身体朝我的方向压过来几度。
小熊本来就是要送给你的，会抱着睡觉吧？一定？
我点点头，说，会的。
杋圭说，不要骗我哦，我会检查的。
九点过十分，我的手机闹铃准时响起，明媚的日光刺破窗帘，我边揉眼睛边想着要和然竣抗议，必须换一个遮光的帘子，不然早上六点和九点根本没区别。好在今天状态不错，我用冷水洗了把脸，盯着镜子里照出来的挂在睫毛上的水珠，用力地眨了眨眼，把它们甩掉。
今天是陪太显去互助会的日子。
本来是然竣陪他去的，但然竣今天有约会，杋圭从昨天晚上就不知道去了哪里，尽管太显一再说他早就不需要人陪了，然竣哥还是不容置喙地把这个任务指派给了我。
休宁还不知道你的事。然竣是这样对太显说的。
坐在摇晃的公交车上，太显的侧脸被白花花的阳光照着，他转过头来朝我一笑，忽然说起杋圭。
杋圭哥去PC房了，你不用管他。
啊……
之前他陪我去过几次，后面就有意识地避开这个时间，他大概，太显顿了顿，有点受不了那个地方吧。他是不想陪我去才干脆直接消失的。
我感到很奇怪，为什么？
可能有点恐怖。太显拍拍我的腿，不过你不用害怕，没有人会伤害陪同的家属，只是那个氛围让人不舒服。
休宁，其实我不想让你知道的，本来对我的印象停留在杋圭哥的，床伴？总之是那一类的，我觉得就挺好的。
我望着太显的眼睛，第一次见到他的时候，我就注意到他的眼睛，平静而明亮，轮廓清晰。他说这些话的时候十分冷静，似乎话中的主人公不是他自己，而是其他不相关的人，那其中压抑着什么更为庞大、更具毁灭性的东西，被太显死死地藏着，不让然竣和杋圭发觉。我握住了太显的手，轻柔地摩挲他的手背，他皮肤下的血管很明显，如果我是护士，应该很乐意给这样的手扎针。
我说，不会啊，我从来没把你当成杋圭哥的床伴那种的，你也不要这么觉得嘛。我笑了起来，太显就是太显啊，我喜欢哥哥们把我们划到一起的感觉，我们不是朋友嘛。
别误会。太显的身体忽然僵住了，他认真地看着我，说，我没有自轻自贱的意思，那只是一个事实，你不用觉得很惶恐。
公交到站的提示音响起，他牵着我的手指，站起身，目光投向不远处的白色建筑。
他说，到了，休宁，下车吧。
进入那幢房子后，我和太显被分开了，穿志愿者背心的女孩把我领到陪同区，那里稀稀拉拉地坐着五六个人，大多是年迈的女人，我想她们应该是患者的母亲。
在不远处的草坪上，十二把椅子围成一圈，椅背上贴着崭新的名牌，太显找到自己的名字坐下，朝我比了个OK的手势。
主持人是一名三四十岁左右的女性，她有一双微微下垂的，柔和的眼睛，她穿着灰色的毛衣，坐在最中心的椅子上。
嘘，她把食指竖在唇边，微笑道，孩子们，开始吧。
她的话音还未落下，只一瞬间，我就感觉到太显所在的那片区域变得鸦雀无声，她的眼神在他们之间逡巡，停在某个地方，然后轻缓地喊出那个女孩的名字。
敏真啊，你先来吧？
直到那一刻，我才明白了那种恐怖，那的确是值得杋圭提前一天就逃跑的。在这个地方，无论是观者还是参与者，你都感到你的秘密无所遁形，你得把你的前半生嚼碎了，在沸腾的伤痛里烫过一圈，像涮火锅一样，烫成八分熟端上来，最后淋一道料汁，用余温蒸够火候。如果你觉得痛，那是正常的，刮骨疗毒就是这样痛，只要相信就好了，把你的一切摆到世界的面前，让他们夸赞你、理解你、祝福你。这片草坪就是世界。
至于那究竟会带来什么影响，你知道，任何治疗都是要付出代价的，不管这个代价是钱、痛楚，还是其他更不可逆转的东西。
太显是第四个被点到的。
他深深地吸了一口气，说道，大家好，我是姜太显，二十岁。八年前，我患上了解离症。
理论上来说，一个人如果失去了他所有的亲缘关系、大部分的朋友，并变得不太像自己，首先可以得出的结论是物质世界出了问题，在不满足前者的条件下，才会考虑到精神层面。我的病从很小的时候就有了征兆，但由于生活环境太优渥，反而没人相信我是真的病了。
我要说的，是我十四岁的时候发生的事情。
那时我住在江南，我的家很大，三层楼，附带一整片花园，不过那些现在都不属于我了，说实话，有点可惜吧？讲到这里，他勾了一下嘴角，我能看出他想开个玩笑，但那并不让人开心。
父母工作很忙，而我的生活被补习班填满，家庭教师们来了又走，上午学完英语和数学，下午得上钢琴、拳击、汉文，我不想吹嘘自己，但那时候我真的做得很好，每一节课都努力听讲，认真地复习，尽管有时我不知道这意味着什么，也不知道为什么要这么做。
那天我练完船歌，弹给我的钢琴老师听，她总说我是个天才，我应该继续弹琴，一直弹下去，你听出来了吧，他们其实并没有把我当一回事，我在他们眼中，比起人，更像核弹吧，每个人都在评估我的内部有多少潜能，爆炸的话会辐射多少公里。
可是她突然问我，太显啊，你觉得做钢琴家怎么样？你想做吗，喜欢吗？我看着她的眼睛，不知道怎么回答，我应该说喜欢的，我知道这样做是正确的，但我的眼前突然变得模糊，她的声音也变小了，像隔着一层厚厚的玻璃。我感到很困惑，那种感觉就像我不再是我了，我的灵魂从身体里脱离出来，在更高的地方俯视这个世界。我和我的钢琴老师相对坐着，她戴着一条蓝色的锆石项链，我像一个发条坏掉的机器人，无法给出她想要的回答。
不知道是不是我的错觉，太显往我这里看过来，很轻的一眼。
他说，那是我第一次解离，没有人发现，他们都以为我只是累了。
那一次互助会上，太显说了很多话，我后来才知道，他不是每一次都说这么多话的，与之相反，他状态稳定，积极配合治疗，鲜少用修饰性的语句表达主观感受。他严格遵守医嘱，强调已被证明、不可证伪的客观事实，那是他抓住这个现实世界的方法。
在回去的公交车上，我拉着太显的手，首尔的冬天太冷，他的指尖也未化冻，捂了一路还是冰凉。
解离的次数多了之后，我发现这并不影响我的日常生活。太显告诉我，我还是可以和他人讲话，没有任何异常，只是我不知道我还在控制我的身体，仿佛那是两套分离的系统，你也许不明白，但事实就是这样。我以为我是压力太大，出现了幻觉，或者什么其他症状，总之过段时间就会消失。
他微笑了一下，露出尖尖的鲨鱼牙，说，我在家里养了一盆芦荟。
那天发作的时候，我正好在给它浇水。
休宁啊。
他轻轻地喊着我的名字，眉头皱起来，把脸靠在了我的肩头。
你知道吗？我突然感觉我拿不住那个水壶，有那么几秒钟，我甚至感觉不到我存在。
那个时间很短，真的很短，但我的意识浮在空中，一切都像是慢动作。水壶是铝制的，我的手指放开了它，它砸到那盆芦荟上，它们一起摔了下去，砰的一声，其实在我的记忆里更接近，噗，的发音，很轻。我把身子探出窗台，小心翼翼地维持平衡，我往下看，然后看到了血，一个模糊的人型睡在那里，深棕色的营养土泼得到处都是。
其实我到现在为止都不知道那个人是活着还是死了，但没有人因为这件事找过我的麻烦，他就像消失了，就像从来没有一个人躺在那里过。太显偏过头，找了个更舒服的姿势。他的嘴唇几乎贴在我的下颌，我能感受到他说话时细微的气流，还有薄荷味牙膏的香气。
后来我发现看那种时代剧好像可以帮助我集中精神，或许是因为科技还没有那么发达的时候，合成出的木质刀剑碰撞的声音和那个声音很像，像一个警铃一样。我会害怕，然后清醒过来。
他说完，静静地在我的肩上靠了一会儿，问，你还好吗？
我搂住了他，略微低下头去，如果有人背后看我们，那一定像一对耳鬓厮磨的、甜蜜的情侣。我明白了杋圭恐惧的到底是什么，是太显自己选择了变成这样的人，离开一个连杀人都不用负责的家庭，来到然竣残破的羽翼之下，心安理得地展示脆弱，换取快乐。他和我一样，都再也没有办法回到宫殿般的家中，我深知这绝对不是一个等价的选择，可你怎么能说沐浴在这种爱和注视下的太显不是幸福的？我盯着太显的眼睛，他的瞳孔是棕色，很剔透，让我想起小时候玩的玻璃弹珠，夕阳在我们的身后燃烧。我凑上去，亲了亲太显的嘴唇。
我想，杋圭哥，胆小鬼。
从互助会回来的第二天中午，然竣回来了，他一到家就叫了鲜花外卖，坐在沙发上摆弄起来。他最近在忙着参加舞蹈比赛，三天两头排练通宵，几晚上不在家住也是常有的事。和他一起消失的还有杋圭，不过频次较少，据太显说，这没什么稀奇的，杋圭哥本来就只是看着然竣哥，跟着他跑而已。我了然，然竣和杋圭的关系里有一种他人无法插手的特殊性，我与他们第一次见面时就察觉到了这一点，这种联系很紧密，像壁虎和它的尾巴，切断了不会死，但会完全变成另一种样貌，用和从前截然不同的方式活下去。杋圭是个非常敏感的人，对于爱的消弭，他总是最先感到唇亡齿寒。
我注意到然竣订的都是用来祭奠的花。
别害怕，休宁。然竣用白色丝带把小雏菊扎好，头也不抬地说，杋圭还活着，今天是我妹妹的忌日。他端详着手里的花束，问我，扎的还可以吧，漂亮吗？
我有些无措，只好点点头，我从来不知道然竣哥还有妹妹。
嗯，是挺漂亮的。他的语速很快，把花放在桌子上，开始给自己喷发胶，他动作很熟练，把头发抹成侧分，又照了照镜子，自言自语道，就这样，应该可以了。
休宁啊，我先走了，晚上我会回来的，给你们做拉面粥吧？
然竣朝我挥挥手，眼睛眯成一条缝，笑着说。
然竣哥的妹妹？杋圭的目光黏在游戏界面上，手上的动作没有丝毫停顿，你问那个啊，今天是几号来着？
我说了一个数字。
啊，那就对了。屏幕上显现出胜利的字样，杋圭把头戴式耳机摘下来，这才看向我，我怀疑他根本就没听见我说的话。
你来的第一天不是问然竣哥是不是画家嘛，你注意到他的画了对吧？那个女人就是他的妹妹，嗯，经过艺术加工的版本。杋圭说，我还在想你要忍到什么时候才会问这个呢，原来你到现在还不知道。
什么？
然竣哥的妹妹四年前去世了，车祸，他那时的男友开的车。
我睁大了眼睛，一时难以消化这句话里巨大的信息量。
当然了，那个男的也死了。杋圭平静地说，其实没有别的故事了，就这么简单。那之后，然竣哥就不谈恋爱了。每年这个时候，他会带着花去看他妹妹。
好可怜啊，我说。
杋圭掀起眼皮，看了我一眼，摇摇头笑了，他说，这句话被然竣哥听到，他会很生气的。从我最开始认识他的时候就是这样，然竣哥是那种，不管过得多惨都绝对不想要别人可怜他的人不是吗？
又是这种感觉。
我盯着杋圭，从第一次见面起，这种奇怪的、令人难受的感觉就时刻萦绕着我：为什么杋圭说起然竣时总是那么信誓旦旦？就好像这个世界上没有比他更了解然竣的人了一样。他好像知晓然竣全部的过去，并自诩能洞悉他的未来。我说不清那种感受，杋圭如此确认然竣在他生命中的地位，他凭什么这么做，凭什么认为他们的关系在他的掌控之中？
哥。我慢慢地抬起头，问道，哥和然竣哥，是什么时候认识的？
啊，杋圭笑了笑，然竣哥是我在艺高的前辈啊，之前没有告诉过你吗？
这个答案太简短，远远不够，而杋圭重新戴上了耳机，不再看我，我知道，他并不打算告诉我更多了。
科学研究表明，如果你经常梦到一个人，代表你在慢慢地失去有关他的记忆。我推开太显的房门，看到他正开着电脑在浏览器上检索什么，搜索栏里出现梦、解析、预知梦一类的字眼，他没有回头看我，也没有合上电脑，我在他的床沿坐下，伸手抚摸他的背，他浅浅地弯了一下嘴角，往我的方向靠了靠，以示回应。自从那次互助会之后，我们变得亲近了许多。
太显说，我最近总是梦到杋圭哥。
我没把他的话当一回事，问道，怎么了？
杋圭不在家的时间越来越多，我们都注意到了这一点，但那并不能证明什么。
我觉得他要走了。他垂下眼睛，靠进我怀里，用手指点我的睫毛。
不会的。我说，杋圭哥能去哪？
我不知道。太显说，但是我最了解杋圭哥，就算没有地方去他也会走的。
我还是不明白，为什么？就算他要离开我们，也不会离开然竣哥的。
太显定定地看了我一会儿，有点无奈地笑了，有没有人说过你这样说话很容易让人伤心？
我想到两周前杋圭送我的那个熊玩偶，忽然把一些事情联系在了一起。
对不起，太显啊。我先道了歉，又问他，你们不是在吵架吗？还是冷战之类的，说实话，杋圭哥之前找过我。不过看样子现在和好了？

然竣看了他一眼，说，你知道了？
杋圭平静地反问，知道什么？
然竣说，出轨，滥交，想逼我吸毒。
杋圭微微睁大了眼睛。
不过他没成功。然竣声音低下去。说实话，好可怕。
不会再来找哥了吧？杋圭走过去，坐到然竣身边。然竣掰开他攥紧的手，跟他十指相扣。
然竣说，不会了。
然竣又说，对不起。
杋圭总是回想起那一天，他发现人的记忆非常脆弱，从前在大学里读药学，那么多个药物的名字，几行都写不完的公式，在考试结束之后会全部忘掉，后来记住，是因为在好几年的时间里每一天都不断记诵着它们。
那天天气怎样？杋圭想了很久，不记得了，可能是多云或者晴天，总之没有下雨，然竣的味道十分干燥，仿佛仍然绕在鼻尖。那句道歉像一个开始，从此他们的生活才真正启航，然竣的脸变模糊，而声音更清晰，杋圭想问对不起的真正含义，为什么向我道歉，是不是因为爱我。
杋圭想，真奇怪，直到那件事情过去几年之后，他才恍惚回过一点神。究竟是太迟钝还是自动屏蔽了，也已经没法再深究，在破碎的回忆之河，杋圭孤身一人朝着厄运怒吼，控诉他抓错了人，然竣哥本来要上天堂，却做了前男友的替死鬼。

然竣是大学最后一年辍学的，辛苦的前十几年转瞬成为泡影，他快速地瘦下去，脸颊向里凹，头发的颜色总是换。杋圭某次回家，看见染了橘发的然竣坐在沙发上。

然竣看了他一眼，嘴唇蠕动了一下。
崔然竣。杋圭一把抓住然竣的手腕，后者手一抖，手机啪地一声砸到地上。

然竣摇头。

哥？
啪嗒。

然竣说，杋圭，陪着我。

杋圭啊？
哥。杋圭用纸巾为他擦脸。

有的。
然竣凑到杋圭跟前，眼泪顺着脸颊滑下来。
魔鬼在微笑。
我骗你了。
就在那个房间的抽屉里，有一个夹层。

然竣说，你不明白，杋圭。

他听见咚的一声，然竣的身体砸在地上。
咚。

  document.title = SITE.title;
  var filters = { q:'', fandom:'', status:'', sort:'new' };

  var shelf = h('ol', { class:'shelf' });
  var count = h('p', { class:'count', role:'status' });

  function rowEl(w){
    var pos = store.get('fw:pos:' + w.id, null);
    var resume = null;
    if(pos && typeof pos.ch === 'number' && w.chapters[pos.ch] && (pos.ch > 0 || pos.r > 0.02)){
      resume = h('a', { class:'resume', href:'#/w/' + w.id + '/' + (pos.ch + 1),
        onclick:function(){ pendingRatio = pos.r; } },
        '继续阅读 · 第' + (pos.ch + 1) + '章 ' + Math.round(pos.r * 100) + '%');
    }
    return h('li', { class:'row' },
      h('span', { class:'no', 'aria-hidden':'true' }, pad(WORKS.indexOf(w) + 1)),
      h('div', null,
        h('h2', null, w.external ? h('a', { href:w.external, target:'_blank', rel:'noopener noreferrer' }, w.title + ' ↗') : h('a', { href:'#/w/' + w.id }, w.title)),
        h('p', { class:'meta' }, [w.fandom, w.pairing].filter(Boolean).join(' / ')),
        h('p', { class:'sum' }, w.summary || ''),
        w.tags.length ? h('ul', { class:'tags' }, w.tags.map(function(t){ return h('li', null, t); })) : null,
        resume
      ),
      h('div', { class:'side' },
        w.status ? h('span', { class:'stamp' }, w.status) : null,
        h('span', { class:'mono' }, w.external ? 'AO3' : w.words.toLocaleString('en-US') + ' 字 · ' + w.chapters.length + ' 章'),
        h('span', { class:'lcd' }, stampDate(w.date)),
        w.rating ? h('span', { class:'mono' }, w.rating) : null
      )
    );
  }

  function updateList(){
    var q = filters.q.trim().toLowerCase();
    var items = WORKS.filter(function(w){
      if(filters.fandom && w.fandom !== filters.fandom) return false;
      if(filters.status && w.status !== filters.status) return false;
      if(!q) return true;
      return [w.title, w.fandom, w.pairing, w.tags.join(' '), w.summary].join(' ').toLowerCase().indexOf(q) >= 0;
    });
    items.sort(function(a, b){
      if(filters.sort === 'words') return b.words - a.words;
      var da = String(a.date || ''), db = String(b.date || '');
      return filters.sort === 'old' ? (da < db ? -1 : da > db ? 1 : 0) : (da < db ? 1 : da > db ? -1 : 0);
    });
    shelf.replaceChildren.apply(shelf, items.map(rowEl));
    count.textContent = '共 ' + items.length + ' 篇';
    emptyEl.hidden = items.length > 0;
  }
  var emptyEl = h('p', { class:'empty' }, '没有符合条件的作品，换个关键词试试。');

  function chipGroup(values, key, allLabel){
    var wrap = h('div', { class:'chips' });
    function btn(label, val){
      var b = h('button', { class:'chip', type:'button', 'aria-pressed': String(filters[key] === val) }, label);
      b.addEventListener('click', function(){
        filters[key] = val;
        wrap.querySelectorAll('.chip').forEach(function(c, i){ c.setAttribute('aria-pressed', String(i === 0 ? val === '' : c.textContent === val)); });
        updateList();
      });
      return b;
    }
    wrap.append(btn(allLabel, ''));
    values.forEach(function(v){ wrap.append(btn(v, v)); });
    wrap.querySelectorAll('.chip').forEach(function(c, i){ c.setAttribute('aria-pressed', String(i === 0)); });
    return wrap;
  }

  var search = h('input', { class:'search', type:'search', placeholder:'搜索标题、原作、CP、标签', 'aria-label':'搜索作品' });
  search.addEventListener('input', function(){ filters.q = search.value; updateList(); });
  var sort = h('select', { class:'sort', 'aria-label':'排序' },
    h('option', { value:'new' }, '最新在前'), h('option', { value:'old' }, '最早在前'), h('option', { value:'words' }, '字数最多'));
  sort.addEventListener('change', function(){ filters.sort = sort.value; updateList(); });

  var stats = [['作品', WORKS.length], ['总字数', totalWords.toLocaleString('en-US')], ['原作', fandoms.length]];

  app.replaceChildren(
    h('div', { class:'shell' },
      h('header', { class:'top' },
        h('a', { class:'brand', href:'#/' }, SITE.title),
        h('span', { class:'spacer' }),
        themeButton()
      ),
      h('section', { class:'hero' },
        h('div', null,
          h('p', { class:'kicker' }, 'Fan works archive'),
          h('h1', null, SITE.title),
          h('p', { class:'tagline' }, SITE.tagline)
        ),
        h('div', null,
          h('p', { class:'about' }, SITE.about),
          h('dl', { class:'stats mono' }, stats.map(function(s){ return h('div', null, h('dt', null, s[0]), h('dd', null, String(s[1]))); }))
        )
      ),
      h('section', { class:'toolbar', 'aria-label':'筛选' },
        h('div', { class:'toolbar-row' }, search, sort),
        fandoms.length > 1 ? chipGroup(fandoms, 'fandom', '全部原作') : null,
        statuses.length > 1 ? chipGroup(statuses, 'status', '全部状态') : null,
        count
      ),
      shelf, emptyEl
    ),
    footer()
  );
  updateList();
  window.scrollTo(0, 0);
}

/* ---------- reader ---------- */
function paragraphs(text){
  return text.split('\n').map(function(l){ return l.trim(); }).filter(Boolean).map(function(l){
    if(/^(\*\s*){3,}$/.test(l) || /^-{3,}$/.test(l)) return h('p', { class:'ornament', role:'separator' }, '* * *');
    if(l.indexOf('## ')===0) return h('h2', { class:'sect' }, l.slice(3));
    return h('p', null, l);
  });
}

function renderReader(id, chNum){
  var w = WORKS.filter(function(x){ return x.id === id; })[0];
  if(!w){ go('#/'); return; }
  var n = w.chapters.length;
  var ci = clamp((chNum || 1) - 1, 0, n - 1);
  var ch = w.chapters[ci];
  var multi = n > 1;
  document.title = w.title + (multi ? ' · ' + ch.title : '') + ' · ' + SITE.title;

  var bar = h('i');
  var progress = h('div', { class:'progress', 'aria-hidden':'true' }, bar);

  function chapterHref(i){ return '#/w/' + w.id + '/' + (i + 1); }

  var tocBtn = null, toc = null;
  if(multi){
    toc = h('nav', { class:'toc', 'aria-label':'目录', hidden:true },
      h('ol', null, w.chapters.map(function(c, i){
        return h('li', null, h('a', { href:chapterHref(i), 'aria-current': String(i === ci) }, pad(i + 1) + ' ' + c.title));
      })));
    tocBtn = h('button', { class:'btn', type:'button', 'aria-expanded':'false' }, '目录');
    tocBtn.addEventListener('click', function(){
      var open = toc.hidden;
      toc.hidden = !open;
      tocBtn.setAttribute('aria-expanded', String(open));
    });
  }

  var fontBtn = h('button', { class:'btn', type:'button' });
  function updFont(){ fontBtn.textContent = '字体：' + FONTS[ff].label; }
  updFont();
  fontBtn.addEventListener('click', function(){
    var keys = Object.keys(FONTS);
    ff = keys[(keys.indexOf(ff) + 1) % keys.length];
    store.set('fw:ff', ff); applyRead(); updFont();
  });
  function sizeBtn(label, delta, name){
    var b = h('button', { class:'btn', type:'button', 'aria-label':name }, label);
    b.addEventListener('click', function(){ fs = clamp(fs + delta, 15, 28); store.set('fw:fs', fs); applyRead(); });
    return b;
  }

  var prev = h('a', { class:'btn', href: ci > 0 ? chapterHref(ci - 1) : '#/w/' + w.id, 'aria-disabled': String(ci === 0) }, '← 上一章');
  var next = h('a', { class:'btn', href: ci < n - 1 ? chapterHref(ci + 1) : '#/', 'aria-disabled': String(ci === n - 1) }, '下一章 →');
  if(!multi){ prev.hidden = true; next.hidden = true; }

  var last = ci === n - 1;

  app.replaceChildren(
    progress,
    h('header', { class:'top reader-top' },
      h('div', { class:'shell', style:'display:flex;align-items:center;gap:12px;flex-wrap:wrap;width:100%;padding-block:0' },
        h('a', { class:'btn', href:'#/' }, '← 作品列表'),
        h('span', { class:'ttl' }, w.title),
        h('div', { class:'ctrl' }, sizeBtn('A−', -1, '缩小字号'), sizeBtn('A+', 1, '放大字号'), fontBtn, themeButton(), tocBtn)
      )
    ),
    toc,
    h('main', { class:'shell' },
      h('article', { class:'page' },
        h('p', { class:'kicker' }, multi ? 'Chapter ' + pad(ci + 1) + ' / ' + pad(n) : [w.fandom, w.pairing].filter(Boolean).join(' / ')),
        h('h1', null, w.title),
        multi ? h('p', { class:'chtitle' }, ch.title) : h('p', { class:'chtitle mono' }, w.words.toLocaleString('en-US') + ' 字'),
        h('div', { class:'body' }, paragraphs(ch.text)),
        last ? h('p', { class:'end' }, w.status === '连载中' ? '— 未完待续 —' : '— 全文完 —') : null,
        (last && w.fullVersion) ? h('p', { class:'end' }, h('a', { href:w.fullVersion, target:'_blank', rel:'noopener noreferrer' }, '完整版见 AO3 ↗（需要能访问 AO3 的网络）')) : null
      ),
      h('nav', { class:'pager', 'aria-label':'章节切换' }, prev, next)
    ),
    footer()
  );

  /* scroll position: progress bar, remember place, restore on "continue" */
  var ticking = false, saveTimer = null;
  function ratio(){
    var max = document.documentElement.scrollHeight - window.innerHeight;
    return max > 0 ? clamp(window.scrollY / max, 0, 1) : 1;
  }
  function onScroll(){
    if(ticking) return;
    ticking = true;
    requestAnimationFrame(function(){
      ticking = false;
      var r = ratio();
      bar.style.transform = 'scaleX(' + r + ')';
      clearTimeout(saveTimer);
      saveTimer = setTimeout(function(){
        store.set('fw:pos:' + w.id, (last && r > 0.97) ? null : { ch:ci, r:Math.round(r * 100) / 100 });
      }, 400);
    });
  }
  function onKey(e){
    if(e.metaKey || e.ctrlKey || e.altKey) return;
    var t = e.target && e.target.tagName;
    if(t === 'INPUT' || t === 'SELECT' || t === 'TEXTAREA') return;
    if(e.key === 'ArrowLeft' && ci > 0) go(chapterHref(ci - 1));
    if(e.key === 'ArrowRight' && ci < n - 1) go(chapterHref(ci + 1));
  }
  window.addEventListener('scroll', onScroll, { passive:true });
  document.addEventListener('keydown', onKey);
  cleanup = function(){
    clearTimeout(saveTimer);
    window.removeEventListener('scroll', onScroll);
    document.removeEventListener('keydown', onKey);
  };

  if(pendingRatio != null){
    var r0 = pendingRatio; pendingRatio = null;
    window.scrollTo(0, r0 * (document.documentElement.scrollHeight - window.innerHeight));
  } else {
    window.scrollTo(0, 0);
  }
  onScroll();
}

/* ---------- router ---------- */
function route(){
  if(cleanup){ cleanup(); cleanup = null; }
  var m = /^#\/w\/([^\/]+)(?:\/(\d+))?\/?$/.exec(cur);
  if(m) renderReader(decodeURIComponent(m[1]), m[2] ? parseInt(m[2], 10) : 1);
  else renderHome();
}
var cur = '#/';
try{ cur = location.hash || '#/'; }catch(e){}
function go(hash){
  cur = hash;
  try{ if(location.hash !== hash) history.replaceState(null, '', hash); }catch(e){}
  route();
}
document.addEventListener('click', function(e){
  var a = e.target.closest && e.target.closest('a[href^="#/"]');
  if(!a || e.metaKey || e.ctrlKey || e.shiftKey || e.button) return;
  e.preventDefault();
  if(a.getAttribute('aria-disabled') === 'true') return;
  go(a.getAttribute('href'));
});
window.addEventListener('hashchange', function(){ cur = location.hash || '#/'; route(); });
route();
})();
</script>
</body>
</html>
